        description: Everything we intend to build. A card leaves Review only when the change is actually live.
        columns:
          - name: Ideas
            category: backlog
          - name: Building
            category: active
            wipLimit: 2
          - name: Review
            category: review
            slaHours: 48
          - name: Shipped
            category: done
          - name: Dropped
            category: dismissed
        fields:
