    name: People Agent
    description: Screens applicants against the role, schedules interviews, and runs onboarding.
    agent:
      model: auto
      heartbeat:
        enabled: true
        interval: 14400
      capabilities:
        boardsEnabled: true
        boardAdminEnabled: false
        teamChatEnabled: true
