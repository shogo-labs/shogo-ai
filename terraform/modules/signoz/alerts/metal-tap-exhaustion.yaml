# SigNoz alert: metal host approaching its VM address-space limit
#
# Apply via SigNoz UI ("Alert Rules" -> "New Alert Rule" -> Import) or the
# SigNoz HTTP API (POST /api/v1/rules with this body wrapped in a `data` field).
#
# Why: a host's microVMs each take a /30 out of 172.16.0.0/16 — 16384 in total —
# and at 100% it simply cannot start another VM (every /assign there fails, the
# 2026-07 US-region failure mode). MetalTapLeak covers devices leaking; this
# covers the space running out for ANY reason, including an entirely legitimate
# one: suspended snapshots keep their tap so they can restore cheaply, and a
# production DAL host already sits at ~3500 of them (~22%) with nothing wrong.
# Cache growth alone can therefore reach the ceiling, and it would arrive with no
# other warning sign.
#
# 80% leaves several thousand free blocks — hours of headroom at any realistic
# fill rate — so this is a warning to act on, not a page in the middle of the
# outage it predicts.
#
# Metric names: OTel dots become underscores in SigNoz PromQL
# (metal.host.tap_used_pct -> metal_host_tap_used_pct). Heartbeats round-robin
# across API replicas, so aggregate with `max by (host_id)` to dedupe the same
# host reported by multiple pods.

alert: MetalTapExhaustion
ruleType: threshold_rule
condition:
  compositeQuery:
    queryType: promql
    promQueries:
      A:
        query: |
          max by (host_id) (metal_host_tap_used_pct)
        legend: "{{host_id}} tap_used_pct"
        disabled: false
  op: ">"
  target: 80
  matchType: "3" # on-average-during
  selectedQuery: A
evalWindow: "15m0s"
frequency: "5m0s"
labels:
  severity: critical
  team: platform
  incident_class: metal
annotations:
  summary: "Metal host has 80%+ of its 16384 VM address slots (tap devices) in use"
  description: |
    A metal host is running out of /30 blocks for microVMs. At 100% it cannot
    start another VM and every /assign routed there fails.

    Triage:
    1. Split leak from legitimate growth:
       `curl -s localhost:${METAL_AGENT_PORT}/vms | jq '.available, (.assigned|length), .cache.localCount'`.
       If in-use is close to warm + assigned + suspended, the space is genuinely
       occupied (usually a very large local snapshot cache) — reclaim it by
       tightening GC/eviction (cacheMaxBytes, durable tiering) rather than
       hunting a leak.
    2. If in-use far exceeds that sum, this is a leak: see MetalTapLeak.
    3. Cordon the host from the super-admin fleet panel so it stops taking new
       placements while it drains; siblings absorb.

    Runbook: docs/runbooks/metal-fleet.md (tap / address-space exhaustion).
