# SigNoz alert: metal host is leaking tap devices
#
# Apply with `bun scripts/signoz-apply-alerts.ts` (POST /api/v2/rules). The schema
# notes in metal-tap-exhaustion.yaml apply here too — dotted metric names, builder
# queries only (PromQL sees nothing), v2alpha1, and a channel that really exists.
#
# Why: every microVM holds a /30 out of 172.16.0.0/16, so a host has 16384 slots.
# A tap that outlives its VM is never reused, and in 2026-07 that slow drip walked
# the allocator index past the end of the space and produced addresses like
# 172.16.8282.225 — `ip addr add` rejected them and every /assign on the two US
# hosts failed. v1.13.27 fixes the known leaks (snapshot eviction now tears the
# tap down, plus a periodic orphan sweep) and the allocator now refuses to derive
# an out-of-range address instead of emitting a broken one. This alert is here to
# catch the NEXT leak path, which is why it measures the discrepancy rather than
# the raw count.
#
# The signal is in-use minus accounted-for: taps the host holds that no warm,
# assigned, or suspended VM claims. That is leak-specific by construction, so it
# stays near zero on a healthy host no matter how busy it is — unlike raw
# utilisation, which is legitimately high when the snapshot cache is large (a
# production DAL host sat at 22% with ~3500 valid suspended VMs).
#
# 250 over 30m tolerates the transient overlap of a boot that has created its tap
# but not yet registered its VM, while still firing about a day before a leak of
# the observed 2026-07 rate could exhaust the space.

alert: MetalTapLeak
alertType: METRIC_BASED_ALERT
ruleType: threshold_rule
schemaVersion: v2alpha1
version: v5
condition:
  compositeQuery:
    panelType: graph
    queryType: builder
    queries:
      # A–D are the raw gauges, all disabled: only the formula is evaluated.
      # Heartbeats round-robin across API replicas, so max collapses the
      # duplicate reports of one host to a single value.
      - type: builder_query
        spec:
          name: A
          signal: metrics
          disabled: true
          aggregations:
            - metricName: metal.host.taps_in_use
              spaceAggregation: max
              timeAggregation: max
          groupBy:
            - name: host_id
              fieldContext: attribute
              fieldDataType: string
          stepInterval: 60s
      - type: builder_query
        spec:
          name: B
          signal: metrics
          disabled: true
          aggregations:
            - metricName: metal.host.available
              spaceAggregation: max
              timeAggregation: max
          groupBy:
            - name: host_id
              fieldContext: attribute
              fieldDataType: string
          stepInterval: 60s
      - type: builder_query
        spec:
          name: C
          signal: metrics
          disabled: true
          aggregations:
            - metricName: metal.host.assigned
              spaceAggregation: max
              timeAggregation: max
          groupBy:
            - name: host_id
              fieldContext: attribute
              fieldDataType: string
          stepInterval: 60s
      - type: builder_query
        spec:
          name: D
          signal: metrics
          disabled: true
          aggregations:
            - metricName: metal.host.suspended
              spaceAggregation: max
              timeAggregation: max
          groupBy:
            - name: host_id
              fieldContext: attribute
              fieldDataType: string
          stepInterval: 60s
      - type: builder_formula
        spec:
          name: F1
          expression: A - (B + C + D)
          legend: "{{host_id}} leaked_taps"
  selectedQueryName: F1
  thresholds:
    kind: basic
    spec:
      - name: critical
        op: above
        matchType: on_average
        target: 250
        channels: [platform-oncall]
evaluation:
  kind: rolling
  spec:
    evalWindow: 30m
    frequency: 5m
labels:
  severity: critical
  team: platform
  incident_class: metal
notificationSettings:
  groupBy: [host_id]
  renotify:
    enabled: true
    interval: 4h
    alertStates: [firing]
annotations:
  summary: "Metal host holds 250+ tap devices that no VM claims (leak)"
  description: |
    A metal host holds far more tap devices than its warm + assigned + suspended
    VMs account for. Left alone this walks the allocator out of 172.16.0.0/16 and
    every /assign on the host starts failing.

    Triage:
    1. Confirm on the host:
       `ip -o link show | grep -c '^.*fctap'` versus
       `curl -s localhost:${METAL_AGENT_PORT}/vms | jq '.available + (.assigned|length) + (.cache.localCount // 0)'`.
    2. Count the safely-reclaimable ones — no process holds a NO-CARRIER tap:
       `ip -o link show | grep fctap | grep -c NO-CARRIER`.
    3. The agent's own sweep should already be doing this; check whether it is
       running and what it decided:
       `journalctl -u metal-agent -n 200 | grep -i 'tap.*reap'`.
       If the sweep is disabled or wedged, that is the bug — the leak is
       secondary.
    4. Only if the sweep cannot run, drain manually, NO-CARRIER devices first,
       and never touch a tap that carries traffic:
       `ip link del fctapN`.

    Runbook: docs/runbooks/metal-fleet.md (tap / address-space exhaustion).
