# SigNoz alert: cross-region replication monitor reporting a failure
#
# Apply with `bun scripts/signoz-apply-alerts.ts`. Schema notes: see the module
# README (builder queries not PromQL, v2alpha1, real channel).
#
# Why: `k8s/cnpg/logical-replication/replication-monitor.yaml` is a per-region
# CronJob (every 5 min) that exits NON-ZERO on any replication-health failure
# class — stopped apply worker, disabled subscription, inactive/bloated slot,
# apply lag > 5 min, unpublished table, stale subscription, or a missing
# _prisma_migrations REPLICA trigger. It correctly turns the K8s Job red on
# those conditions.
#
# BUT nothing paged on that red Job. The deploy.yml and warm-pool-monitor
# comments referred to "the existing kube_job_status_failed alert" that was never
# actually created, so during the 2026-06/07 mesh incident the
# replication-monitor Jobs sat in `Failed` for 8 days / 35h / 23h across the
# three regions without paging anyone — the exact "ran 15 hours undetected"
# failure the monitor was built to prevent (incident 2026-05-26).
#
# 2026-11-05 (SHO-344): the mesh was down 3.5h and this alert stayed `inactive`
# the whole time. The old rule alerted on the ABSENCE of a green run
# (`count(exit=0) below 1`, `alertOnAbsent: true`, grouped by cluster). That
# shape cannot fire for a single broken region: a cluster with zero green runs
# produces NO series, so it is never "below 1"; and because another cluster
# (staging/EU) still had green series, the rule was not "absent" either. The
# broken region was invisible.
#
# So this rule now alerts on the PRESENCE of a failure marker per cluster:
# `Monitor complete (exit=1)` or any `CRITICAL:` line. A failing region always
# emits one of those, so it always has a series, and `in_total > 0` over the
# 15-minute window fires. `alertOnAbsent` is deliberately OFF — a healthy
# cluster emits no failure marker, and treating that as "absent" would page on
# every green region.
#
# Trade-off: a monitor that stops running entirely emits no failure marker, so
# this rule does not catch "the CronJob is gone". That case is covered by the
# K8s Job-failed signal and by the fact that a dead monitor cannot hide a
# broken mesh for long — but it is a known gap, not an oversight.
#
# The pod-name filter matters: k8s/base/warm-pool-monitor.yaml prints a
# byte-identical completion line, so matching on the body alone would stay green
# on warm-pool-monitor runs while replication-monitor was dead.

alert: ReplicationMonitorFailing
alertType: LOGS_BASED_ALERT
ruleType: threshold_rule
schemaVersion: v2alpha1
version: v5
condition:
  compositeQuery:
    panelType: graph
    queryType: builder
    queries:
      - type: builder_query
        spec:
          name: A
          signal: logs
          aggregations:
            - expression: count()
          filter:
            expression: "k8s.pod.name LIKE 'replication-monitor%' AND (body LIKE '%Monitor complete (exit=1)%' OR body LIKE '%CRITICAL:%')"
          groupBy:
            - name: k8s.cluster.name
              fieldContext: resource
              fieldDataType: string
          legend: "{{k8s.cluster.name}} failing_runs"
          # One bucket per scheduled run.
          stepInterval: 300s
  selectedQueryName: A
  thresholds:
    kind: basic
    spec:
      - name: critical
        op: above
        matchType: in_total
        target: 0
        channels: [platform-oncall]
  # OFF on purpose: a healthy cluster emits no failure marker, so "absent" would
  # page on every green region. See the header note.
  alertOnAbsent: false
evaluation:
  kind: rolling
  spec:
    evalWindow: 15m
    frequency: 1m
labels:
  severity: critical
  team: platform
  incident_class: logical_replication
notificationSettings:
  groupBy: [k8s.cluster.name]
  renotify:
    enabled: true
    interval: 4h
    alertStates: [firing]
annotations:
  summary: "replication-monitor reported a failure in a region (the mesh may be broken)"
  description: |
    A region's cross-region replication-monitor CronJob exited non-zero (or
    printed a CRITICAL line) in the last 15 minutes. The monitor fails on any
    of: a subscription apply worker stopped or disabled, an inactive/bloated
    replication slot, apply lag over 5 minutes, a public table missing from the
    publication, a subscription trailing the local publication (missing
    REFRESH), or the _prisma_migrations REPLICA trigger being absent.

    Triage:
    1. Find the failing region + read the last run:
       kubectl get jobs -n shogo-production-system | grep replication-monitor
       kubectl logs -n shogo-production-system job/<newest replication-monitor job>
    2. The log names the exact failing class (STOPPED sub, inactive slot,
       >100MB WAL lag, apply lag, unpublished table, stale sub, missing prisma
       trigger).
    3. Check every region's subscriptions:
       kubectl exec -n shogo-production-system <platform-pg pod> -c postgres -- \
         psql -U postgres -d shogo -c \
         "SELECT subname, subenabled FROM pg_subscription ORDER BY subname;"
    4. For a disabled sub / poison-pill conflict, follow
       k8s/cnpg/logical-replication/RUNBOOK.md step 9 (skip the LSN or fix the
       duplicate row). The conflict watchdog automates the known-safe skips.
    5. If the Jobs are green but this fired, suspect log collection itself —
       check LogCollectionAgentDown before chasing the mesh.

    Runbook: k8s/cnpg/logical-replication/RUNBOOK.md
    Plan: docs/runbooks/mesh-durably-healthy-plan.md
