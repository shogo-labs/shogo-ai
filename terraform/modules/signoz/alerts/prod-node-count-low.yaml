# SigNoz alert: production node count below declared minimum
#
# Apply with `bun scripts/signoz-apply-alerts.ts`. Schema notes: see the module
# README (dotted metric names, builder queries not PromQL, v2alpha1, real
# channel).
#
# Why: the b11c65dd incident root-cause was a single-node prod-us cluster despite
# terraform declaring `system_pool_min = 2`. Live state had drifted (autoscaler
# scaled past min during a quiet window OR an OCI VM died and didn't get
# replaced) and we had no alert on the drift. This rule catches it within 5
# minutes.
#
# As of 2026-06-02 (run 26865807851) the autoscaler MIN floor is wired to the
# live deploy via vars.NODE_POOL_MIN (deploy.yml "Deploy Cluster Autoscaler" ->
# k8s/base/cluster-autoscaler.yaml `--nodes`), so the old "autoscaler hardcoded
# to 1, ignores terraform min" drift class should no longer occur. A breach now
# means an OCI VM died and wasn't replaced, or the deploy hasn't re-applied the
# floor yet.
#
# SIGNAL CHANGE: this used to be count(kube_node_info{cluster="oke-production-us"}).
# kube-state-metrics is not deployed on these clusters (only the OTel k8s-infra
# collector), so kube_node_info does not exist — and the cluster label was wrong
# too: SigNoz knows the prod-us cluster as `shogo-production`, not
# `oke-production-us`. It now sums `k8s.node.condition_ready`, which is 1 per
# ready node, so the rule catches a node going NotReady as well as a node
# disappearing — both starve the pool the same way. Currently reads exactly 4.
#
# Threshold mirrors the rollout-headroom bump: prod-us min is 4. When you adjust
# min in terraform/environments/production-us/main.tf (and the matching
# NODE_POOL_MIN GitHub var), update this threshold.

alert: ProdNodeCountBelowMin
alertType: METRIC_BASED_ALERT
ruleType: threshold_rule
schemaVersion: v2alpha1
version: v5
condition:
  compositeQuery:
    panelType: graph
    queryType: builder
    queries:
      - type: builder_query
        spec:
          name: A
          signal: metrics
          aggregations:
            - metricName: k8s.node.condition_ready
              timeAggregation: max
              spaceAggregation: sum
          filter:
            expression: "k8s.cluster.name = 'shogo-production'"
          legend: ready_nodes
          stepInterval: 60s
  selectedQueryName: A
  thresholds:
    kind: basic
    spec:
      - name: critical
        op: below
        matchType: all_the_times
        target: 4
        channels: [platform-oncall]
  # A cluster that stops reporting nodes at all is the worst case, and a "below"
  # threshold never fires on an absent series.
  alertOnAbsent: true
  absentFor: 10
evaluation:
  kind: rolling
  spec:
    evalWindow: 5m
    frequency: 1m
labels:
  severity: critical
  team: platform
  cluster: shogo-production
notificationSettings:
  renotify:
    enabled: true
    interval: 1h
    alertStates: [firing]
annotations:
  summary: "shogo-production (prod-us) has fewer than 4 ready nodes"
  description: |
    Ready node count has dropped below the terraform-declared
    `system_pool_min = 4`. Either:
      (a) An OCI VM has died and the node pool isn't replacing it.
          Check OCI Console -> OKE -> oke-production-us -> Node Pools.
      (b) A node is up but NotReady (kubelet/disk/network) — find it with
          `kubectl get nodes` and check its conditions.
      (c) The cluster autoscaler is ignoring the min floor. Check
          autoscaler logs (and confirm `--nodes` MIN matches
          vars.NODE_POOL_MIN=4):
            kubectl logs -n kube-system deployment/cluster-autoscaler

    Without 4+ nodes the warm-pool churn during a deploy will starve paying
    users on `Insufficient memory`, and a new revision's `min-scale: 2` pods may
    force a COLD node to be provisioned mid-rollout (the cold-pull-mid-rollout
    failure class).

    Runbook: docs/runbooks/deploy-prod.md
