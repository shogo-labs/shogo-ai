# SigNoz alert: metal no-live-host fallback
#
# Apply with `bun scripts/signoz-apply-alerts.ts`. Schema notes: see the module
# README (dotted metric names, builder queries not PromQL, v2alpha1, real
# channel).
#
# Why: getMetalProjectUrl increments metal.no_host every time it finds NO live
# metal host for a metal-eligible project. In fallback mode this silently routes
# to Knative (slow cold start); in metal-only mode it becomes a user-facing 503.
# Either way sustained no_host means the fleet is (partly) down: agents crashed,
# heartbeats not landing, the mesh is broken, or every host is cordoned. This is
# the earliest fleet-health signal that doesn't need per-host inspection.
#
# WHY LOGS, NOT THE METRIC (rewritten 2026-10-24): metal.no_host is a counter
# whose healthy state is an ABSENT series — it only materialises once something
# increments it. `increase` therefore reads 0 at every step across exactly the
# interval that produced a burst: the first re-materialised sample already
# carries the whole delta, so there is no step where the delta appears. The
# 2026-10-24T05:22Z fleet event — 26 fallbacks — read increase=0 on every step
# and this rule never fired. The API logs the same failure for every fallback
# (`NoMetalHostError` -> body "no live metal host available"), so the reliable
# signal is a count() over that log body, not the metric. The counter itself is
# unchanged; this rule just stops depending on it. Counting logs also has no
# absent-series problem: a healthy hour matches zero lines, and the first real
# fallback lands in the window. The live rule was hand-edited to this shape on
# 2026-10-24; this file codifies it so a fresh apply cannot revert it.

alert: MetalNoHostFallback
alertType: LOGS_BASED_ALERT
ruleType: threshold_rule
schemaVersion: v2alpha1
version: v5
condition:
  compositeQuery:
    panelType: graph
    queryType: builder
    queries:
      - type: builder_query
        spec:
          name: A
          signal: logs
          aggregations:
            - expression: count()
          filter:
            # The NoMetalHostError message, as logged by the API on every
            # fallback. A healthy hour logs nothing, so the count is 0.
            expression: "body LIKE '%no live metal host%'"
          legend: no_host_fallbacks
          stepInterval: 60s
  selectedQueryName: A
  thresholds:
    kind: basic
    spec:
      - name: critical
        op: above
        # 5 fallbacks anywhere in the window, not a sustained rate: a handful of
        # unplaceable projects already means the fleet is partly unreachable.
        matchType: in_total
        target: 5
        channels: [platform-oncall]
evaluation:
  kind: rolling
  spec:
    evalWindow: 5m
    frequency: 1m
labels:
  severity: critical
  team: platform
  incident_class: metal
notificationSettings:
  renotify:
    enabled: true
    interval: 1h
    alertStates: [firing]
annotations:
  summary: "Metal routing found no live host (5+ fallbacks in 5m)"
  description: |
    getMetalProjectUrl is failing to find a live metal host for metal-eligible
    projects. In fallback mode these projects are silently taking the slow
    Knative cold-start path; in metal-only mode users are getting 503s.

    Triage:
    1. Super-admin fleet panel: how many hosts are live vs desired? Any drift?
       Cross-check the metal.host.up count per region on the dashboard.
    2. If hosts are up but not registering: the heartbeat POST
       /api/internal/metal/register is failing (token mismatch, mesh down, API
       unreachable). Check agent logs for `register` warnings and the WireGuard
       mesh (`wg show`).
    3. If every host is cordoned (e.g. a botched drain), uncordon at least one.
    4. If agents genuinely crashed, `systemctl status metal-agent` on the hosts.

    Runbook: docs/runbooks/metal-fleet.md
