# SigNoz alert: metal wake latency high
#
# Apply with `bun scripts/signoz-apply-alerts.ts`. Schema notes: see the module
# README (dotted metric names, builder queries not PromQL, v2alpha1, real
# channel).
#
# Why: the entire reason for the metal substrate is instant sleep/wake — a warm
# resume from a local NVMe snapshot is sub-second, an S3 pull a few seconds. If
# p95 wake latency climbs, users are back to cold-start-feeling loads: either
# local snapshots are missing (everything pulling from S3), S3 hydration is slow,
# or the host is saturated. `metal.wake_latency_ms` is the host-reported
# restore->ready time (the user-facing wake cost); p95 currently sits around
# 250–500ms, so the 15s threshold is far above normal.
#
# HISTOGRAM QUERYING: SigNoz exposes the OTel histogram as separate
# `metal.wake_latency_ms.{bucket,count,sum,min,max}` series. Percentiles read the
# `.bucket` series with a percentile spaceAggregation and NO timeAggregation —
# the base name `metal.wake_latency_ms` returns nothing.

alert: MetalWakeLatencyHigh
alertType: METRIC_BASED_ALERT
ruleType: threshold_rule
schemaVersion: v2alpha1
version: v5
condition:
  compositeQuery:
    panelType: graph
    queryType: builder
    unit: ms
    queries:
      - type: builder_query
        spec:
          name: A
          signal: metrics
          aggregations:
            - metricName: metal.wake_latency_ms.bucket
              spaceAggregation: p95
          legend: wake_p95_ms
          stepInterval: 60s
  selectedQueryName: A
  thresholds:
    kind: basic
    spec:
      - name: warning
        op: above
        matchType: on_average
        target: 15000
        channels: [platform-oncall]
evaluation:
  kind: rolling
  spec:
    evalWindow: 10m
    frequency: 1m
labels:
  severity: warning
  team: platform
  incident_class: metal
notificationSettings:
  renotify:
    enabled: true
    interval: 12h
    alertStates: [firing]
annotations:
  summary: "Metal wake p95 above 15s for 10+ minutes"
  description: |
    p95 project wake latency on metal has been above 15s for 10+ minutes. The
    sleep/wake promise is broken — users feel cold starts.

    Triage:
    1. Metal fleet dashboard: is this one host or fleet-wide? Check
       metal.host.disk_used_pct (GC evicting local snapshots -> everything falls
       back to slower S3 pulls) and metal.host.util_pct (host saturated).
    2. Check the assignment mix (metal.assignments by `source`) — a spike in
       `store`/`none` vs `local` means the local cache is cold.
    3. Look at metal.cold_miss — brand-new projects (no snapshot yet) pay a full
       cold boot; a burst of new projects inflates p95 legitimately.
    4. If a single host is saturated, cordon it to shed new placements and let
       burst capacity (or a sibling host) absorb the load.

    Runbook: docs/runbooks/metal-fleet.md
