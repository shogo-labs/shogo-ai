map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# PERF-5: /_expo assets are precompressed at build time
# (scripts/precompress-assets.mjs writes <file>.br at q11 and <file>.gz at -9).
# $expo_br_suffix picks the .br copy for clients that accept brotli (Cloudflare
# always asks the origin for `br, gzip` and passes origin br through as-is).
map $http_accept_encoding $expo_br_suffix {
    default                      "";
    "~*(^|[\s,])br($|[\s,;])"  ".br";
}

# try_files rewrites $uri to the file it served, so this is "br" only when the
# .br copy was actually sent (small files have no .br and fall back to $uri).
map $uri $expo_content_encoding {
    default  "";
    "~\.br$" br;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver (configurable - Docker uses 127.0.0.11, K8s uses kube-dns)
    resolver ${DNS_RESOLVER} valid=10s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # NOTE: security headers (X-Frame-Options etc.) are intentionally NOT set at
    # server scope. The /api/ proxy below would inherit them and clobber the
    # API's per-route framing decisions — the API (Hono secureHeaders) sets
    # X-Frame-Options: SAMEORIGIN for normal routes but DROPS it for embeddable
    # routes (preview render, agent canvas). A server-level add_header re-blocked
    # the preview iframe with a second SAMEORIGIN. Framing/MIME headers now live
    # in the SPA app-shell location below; /api/ passes the API's own through.

    # Proxy /api requests to the API service
    location ^~ /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 500m;
    }

    # Expo's generated _expo assets are content-addressed. The root favicon,
    # manifest, and other copied assets are not, so they must revalidate.
    location ^~ /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Serve the build-time .br / .gz copies instead of gzipping on the fly.
        # `types` keeps the original MIME type when try_files picks foo.js.br;
        # `gzip off` stops nginx from gzipping an already-brotli body.
        location ~ \.js$ {
            types { application/javascript js br; }
            gzip off;
            gzip_static on;
            gzip_vary off;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            add_header Content-Encoding $expo_content_encoding;
            try_files $uri$expo_br_suffix $uri =404;
        }

        location ~ \.css$ {
            types { text/css css br; }
            gzip off;
            gzip_static on;
            gzip_vary off;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            add_header Content-Encoding $expo_content_encoding;
            try_files $uri$expo_br_suffix $uri =404;
        }
    }

    location = /favicon.ico {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /manifest.json {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # SPA fallback — all non-file routes go to index.html.
    # App-shell security headers live here (not at server scope) so they apply to
    # the Studio HTML without leaking onto proxied /api/ responses.
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
