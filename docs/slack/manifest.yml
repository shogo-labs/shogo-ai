display_information:
  name: Shogo
  description: Route requests to your Shogo projects and run an AI agent in Slack.
  background_color: "#4F46E5"

features:
  bot_user:
    display_name: Shogo
    always_online: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: Shogo routes your request to an enabled project and works with you in a Slack thread.
    suggested_prompts:
      - title: List my projects
        message: "list my projects"
      - title: Configure project access
        message: "settings"
      - title: Start a project task
        message: "agent Help me plan and implement this task."

oauth_config:
  redirect_urls:
    - https://<your-public-host>/api/integrations/slack/callback
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - team:read
      - users:read
      - assistant:write

settings:
  event_subscriptions:
    request_url: https://<your-public-host>/api/integrations/slack/events
    bot_events:
      - app_home_opened
      - app_context_changed
      - message.im
      - app_mention
      - agent_session_stopped
  interactivity:
    is_enabled: true
    request_url: https://<your-public-host>/api/integrations/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
  is_hosted: true
