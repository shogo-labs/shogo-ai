# =============================================================================
# Android Build & Update Pipeline
# =============================================================================
# Environments:
#   staging    — push to main branch (auto OTA to staging channel)
#   production — push v* (unified release tag, e.g. v1.13.34) or android-v* (Android-only)
#                or manual dispatch with environment=production
#   Marketing version is taken from the git tag (same as desktop-release-*),
#   not from the placeholder in apps/mobile/app.json.
#
# Automatic (push to main):
#   - Resolves native fingerprint to detect if native deps changed
#   - If fingerprint matches the last successful build → OTA update (eas update)
#   - If fingerprint changed → full native build (expo prebuild + Gradle)
#
# Manual (workflow_dispatch):
#   mode=full → fingerprint check, then build or OTA, with Play Store submit
#   mode=ota  → fingerprint check, OTA update only (skips build)
#   environment=staging|production → controls OTA branch + build channel
#   Production builds always auto-submit to production track on Google Play.
#   Staging builds submit to internal track (can be toggled off with submit=false).
#
# Both build and OTA run on the same GitHub runner environment, so the
# fingerprint hash is always consistent (no EAS server mismatch).
# Fingerprint caches are per-environment so staging and production are independent.
#
# Required GitHub Secrets:
#   EXPO_TOKEN                  - Expo token for eas update / eas submit
#   KEYSTORE_BASE64             - Base64-encoded Android release signing keystore
#   KEYSTORE_PASSWORD           - Keystore password
#   KEY_ALIAS                   - Key alias within the keystore
#   KEY_PASSWORD                - Key password
#   FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 - Base64-encoded Firebase client config for ai.shogo.mobile
#   PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64      - Base64-encoded Play publishing key (preferred name)
#   GOOGLE_SERVICES_JSON_BASE64                 - Legacy Play key secret; used as a fallback
# =============================================================================

name: Android Build & Update

on:
  push:
    branches:
      - main
    tags:
      - 'android-v*'
      - 'v[0-9]*'
    # No `paths` filter: GitHub ANDs tags with paths, so a unified `v*` tag
    # whose commit did not touch apps/mobile would skip this workflow and
    # ship Play Store as the app.json placeholder instead of the tag.
    # Main-branch path filtering lives in the `gate` job.
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = build or OTA + submit · ota = OTA update only'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - ota
      environment:
        description: 'Target environment (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      submit:
        description: 'Submit to Play Store — full mode only (staging→internal, production→production track)'
        required: false
        default: true
        type: boolean

jobs:
  # ===========================================================================
  # Skip main-branch pushes that do not touch mobile / this workflow.
  # Tags and workflow_dispatch always continue.
  # ===========================================================================
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.paths.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Skip unrelated main-branch changes
        id: paths
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/mobile-workflow-should-run.sh android.yml

  # ===========================================================================
  # Check if native code changed
  # ===========================================================================
  check-fingerprint:
    name: Check Native Fingerprint
    needs: gate
    if: ${{ needs.gate.outputs.skipped != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.decide.outputs.needs_build }}
      runtime_version: ${{ steps.fingerprint.outputs.runtime_version }}
      environment: ${{ steps.resolve-env.outputs.environment }}
      app_version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Resolve environment
        id: resolve-env
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/(android-v|v[0-9]) ]]; then
            ENV="production"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="staging"
          else
            ENV="staging"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Resolved environment: $ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true

      - name: Resolve app version from git tag
        id: resolve-version
        env:
          MOBILE_RELEASE_ENV: ${{ steps.resolve-env.outputs.environment }}
        run: bash scripts/ci/resolve-mobile-app-version.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        # `GITHUB_TOKEN` is required so `@vscode/ripgrep`'s postinstall
        # authenticates its `api.github.com/repos/microsoft/ripgrep-prebuilt`
        # lookup. Without it, GitHub-hosted runners share the 60/hr anon
        # quota and this 403s intermittently. See
        # `scripts/check-ci-bun-install-token.ts` for the full writeup.
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Firebase Android client
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash scripts/ci/configure-android-firebase.sh

      - name: Resolve fingerprint
        id: fingerprint
        working-directory: apps/mobile
        run: |
          RAW=$(npx expo-updates runtimeversion:resolve --platform android 2>/dev/null || echo "")

          if [ -z "$RAW" ]; then
            echo "Could not resolve runtime version"
            echo "runtime_version=unknown" >> $GITHUB_OUTPUT
          else
            RUNTIME_VERSION=$(echo "$RAW" | sha256sum | cut -d' ' -f1)
            echo "Raw output: $RAW"
            echo "Fingerprint hash: $RUNTIME_VERSION"
            echo "runtime_version=$RUNTIME_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Restore cached fingerprint
        if: steps.fingerprint.outputs.runtime_version != 'unknown'
        id: cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .fingerprint-android
          key: android-fingerprint-${{ steps.resolve-env.outputs.environment }}-${{ steps.fingerprint.outputs.runtime_version }}

      # NOTE: cache is only saved from the build job after a SUCCESSFUL AAB build.
      # Seeding here previously caused failed builds to poison the cache and force
      # unintended OTA updates on subsequent runs at the same fingerprint.

      - name: Determine if build is needed
        id: decide
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/(android-v|v[0-9]) ]]; then
            echo "Tag push (${{ github.ref_name }}) → release event, forcing full build + submit"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.fingerprint.outputs.runtime_version }}" = "unknown" ]; then
            echo "Could not resolve fingerprint → forcing full build"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "Fingerprint cached from a previous successful build → OTA update only"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.mode }}" = "ota" ]; then
            echo "OTA mode: trusting no native changes"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "New fingerprint → full build required"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # OTA Update — JS/asset changes only (no native changes)
  # ===========================================================================
  update:
    name: EAS Update (OTA)
    runs-on: ubuntu-latest
    needs: check-fingerprint
    if: >
      needs.check-fingerprint.result == 'success' &&
      needs.check-fingerprint.outputs.needs_build == 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        # See the "Install dependencies" comment in the `check-fingerprint`
        # job for why GITHUB_TOKEN is required here.
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Firebase Android client
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash scripts/ci/configure-android-firebase.sh

      - name: Sync app version
        working-directory: apps/mobile
        run: |
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const newVersion = '${{ needs.check-fingerprint.outputs.app_version }}';
            if (newVersion && appJson.expo.version !== newVersion) {
              console.log('Syncing version: ' + appJson.expo.version + ' → ' + newVersion);
              appJson.expo.version = newVersion;
              fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\n');
            } else {
              console.log('Version already matches: ' + appJson.expo.version);
            }
          "

      - name: Build workspace packages
        run: bun run build

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve API URL for environment
        id: api-url
        run: |
          if [ "${{ needs.check-fingerprint.outputs.environment }}" = "production" ]; then
            echo "url=https://studio.shogo.ai" >> $GITHUB_OUTPUT
          else
            echo "url=https://studio.staging.shogo.ai" >> $GITHUB_OUTPUT
          fi

      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || format('Manual OTA from {0}', github.sha) }}
          EXPO_PUBLIC_API_URL: ${{ steps.api-url.outputs.url }}
          EXPO_PUBLIC_APP_ENV: ${{ needs.check-fingerprint.outputs.environment }}_app
          EXPO_PUBLIC_APP_VERSION: ${{ needs.check-fingerprint.outputs.app_version }}
          EXPO_PUBLIC_SENTRY_DSN_ANDROID: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN_ANDROID }}
          # Becomes the `release` tag for every Sentry event captured from
          # this OTA bundle (see apps/mobile/app/_layout.tsx). Without it
          # everything collapses into the `dev` release and sourcemaps never
          # match.
          EXPO_PUBLIC_BUILD_HASH: ${{ github.sha }}
        run: |
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1)
          eas update \
            --branch ${{ needs.check-fingerprint.outputs.environment }} \
            --message "$SUBJECT" \
            --non-interactive

      - name: Upload OTA sourcemaps to Sentry (fatal on a release build)
        # `eas update` publishes what `expo export` produces — a Hermes
        # bytecode bundle plus its composed map — so the upload has to come
        # from that same command. A separate `expo export:embed` re-bundle is
        # a different artifact (plain JS + packager map, and minified where
        # the shipped bundle is not), which is why OTA events came back
        # `js_no_source` (SHO-290). dist=`android` keeps it disjoint from the
        # iOS upload at the same SHA, and matches the `dist` `Sentry.init`
        # reports. `--source-maps true` is required for the same reason as the
        # iOS step: `expo export` writes no map unless asked, and `eas update`
        # passes the flag to its own export.
        #
        # Staging stays non-fatal, so a Sentry hiccup cannot block a staging
        # roll-out. A release build (a tag, or environment=production) is the
        # opposite: a missing token or a failed upload there means every event
        # from that bundle is unreadable (`index.android.bundle:1`), so it is
        # a failure — and every way out of this step is reported, because a
        # `::notice` that a step skipped is how this went unnoticed
        # (SHO-525 / Sentry SHOGO-ANDROID-11).
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: shogo-ai
          SENTRY_PROJECT: shogo-android
          SENTRY_LOG_LEVEL: info
          EXPO_PUBLIC_API_URL: ${{ steps.api-url.outputs.url }}
          EXPO_PUBLIC_APP_ENV: ${{ needs.check-fingerprint.outputs.environment }}_app
          EXPO_PUBLIC_APP_VERSION: ${{ needs.check-fingerprint.outputs.app_version }}
          EXPO_PUBLIC_SENTRY_DSN_ANDROID: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN_ANDROID }}
          EXPO_PUBLIC_BUILD_HASH: ${{ github.sha }}
          SENTRY_UPLOAD_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/') || needs.check-fingerprint.outputs.environment == 'production' }}
        run: |
          set +e
          # The only way out of this step on any failure. It always warns,
          # always leaves a section in the run summary, and fails the job when
          # the build is a release.
          skip_upload() {
            echo "::warning title=Sentry sourcemap upload (Android OTA)::$1 — skipping upload."
            {
              echo "## Sentry sourcemap upload (Android OTA)"
              echo ""
              echo "_SKIPPED — $1_"
              echo ""
              echo "Release: \`$EXPO_PUBLIC_BUILD_HASH\` (dist=\`android\`, environment=\`$EXPO_PUBLIC_APP_ENV\`)"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$SENTRY_UPLOAD_REQUIRED" = "true" ]; then
              echo "::error title=Sentry sourcemap upload (Android OTA)::Release build: this OTA bundle shipped without sourcemaps, so its stack traces can never be symbolicated."
              exit 1
            fi
            echo "Staging build: continuing without Android OTA symbolication."
            exit 0
          }
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            skip_upload "SENTRY_AUTH_TOKEN secret is not configured"
          fi
          BUNDLE_DIR="$RUNNER_TEMP/ota-android-export"
          rm -rf "$BUNDLE_DIR"
          bunx expo export \
            --platform android \
            --output-dir "$BUNDLE_DIR" \
            --source-maps true \
            --clear
          EXPORT_RC=$?
          if [ "$EXPORT_RC" -ne 0 ]; then
            skip_upload "expo export exited $EXPORT_RC"
          fi
          # `expo export` names the bundle after a content hash, so find the
          # directory it wrote rather than guessing the file name.
          JS_DIR=$(find "$BUNDLE_DIR" -type d -path '*_expo/static/js/android' | head -1)
          if [ -z "$JS_DIR" ]; then
            skip_upload "no exported JS bundle under $BUNDLE_DIR"
          fi
          SENTRY_CLI="./node_modules/.bin/sentry-cli"
          [ -x "$SENTRY_CLI" ] || SENTRY_CLI="bunx @sentry/cli"
          # `--ext` is required because neither Hermes bytecode (`.hbc`) nor
          # RN's Android bundle extension (`.bundle`) is part of sentry-cli's
          # default file filter — without it, upload would silently skip the
          # bundle and only ship the map (and Sentry would refuse to match).
          #
          # No `sourcemaps inject` here: `expo export` already stamps a
          # matching debug id into both halves, and sentry-cli treats the
          # `.hbc` as JavaScript — injecting replaces the bytecode with a
          # 358-byte stub and re-serialises the map with zero mappings, so the
          # upload resolves nothing (SHO-290). Upload the pair untouched.
          $SENTRY_CLI sourcemaps upload \
            --release "$EXPO_PUBLIC_BUILD_HASH" \
            --dist android \
            --ext hbc --ext bundle --ext js --ext map \
            --strip-prefix "$GITHUB_WORKSPACE" \
            "$JS_DIR"
          UPLOAD_RC=$?
          if [ "$UPLOAD_RC" -ne 0 ]; then
            skip_upload "sentry-cli exited $UPLOAD_RC"
          fi
          {
            echo "## Sentry sourcemap upload (Android OTA)"
            echo ""
            echo "Uploaded the exported bundle + map (release=\`$EXPO_PUBLIC_BUILD_HASH\`, dist=\`android\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Summary
        run: |
          echo "## OTA Update Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.check-fingerprint.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.check-fingerprint.outputs.app_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ needs.check-fingerprint.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runtime Version:** ${{ needs.check-fingerprint.outputs.runtime_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Sentry release:** \`${{ github.sha }}\` (dist=\`android\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Devices running a ${{ needs.check-fingerprint.outputs.environment }} build will receive this update automatically." >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Full Native Build — native deps changed (not used in ota mode)
  # Uses expo prebuild + Gradle instead of EAS Build so the fingerprint
  # stays consistent with the OTA update environment.
  # ===========================================================================
  build:
    name: Android Build (Gradle)
    runs-on: ubuntu-latest
    needs: check-fingerprint
    if: >
      needs.check-fingerprint.outputs.needs_build == 'true' &&
      github.event.inputs.mode != 'ota'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve API URL for environment
        id: api-url
        run: |
          if [ "${{ needs.check-fingerprint.outputs.environment }}" = "production" ]; then
            echo "url=https://studio.shogo.ai" >> $GITHUB_OUTPUT
          else
            echo "url=https://studio.staging.shogo.ai" >> $GITHUB_OUTPUT
          fi
          echo "Resolved API URL for ${{ needs.check-fingerprint.outputs.environment }}: $(grep url= $GITHUB_OUTPUT | tail -1)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        # See the "Install dependencies" comment in the `check-fingerprint`
        # job for why GITHUB_TOKEN is required here.
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace packages
        run: bun run build

      - name: Setup Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The action defaults to the removed legacy `tools` SDK package.
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('apps/mobile/android/**/build.gradle') }}
          restore-keys: gradle-

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Sync app version and versionCode
        working-directory: apps/mobile
        env:
          VERSION_CODE_OFFSET: 100
        run: |
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const newVersion = '${{ needs.check-fingerprint.outputs.app_version }}';
            if (newVersion && appJson.expo.version !== newVersion) {
              console.log('Syncing version: ' + appJson.expo.version + ' → ' + newVersion);
              appJson.expo.version = newVersion;
            }
            const versionCode = ${{ github.run_number }} + parseInt(process.env.VERSION_CODE_OFFSET);
            appJson.expo.android.versionCode = versionCode;
            fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\n');
            console.log('Set version=' + appJson.expo.version + ' versionCode=' + versionCode);
          "

      - name: Configure Firebase Android client
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash scripts/ci/configure-android-firebase.sh

      - name: Expo Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
        env:
          # `EXPO_UPDATES_CHANNEL` pins the binary to its own EAS Update branch
          # and `SENTRY_PROJECT` names the Sentry project this platform's
          # native uploads belong to; `app.config.js` bakes both into the
          # generated native project (see apps/mobile/config/expo-env-config.js).
          EXPO_UPDATES_CHANNEL: ${{ needs.check-fingerprint.outputs.environment }}
          SENTRY_PROJECT: shogo-android
          EXPO_PUBLIC_API_URL: ${{ steps.api-url.outputs.url }}
          EXPO_PUBLIC_APP_ENV: ${{ needs.check-fingerprint.outputs.environment }}_app
          EXPO_PUBLIC_APP_VERSION: ${{ needs.check-fingerprint.outputs.app_version }}
          EXPO_PUBLIC_SENTRY_DSN_ANDROID: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN_ANDROID }}
          EXPO_PUBLIC_BUILD_HASH: ${{ github.sha }}

      - name: Tune Gradle for CI
        working-directory: apps/mobile/android
        run: |
          # Expo prebuild leaves no trailing newline; without this the first
          # appended property is glued onto the last generated one.
          echo >> gradle.properties
          cat >> gradle.properties <<'PROPS'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
          ksp.incremental=false
          PROPS

      - name: Verify signing secrets
        run: |
          [ -z "$KEYSTORE_PASSWORD" ] && echo "::error::KEYSTORE_PASSWORD is empty!" && exit 1
          [ -z "$KEY_PASSWORD" ] && echo "::error::KEY_PASSWORD is empty!" && exit 1
          [ -z "$KEY_ALIAS" ] && echo "::error::KEY_ALIAS is empty!" && exit 1
          [ -z "$KEYSTORE_BASE64" ] && echo "::error::KEYSTORE_BASE64 is empty!" && exit 1
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD}"
          echo "KEY_ALIAS value: $KEY_ALIAS"
          echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
          echo "All signing secrets are set"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/app/release.keystore

      - name: Inject release signing config
        working-directory: apps/mobile/android/app
        run: |
          sed -i '/android {/a \
              signingConfigs {\
                  release {\
                      storeFile file("release.keystore")\
                      storePassword System.getenv("KEYSTORE_PASSWORD")\
                      keyAlias System.getenv("KEY_ALIAS")\
                      keyPassword System.getenv("KEY_PASSWORD")\
                  }\
              }' build.gradle

          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' build.gradle

          sed -i '/defaultConfig {/a\
                  ndk {\
                      abiFilters "armeabi-v7a", "arm64-v8a"\
                  }' build.gradle

      - name: Build AAB
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ steps.api-url.outputs.url }}
          EXPO_PUBLIC_APP_ENV: ${{ needs.check-fingerprint.outputs.environment }}_app
          EXPO_PUBLIC_SENTRY_DSN_ANDROID: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN_ANDROID }}
          # Sentry release tag that gets baked into the JS bundle inside the
          # AAB. Must match the release we upload sourcemaps for below.
          EXPO_PUBLIC_BUILD_HASH: ${{ github.sha }}
          # Turn the plugin's own upload off here instead of leaving it to a
          # no-op sentry-cli. It uploads `--release <appId>@<version>+<code>
          # --dist <versionCode>` (sentry.gradle.kts), which no event ever
          # reports — `Sentry.init` sends `release: <sha>`, `dist: 'android'`
          # — so an upload from that task can never be matched. The step below
          # uploads with the pair the app actually reports. This used to be
          # done by overwriting node_modules/@sentry/cli/bin/sentry-cli with a
          # stub that exited 0, which also (silently) disarmed the step below.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'

      - name: Upload JS sourcemaps to Sentry
        # Android events are only symbolicated if the artifacts are uploaded
        # under the exact release/dist the app reports at runtime:
        # `Sentry.init({ release: EXPO_PUBLIC_BUILD_HASH, dist: Platform.OS })`
        # in apps/mobile/app/_layout.tsx — that is `<sha>` + `android`, which
        # is what this step uploads with.
        #
        # The artifacts are the ones `bundleRelease` just produced, at the paths
        # RN 0.86 writes (`packages/gradle-plugin` TaskConfiguration.kt):
        #   generated/assets/react/release/index.android.bundle        (shipped)
        #   generated/sourcemaps/react/release/index.android.bundle.map
        #   intermediates/sourcemaps/react/release/…packager.map      (debug id)
        # With Hermes on (`minifyEnabled = !hermesEnabled`) the bundle at that
        # path IS the shipped bytecode, and RN's own bundle task already
        # composed the bytecode->source map (BundleHermesCTask runs
        # compose-source-maps.js whenever hermesFlags keeps
        # `-output-source-map`, which is the RN default). So nothing is
        # re-bundled or composed here: an earlier revision looked for an
        # `index.android.bundle.hbc.map`, which this plugin version never
        # writes, and silently fell back to a packager map that maps nothing.
        #
        # No `sourcemaps inject`: the Metro serializer (`getSentryExpoConfig`
        # in metro.config.js) already stamped a debug id into the shipped
        # bundle, and injecting rewrites Hermes bytecode into a stub (see the
        # OTA step above, SHO-290). Only the debug id is carried onto the
        # composed map, which is what @sentry/react-native's own upload task
        # does (`scripts/copy-debugid.js`).
        #
        # A release build must never ship blind: for a tag / production build
        # a missing token, a missing artifact, a missing sentry-cli or a failed
        # upload fails the job instead of printing a warning and submitting to
        # Play. Staging stays non-fatal so a Sentry hiccup can't block the loop.
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: shogo-ai
          SENTRY_PROJECT: shogo-android
          SENTRY_LOG_LEVEL: info
          EXPO_PUBLIC_BUILD_HASH: ${{ github.sha }}
          SENTRY_UPLOAD_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/') || needs.check-fingerprint.outputs.environment == 'production' }}
          # The CLI repair below is a `bun install` at the repo root, so it can
          # run @vscode/ripgrep's postinstall — which needs an authenticated
          # token or it flakes with a shared-quota 403
          # (`scripts/check-ci-bun-install-token.ts`).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          fail_upload() {
            echo "::error title=Sentry sourcemap upload (Android)::$1"
            {
              echo "## Sentry sourcemap upload (Android)"
              echo ""
              echo "_FAILED — $1_"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$SENTRY_UPLOAD_REQUIRED" = "true" ]; then
              echo "This is a release build: Android stack traces would be unreadable, so it must not ship."
              exit 1
            fi
            echo "Staging build: continuing without Android symbolication."
            exit 0
          }

          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            fail_upload "SENTRY_AUTH_TOKEN is not configured"
          fi

          # A working sentry-cli or nothing: never substitute a stub, because a
          # stub exits 0 and this step then reports a successful upload that
          # never happened (that is exactly how Android stacks stayed
          # `index.android.bundle:1` while the summary claimed success).
          is_real_cli() {
            "$@" --version 2>/dev/null | grep -qE '^sentry-cli [0-9]+\.[0-9]+\.[0-9]+'
          }
          SENTRY_CLI="./node_modules/.bin/sentry-cli"
          if ! is_real_cli "$SENTRY_CLI"; then
            echo "Packaged sentry-cli is missing or unusable — installing @sentry/cli"
            bun install --no-save @sentry/cli@^3 >/dev/null 2>&1 || true
          fi
          if ! is_real_cli "$SENTRY_CLI"; then
            SENTRY_CLI="bunx @sentry/cli"
          fi
          if ! is_real_cli $SENTRY_CLI; then
            fail_upload "no working sentry-cli (node_modules/.bin/sentry-cli and bunx @sentry/cli both unusable)"
          fi

          BUNDLE="android/app/build/generated/assets/react/release/index.android.bundle"
          COMPOSED="android/app/build/generated/sourcemaps/react/release/index.android.bundle.map"
          PACKAGER="android/app/build/intermediates/sourcemaps/react/release/index.android.bundle.packager.map"

          [ -f "$BUNDLE" ] || fail_upload "no shipped bundle at $BUNDLE — did createBundleReleaseJsAndAssets run for the release variant?"
          [ -f "$COMPOSED" ] || fail_upload "no composed source map at $COMPOSED — the bundle task only writes it while hermesFlags keeps -output-source-map"
          [ -f "$PACKAGER" ] || fail_upload "no packager source map at $PACKAGER, so the composed map cannot carry the bundle's debug id"

          SENTRY_RN_DIR=$(dirname "$(node -p "require.resolve('@sentry/react-native/package.json')")")
          node "$SENTRY_RN_DIR/scripts/copy-debugid.js" "$PACKAGER" "$COMPOSED"
          DEBUG_ID=$(node "$SENTRY_RN_DIR/scripts/has-sourcemap-debugid.js" "$COMPOSED" | tail -1)
          echo "Sentry debug id: $DEBUG_ID"

          # Upload the shipped pair untouched, named exactly as the frames name
          # them (`app:///index.android.bundle`).
          OUT="$RUNNER_TEMP/sentry-android"
          mkdir -p "$OUT"
          cp "$BUNDLE" "$OUT/index.android.bundle"
          cp "$COMPOSED" "$OUT/index.android.bundle.map"

          # `--bundle`/`--bundle-sourcemap` registers the pair the way
          # `sentry-cli react-native gradle --bundle --sourcemap` does, and
          # `--debug-id-reference` is required because the bundle is Hermes
          # bytecode: the CLI cannot read the id out of it, so without the flag
          # it emits no reference and the event never resolves.
          # The exit status of this call *is* the proof: `--strict` fails when a
          # source map cannot be uploaded, and `--wait-for` fails when the server
          # rejects or cannot process the artifact bundle. Do not follow it with
          # `sentry-cli releases files <release> list` — that subcommand does not
          # exist in the CLI 3.x releases command (only
          # archive/delete/finalize/info/list/new/propose-version/restore/
          # set-commits), and since 3.x uploads through the chunk-upload /
          # artifact-bundle API the legacy release-files endpoint would not list
          # them either. A post-upload probe that always reports "nothing here"
          # fails every release build *after* a successful upload.
          $SENTRY_CLI sourcemaps upload \
            --bundle "$OUT/index.android.bundle" \
            --bundle-sourcemap "$OUT/index.android.bundle.map" \
            --debug-id-reference --strict \
            --wait-for 300 \
            --release "$EXPO_PUBLIC_BUILD_HASH" \
            --dist android \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            --url-prefix "app:///" \
            || fail_upload "sourcemaps upload failed (release=$EXPO_PUBLIC_BUILD_HASH, dist=android)"

          {
            echo "## Sentry sourcemap upload (Android)"
            echo ""
            echo "Uploaded the shipped bundle + composed sourcemap (release=\`$EXPO_PUBLIC_BUILD_HASH\`, dist=\`android\`, debug id=\`$DEBUG_ID\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-release.aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          # Intermediate: the bundle is uploaded to Play in this same run.
          retention-days: 7

      - name: Save fingerprint to cache
        run: |
          RUNTIME_VERSION="${{ needs.check-fingerprint.outputs.runtime_version }}"
          if [ -z "$RUNTIME_VERSION" ] || [ "$RUNTIME_VERSION" = "unknown" ]; then
            RAW=$(cd apps/mobile && npx expo-updates runtimeversion:resolve --platform android 2>/dev/null || echo "manual-build")
            RUNTIME_VERSION=$(echo "$RAW" | sha256sum | cut -d' ' -f1)
          fi
          echo "$RUNTIME_VERSION" > .fingerprint-android

      - name: Cache fingerprint
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .fingerprint-android
          key: android-fingerprint-${{ needs.check-fingerprint.outputs.environment }}-${{ needs.check-fingerprint.outputs.runtime_version || 'manual' }}

      - name: Resolve submit decision
        id: submit-decision
        run: |
          ENV="${{ needs.check-fingerprint.outputs.environment }}"
          SUBMIT_INPUT="${{ github.event.inputs.submit }}"
          if [ "$ENV" = "production" ]; then
            echo "should_submit=true" >> $GITHUB_OUTPUT
            echo "track=production" >> $GITHUB_OUTPUT
            echo "Production build → always submitting to production track"
          elif [ "$SUBMIT_INPUT" != "false" ]; then
            echo "should_submit=true" >> $GITHUB_OUTPUT
            echo "track=internal" >> $GITHUB_OUTPUT
            echo "Staging build → submitting to internal track"
          else
            echo "should_submit=false" >> $GITHUB_OUTPUT
            echo "track=none" >> $GITHUB_OUTPUT
            echo "Submit skipped by user"
          fi

      - name: Decode Play Store service account key
        if: steps.submit-decision.outputs.should_submit == 'true'
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 || secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > apps/mobile/play-store-service-account.json

      - name: Submit to Play Store
        if: steps.submit-decision.outputs.should_submit == 'true'
        working-directory: apps/mobile
        run: |
          echo "Submitting to ${{ steps.submit-decision.outputs.track }} track via profile ${{ needs.check-fingerprint.outputs.environment }}"
          eas submit \
            --platform android \
            --profile ${{ needs.check-fingerprint.outputs.environment }} \
            --path ./android/app/build/outputs/bundle/release/app-release.aab \
            --non-interactive

      - name: Summary
        run: |
          echo "## Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.check-fingerprint.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.check-fingerprint.outputs.app_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel:** ${{ needs.check-fingerprint.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **versionCode:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Submit:** ${{ steps.submit-decision.outputs.should_submit == 'true' && format('Play Store ({0} track)', steps.submit-decision.outputs.track) || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "AAB is available as a workflow artifact." >> $GITHUB_STEP_SUMMARY

          
# Staging OTA
# gh workflow run android.yml --ref android-build -f mode=ota -f environment=staging

# Staging full build + submit
# gh workflow run android.yml --ref staging -f mode=full -f environment=staging

# Production OTA
# gh workflow run android.yml --ref main -f mode=ota -f environment=production

# Production full build + submit
# gh workflow run android.yml --ref main -f mode=full -f environment=production

# Full build, skip Play Store submit
# gh workflow run android.yml --ref staging -f mode=full -f environment=staging -f submit=false
#
# Or via tag (auto-triggers production build + submit):
#   git tag v1.13.35 && git push origin v1.13.35          # unified: iOS + Android + macOS + Windows
#   git tag android-v1.13.35 && git push origin android-v1.13.35  # Android-only
