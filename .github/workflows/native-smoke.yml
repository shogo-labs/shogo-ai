# =============================================================================
# Native smoke (Maestro)
# =============================================================================
# The release workflows (ios.yml / android.yml) only compile natively when the
# Expo fingerprint changes, and nothing ever launches the binary before it
# reaches the stores. Native-only regressions (layout, keyboard, blur backdrop,
# Play Billing patch) therefore shipped with a green CI.
#
# This builds staging-pointed release binaries for a simulator / emulator and
# runs apps/mobile/.maestro/smoke.yaml in light and dark appearance, uploading
# the screenshots. Android also runs on PRs that touch native inputs as a
# Gradle compile check.
#
# Optional secrets NATIVE_E2E_EMAIL / NATIVE_E2E_PASSWORD (a staging account)
# extend the flow through sign-in to the home composer.
# =============================================================================
name: Native smoke

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'patches/**'
      - 'apps/mobile/package.json'
      - 'apps/mobile/app.json'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/.maestro/**'
      - 'scripts/ci/native-maestro.sh'
      - '.github/workflows/native-smoke.yml'

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STAGING_API_URL: https://studio.staging.shogo.ai
  MAESTRO_VERSION: cli-2.10.0

jobs:
  android:
    name: Android (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace packages
        run: bun run build

      - name: Setup Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-smoke-${{ hashFiles('apps/mobile/package.json', 'patches/**') }}
          restore-keys: gradle-smoke-

      - name: Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ env.STAGING_API_URL }}
          EXPO_PUBLIC_APP_ENV: staging_app

      - name: Tune Gradle for CI
        working-directory: apps/mobile/android
        run: |
          cat >> gradle.properties <<'PROPS'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
          ksp.incremental=false
          PROPS

      - name: Stub Sentry CLI
        working-directory: apps/mobile
        run: |
          SENTRY_CLI="node_modules/@sentry/cli/bin/sentry-cli"
          if ! { [ -x "$SENTRY_CLI" ] && "$SENTRY_CLI" --version; }; then
            mkdir -p "$(dirname "$SENTRY_CLI")"
            printf '#!/bin/bash\nexit 0\n' > "$SENTRY_CLI"
            chmod +x "$SENTRY_CLI"
          fi

      - name: Build release APK (x86_64, debug-signed)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 -x lintVitalAnalyzeRelease -x lintVitalRelease
        env:
          EXPO_PUBLIC_API_URL: ${{ env.STAGING_API_URL }}
          EXPO_PUBLIC_APP_ENV: staging_app
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'

      - name: Install Maestro
        run: bash scripts/ci/install-maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          PLATFORM: android
          APP_ID: ai.shogo.mobile
          MAESTRO_OUT: ${{ runner.temp }}/maestro-out
          EMAIL: ${{ secrets.NATIVE_E2E_EMAIL }}
          PASSWORD: ${{ secrets.NATIVE_E2E_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk && bash scripts/ci/native-maestro.sh

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-smoke-android
          path: ${{ runner.temp }}/maestro-out
          if-no-files-found: ignore

  ios:
    name: iOS (simulator)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select newest Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt"
          cat "$RUNNER_TEMP/xcode-version.txt"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace packages
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Setup Java 17 (Maestro CLI)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Expo prebuild iOS
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ env.STAGING_API_URL }}
          EXPO_PUBLIC_APP_ENV: staging_app

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Force fmt CocoaPod to C++17 for Xcode 26
        # Same workaround as ios.yml: fmt's consteval path fails under the
        # c++20 default of Xcode 26's clang.
        working-directory: apps/mobile
        run: |
          ruby - <<'RUBY'
            require 'xcodeproj'
            project = Xcodeproj::Project.open('ios/Pods/Pods.xcodeproj')
            target = project.targets.find { |t| t.name == 'fmt' }
            abort('fmt CocoaPod target not found') unless target
            target.build_configurations.each { |c| c.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++17' }
            project.save
            Dir.glob('ios/Pods/Target Support Files/fmt/fmt.*.xcconfig').each do |path|
              File.write(path, File.read(path).gsub(/^CLANG_CXX_LANGUAGE_STANDARD = .*$/, 'CLANG_CXX_LANGUAGE_STANDARD = c++17'))
            end
          RUBY

      - name: Strip Sentry build phases
        working-directory: apps/mobile
        run: ruby scripts/strip-sentry-build-phases.rb

      - name: Build for simulator (Release, unsigned)
        working-directory: apps/mobile/ios
        env:
          EXPO_PUBLIC_API_URL: ${{ env.STAGING_API_URL }}
          EXPO_PUBLIC_APP_ENV: staging_app
          PROJECT_ROOT: ${{ github.workspace }}
          ENTRY_FILE: apps/mobile/index.js
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Shogo.xcworkspace \
            -scheme Shogo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || exit "${PIPESTATUS[0]}"

      - name: Boot simulator and install
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          [ -n "$UDID" ] && [ "$UDID" != null ] || { echo "::error::no iPhone simulator available"; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/Shogo.app"

      - name: Install Maestro
        run: bash scripts/ci/install-maestro.sh

      - name: Run Maestro
        env:
          PLATFORM: ios
          APP_ID: ai.shogo.app
          MAESTRO_OUT: ${{ runner.temp }}/maestro-out
          EMAIL: ${{ secrets.NATIVE_E2E_EMAIL }}
          PASSWORD: ${{ secrets.NATIVE_E2E_PASSWORD }}
        run: bash scripts/ci/native-maestro.sh

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-smoke-ios
          path: ${{ runner.temp }}/maestro-out
          if-no-files-found: ignore
