# =============================================================================
# OCIR Image Cleanup (safe-by-default)
# =============================================================================
# Removes old container images from OCI Container Registry to prevent unbounded
# storage growth. Each deploy pushes SHA-tagged images that are never deleted;
# this workflow prunes images that satisfy ALL of the following:
#   1. NOT currently referenced by any Knative Service / Revision / Deployment
#      / DaemonSet / ReplicaSet / Pod / StatefulSet in ANY cluster
#      (cross-referenced via kubectl). Staging and production-us share the
#      us-ashburn-1 registry, and production runs digests staging built
#      (deploy.yml promote-images), so per-cluster protection is not enough.
#   2. NOT the runtime image a metal host's rootfs was baked from (revisions
#      reported by each control plane's /api/internal/metal/fleet), nor the
#      image new metal hosts are provisioned from.
#   3. NOT tagged with a string containing "latest".
#   4. NOT the image of one of the last RELEASE_KEEP production releases
#      (`production-<sha>` of the newest v* tags), so rollback-production.yml
#      always has targets.
#   5. NOT one of the KEEP_COUNT most recent images for the repository.
#   6. Older than KEEP_DAYS days.
#   7. NOT a platform manifest of a kept multi-arch index.
# The deletion logic lives in .github/scripts/ocir-cleanup.sh.
#
# Schedule runs default to dry-run. To enforce deletions on schedule, set the
# repo variable OCIR_CLEANUP_ENFORCE=true. Manual dispatch can override either.
#
# Background: a previous version protected only "latest"-tagged images and
# pruned by count alone. Knative Revisions resolved `:staging-latest` to a
# digest at admission time and pinned it; the cleanup then deleted those
# digests once a newer push moved the tag, breaking running revisions on
# next pod restart. See the staging incident postmortem (2026-05-04).
#
# Until 2026-10 every run listed zero images (the repos live in a child
# compartment and the listing wasn't scoped to the subtree), so nothing has
# ever been pruned. Review a dry run before enforcing.
# =============================================================================

name: Cleanup OCIR Images

on:
  schedule:
    - cron: '0 4 * * 0' # Sunday 04:00 UTC
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Number of recent images to keep per repository'
        required: false
        default: '20'
        type: string
      keep_days:
        description: 'Minimum age (days) before an image is eligible for deletion'
        required: false
        default: '30'
        type: string
      release_keep:
        description: 'Number of most recent production releases whose images are always kept (rollback targets)'
        required: false
        default: '10'
        type: string
      dry_run:
        description: 'Log deletions without actually deleting'
        required: false
        default: true
        type: boolean

jobs:
  # One run per cluster: every image digest anything in it references.
  in-use:
    name: In-use digests (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        environment:
          - production-us
          - production-eu
          - staging

    environment: ${{ matrix.environment }}

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}

    steps:
      - name: Install OCI CLI and kubectl
        run: |
          pip install oci-cli --quiet
          curl -sLO "https://dl.k8s.io/release/v1.32.1/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl

      - name: Configure kubectl for OKE
        run: |
          if [ -z "${{ vars.OKE_CLUSTER_OCID }}" ]; then
            echo "::error::OKE_CLUSTER_OCID not set for ${{ matrix.environment }}; refusing to report an empty in-use set"
            exit 1
          fi
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ vars.OKE_CLUSTER_OCID }} \
            --region ${{ vars.OCI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          kubectl get nodes >/dev/null

      - name: Collect in-use image references from cluster
        run: |
          set -euo pipefail
          IN_USE=$(mktemp)

          {
            # Knative-managed: services, configurations, revisions
            kubectl get ksvc,configurations,revisions -A -o json \
              | jq -r '.items[].spec.template.spec.containers[]?.image // empty,
                       .items[].spec.containers[]?.image // empty,
                       .items[].status.containerStatuses[]?.imageDigest // empty'

            # Standard workloads
            kubectl get deployments,statefulsets,daemonsets,replicasets,jobs,cronjobs -A -o json \
              | jq -r '.items[].spec.template.spec.containers[]?.image // empty,
                       .items[].spec.jobTemplate.spec.template.spec.containers[]?.image // empty'

            # Pods (catches anything not owned by a controller, plus actual running images)
            kubectl get pods -A -o json \
              | jq -r '.items[].spec.containers[]?.image // empty,
                       .items[].status.containerStatuses[]?.imageID // empty,
                       .items[].status.initContainerStatuses[]?.imageID // empty'
          } >> "$IN_USE"

          # Tag-only references (e.g. the runtime configmap pin) are resolved
          # to digests by the cleanup job via in-use-refs.txt.
          grep -oE 'sha256:[a-f0-9]{64}' "$IN_USE" | sort -u > in-use-digests.txt || true
          {
            grep -E '\.ocir\.io/' "$IN_USE" | grep -vE '@sha256:' || true
            kubectl get configmap shogo-runtime-version -n "${{ vars.NAMESPACE_SYSTEM }}" \
              -o jsonpath='{.data.image}' 2>/dev/null || true
            echo
          } | grep . | sort -u > in-use-refs.txt || true

          echo "Collected $(wc -l < in-use-digests.txt | tr -d ' ') digests and $(grep -c . in-use-refs.txt || true) tag refs from ${{ matrix.environment }}"

      - name: Checkout rootfs gate script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: src
          sparse-checkout: scripts/ci/metal-rootfs-gate.sh
          sparse-checkout-cone-mode: false

      # Metal hosts aren't in any cluster: each bakes its rootfs from a
      # `<env>-[docker-]multiarch-<rev>` image and reports <rev> to its control
      # plane. Keep those images, and the one new hosts are provisioned from,
      # so a host that rebuilds or joins can still pull them. An image pinned
      # by a release the fleet hasn't baked yet is younger than KEEP_DAYS.
      - name: Collect metal fleet runtime images
        if: vars.METAL_CONTROL_PLANE_URL != ''
        env:
          CP_URL: ${{ vars.METAL_CONTROL_PLANE_URL }}
          METAL_REGISTER_TOKEN: ${{ secrets.METAL_REGISTER_TOKEN }}
          INSECURE_TLS: ${{ vars.METAL_RELEASE_INSECURE_TLS }}
          REGISTRY: ${{ vars.METAL_RUNTIME_REGISTRY || format('us-ashburn-1.ocir.io/{0}', vars.OCI_TENANCY_NAMESPACE) }}
          NS_SYSTEM: ${{ vars.NAMESPACE_SYSTEM }}
        run: |
          set -euo pipefail
          FLEET=$(bash src/scripts/ci/metal-rootfs-gate.sh fetch "${{ matrix.environment }}" "$CP_URL")
          if [ "$(jq -r '.ok' <<<"$FLEET")" != "true" ]; then
            echo "::error::Can't read the metal fleet for ${{ matrix.environment }} ($(jq -r '.error' <<<"$FLEET")); refusing to report an incomplete in-use set"
            exit 1
          fi
          REPO="${REGISTRY%/}/shogo/shogo-runtime"
          {
            jq -r '.hosts[].rootfsRevision // empty' <<<"$FLEET" | sort -u | while read -r rev; do
              for prefix in production staging; do
                echo "${REPO}:${prefix}-multiarch-${rev}"
                echo "${REPO}:${prefix}-docker-multiarch-${rev}"
              done
            done
            kubectl get ksvc api -n "$NS_SYSTEM" -o json 2>/dev/null \
              | jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "METAL_FLEET_RUNTIME_IMAGE") | .value // empty' \
              | while read -r img; do echo "$img"; echo "${img/multiarch/docker-multiarch}"; done
          } | sort -u | tee metal-refs.txt
          cat metal-refs.txt >> in-use-refs.txt
          echo "Protecting $(grep -c . metal-refs.txt || true) metal runtime image refs from ${{ matrix.environment }} ($(jq '.hosts | length' <<<"$FLEET") hosts)"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: in-use-${{ matrix.environment }}
          path: |
            in-use-digests.txt
            in-use-refs.txt
          retention-days: 3

  # One run per REGISTRY (not per cluster): us-ashburn-1 holds both staging
  # and production-us images.
  cleanup:
    name: Cleanup ${{ matrix.environment }} registry
    runs-on: ubuntu-latest
    needs: [in-use]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        environment:
          - production-us
          - production-eu

    environment: ${{ matrix.environment }}

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}

    steps:
      - name: Checkout release tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: in-use-*
          path: in-use

      - name: Build protected digest set
        id: in-use
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
          RELEASE_KEEP: ${{ github.event.inputs.release_keep || '10' }}
          REGISTRY_HOST: ${{ vars.OCI_REGION }}.ocir.io
        run: |
          set -euo pipefail
          DIGESTS="$RUNNER_TEMP/protected-digests.txt"
          cat in-use/*/in-use-digests.txt | sort -u > "$DIGESTS"

          # Resolve a tag in THIS registry to its digest (empty if absent).
          # Repos live in a child compartment of the tenancy, and the filter
          # flag is --image-version (--version prints the CLI version).
          digest_for() {
            oci artifacts container image list \
              --compartment-id "$COMPARTMENT_ID" --compartment-id-in-subtree true \
              --repository-name "$1" --image-version "$2" \
              --query 'data.items[0].digest' --raw-output 2>/dev/null | grep -E '^sha256:' || true
          }

          # Tag-only cluster references (ksvc specs, runtime configmap pin).
          { grep -hF "$REGISTRY_HOST/" in-use/*/in-use-refs.txt || true; } | sort -u | while read -r ref; do
            path="${ref#*/}"; path="${path#*/}"   # shogo/<repo>:<tag>
            repo="${path%%:*}"; tag="${path##*:}"
            if [ "$repo" != "$path" ]; then digest_for "$repo" "$tag"; fi
          done >> "$DIGESTS"

          # Rollback targets: the last RELEASE_KEEP production releases.
          for tag in $(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -"$RELEASE_KEEP"); do
            sha=$(git rev-list -n1 "$tag")
            for repo in shogo/shogo-api shogo/shogo-web shogo/shogo-docs shogo/shogo-runtime; do
              digest_for "$repo" "production-${sha}"
            done
          done >> "$DIGESTS"

          sort -u -o "$DIGESTS" "$DIGESTS"
          echo "digest_file=$DIGESTS" >> "$GITHUB_OUTPUT"
          echo "Protecting $(wc -l < "$DIGESTS" | tr -d ' ') digests (in use in any cluster, or one of the last ${RELEASE_KEEP} releases)"

      - name: Clean up old images
        env:
          KEEP_COUNT: ${{ github.event.inputs.keep_count || '20' }}
          KEEP_DAYS: ${{ github.event.inputs.keep_days || '30' }}
          # Scheduled runs are dry runs unless repo var OCIR_CLEANUP_ENFORCE=true.
          # Manual dispatch honours the input. The script deletes only when this
          # is exactly "false".
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || (vars.OCIR_CLEANUP_ENFORCE == 'true' && 'false' || 'true') }}
          COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
          REGISTRY_HOST: ${{ vars.OCI_REGION }}.ocir.io
          OCIR_NAMESPACE: ${{ vars.OCI_TENANCY_NAMESPACE }}
          OCIR_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCIR_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
          PROTECTED_DIGESTS: ${{ steps.in-use.outputs.digest_file }}
        run: .github/scripts/ocir-cleanup.sh
