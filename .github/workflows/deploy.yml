# =============================================================================
# Shogo AI - Build, Test, and Deploy Pipeline (OCI / OKE)
# =============================================================================
# Multi-region deployment to Oracle Cloud Infrastructure:
#   - push to main     → staging (auto-deploy)
#   - push tag v*      → production (US → EU)
#   - workflow_dispatch → manual deploy to staging or production
#
# Build once, promote: images are built only for staging (push to main).
# Production ships the exact digests staging built and passed e2e on for the
# tagged commit; it never rebuilds. Images must therefore stay
# environment-agnostic (per-env studio config is injected at container start,
# see apps/mobile/docker/shogo-runtime-env.sh).
#
# Pipeline stages:
#   1. Setup - Determine environment from trigger
#   2. Detect Changes - Skip image builds when code hasn't changed; production
#      switches to promote mode
#   3. Build Runtime Base - Rebuild base image when templates/deps change
#   4. Build & Push - Build Docker images and push to US OCIR (staging, or a
#      production `force_rebuild_production` dispatch)
#   5. Promote - Re-tag staging-<sha> as production-<sha> (production)
#   6. Replicate Images - Copy images to EU OCIR (production)
#   7. Staging rollout - Deploy + critical-path e2e (deploy-staging.yml),
#      the only serialized part of a staging run
#   8. Deploy US - Primary region (runs migrations)
#   9. Deploy EU - Secondary region
#  10. Metal - Promote the staging multi-arch guest image when the rootfs gate
#      says the fleet needs it, then publish the metal-agent stable release
#
# Rollback without rebuilding: .github/workflows/rollback-production.yml.
# =============================================================================

name: Build, Test, and Deploy

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      build_only:
        description: 'Build and push images only (skip deploy). Use when pre-building images for node migration.'
        required: false
        default: false
        type: boolean
      skip_staging_e2e_gate:
        description: 'Production only, emergencies: deploy without a green e2e/staging-critical status for this commit.'
        required: false
        default: false
        type: boolean
      force_rebuild_production:
        description: 'Production only, escape hatch: rebuild images from source instead of promoting the staging-built images for this commit.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Production only: plan the deploy of this commit (images, manifests, migrations, metal) without changing anything.'
        required: false
        default: false
        type: boolean

# Production runs are serialized per ref here. Staging runs get a group of
# their own so builds for successive commits overlap; the staging-rollout job
# holds the lock that keeps deploy + e2e for one commit together.
concurrency:
  group: ${{ (inputs.environment || (github.ref_type == 'tag' && 'production' || 'staging')) == 'production' && format('deploy-v2-{0}-production{1}', github.ref_name, inputs.dry_run && '-dry-run' || '') || format('deploy-v2-staging-build-{0}', github.run_id) }}
  cancel-in-progress: false

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ===========================================================================
  # Stage -1: CI Gate
  # ===========================================================================
  # Pushes to main and production tags start this workflow alongside CI.
  # Polling for the CI run here makes the dependency explicit: no image build,
  # migration, or deployment job can start until CI has passed for this exact
  # commit. This also keeps manual deploys fail-closed when their commit has
  # never passed CI.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for CI to pass for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run changes nothing; not waiting for CI."
            exit 0
          fi
          # A merge-queue commit lands on main as the exact SHA the queue
          # already tested, so its merge_group run counts; the push run that
          # follows only warms caches (ci.yml queue-verified).
          queued="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=merge_group&status=completed&per_page=20" |
            jq -r --arg sha "$SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // ""
            '
          )"
          if [[ -n "$queued" ]]; then
            required="$(
              gh api "repos/${REPOSITORY}/actions/runs/${queued}/jobs?per_page=100" --paginate |
              jq -r '.jobs[] | select(.name == "Lint, Typecheck, Test") | .conclusion' | tail -1
            )"
            if [[ "$required" == "success" ]]; then
              echo "Merge-queue CI run ${queued} passed for ${SHA}."
              exit 0
            fi
            echo "Merge-queue CI run ${queued} for ${SHA}: required job ${required:-missing}; waiting for the push run."
          fi

          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            run="$(
              gh api \
                "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20" |
              jq -r --arg sha "$SHA" '
                [.workflow_runs[]
                  | select(.head_sha == $sha and (.event == "push" or .event == "workflow_dispatch"))]
                | sort_by(.run_number)
                | last
                | if . == null
                  then ""
                  else [.id, .status, (.conclusion // "")] | @tsv
                  end
              '
            )"

            if [[ -z "$run" ]]; then
              echo "CI run for ${SHA} has not started yet; retrying..."
              sleep 15
              continue
            fi

            read -r run_id status conclusion <<< "$run"
            echo "CI run ${run_id}: status=${status}, conclusion=${conclusion}"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "CI passed for ${SHA}."
                exit 0
              fi
              # Non-blocking jobs (local E2E) can fail the run while the
              # required aggregate job passes; gate on that job like merges do.
              required="$(
                gh api "repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --paginate |
                jq -r '.jobs[] | select(.name == "Lint, Typecheck, Test") | .conclusion' | tail -1
              )"
              if [[ "$required" == "success" ]]; then
                echo "CI ${run_id} concluded ${conclusion}, but required job 'Lint, Typecheck, Test' passed."
                exit 0
              fi
              echo "::error::CI ${run_id} finished with conclusion=${conclusion} (required job: ${required:-missing})."
              exit 1
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for CI to pass for ${SHA}."
          exit 1

  # ===========================================================================
  # Stage 0: Setup - Determine Environment
  # ===========================================================================
  setup:
    name: Determine Environment
    runs-on: ubuntu-latest
    needs: [ci-gate]
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      is_production: ${{ steps.set-env.outputs.is_production }}
      build_only: ${{ steps.set-env.outputs.build_only }}
      dry_run: ${{ steps.set-env.outputs.dry_run }}
      app_version: ${{ steps.resolve-version.outputs.version }}
    steps:
      - name: Determine environment from trigger
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ENV="production"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="staging"
          else
            echo "Unknown ref, defaulting to staging"
            ENV="staging"
          fi

          IS_PROD="false"
          if [[ "$ENV" == "production" ]]; then
            IS_PROD="true"
          fi

          BUILD_ONLY="${{ github.event.inputs.build_only || 'false' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            if [[ "$IS_PROD" != "true" ]]; then
              echo "::error::dry_run plans a production deploy; choose environment=production"; exit 1
            fi
            if [[ "$BUILD_ONLY" == "true" || "${{ github.event.inputs.force_rebuild_production }}" == "true" ]]; then
              echo "::error::dry_run can't be combined with build_only or force_rebuild_production (both build images)"; exit 1
            fi
          fi

          {
            echo "environment=$ENV"
            echo "is_production=$IS_PROD"
            echo "build_only=$BUILD_ONLY"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying to: $ENV (is_production=$IS_PROD, build_only=$BUILD_ONLY)"

      - name: Checkout release tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true

      - name: Resolve app version
        id: resolve-version
        env:
          # The web bundle should identify the release it belongs to even for
          # a staging deploy from main, so resolve the latest production tag
          # when the current ref is not itself a version tag.
          MOBILE_RELEASE_ENV: production
        run: bash scripts/ci/resolve-mobile-app-version.sh

  # ===========================================================================
  # Stage 0.1: Resolve Config - Read environment-scoped variables
  # For production, this resolves the US (primary) region config.
  # ===========================================================================
  resolve-config:
    name: Resolve Config (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup]
    environment: ${{ needs.setup.outputs.environment == 'production' && 'production-us' || needs.setup.outputs.environment }}
    outputs:
      environment: ${{ needs.setup.outputs.environment }}
      is_production: ${{ needs.setup.outputs.is_production }}
      dry_run: ${{ needs.setup.outputs.dry_run }}
      app_version: ${{ needs.setup.outputs.app_version }}
      ocir_registry: ${{ steps.registry.outputs.ocir_registry }}
      oke_cluster_ocid: ${{ vars.OKE_CLUSTER_OCID }}
      node_pool_ocid: ${{ vars.NODE_POOL_OCID }}
      namespace_system: ${{ vars.NAMESPACE_SYSTEM }}
      namespace_workspaces: ${{ vars.NAMESPACE_WORKSPACES }}
      domain: ${{ vars.DOMAIN }}
      docs_domain: ${{ vars.DOCS_DOMAIN }}
      oci_region: ${{ vars.OCI_REGION }}
      oci_tenancy_namespace: ${{ vars.OCI_TENANCY_NAMESPACE }}
    steps:
      - name: Compute OCIR registry URL
        id: registry
        run: |
          echo "ocir_registry=${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_TENANCY_NAMESPACE }}" >> $GITHUB_OUTPUT

      - name: Print resolved config
        run: |
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Domain: ${{ vars.DOMAIN }}"

  # ===========================================================================
  # Stage 0.5: Detect Changes
  # ===========================================================================
  detect-changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    needs: [setup]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      api_changed: ${{ steps.set-matrix.outputs.api_changed }}
      web_changed: ${{ steps.set-matrix.outputs.web_changed }}
      runtime_changed: ${{ steps.set-matrix.outputs.runtime_changed }}
      runtime_base_changed: ${{ steps.set-matrix.outputs.runtime_base_changed }}
      docs_changed: ${{ steps.set-matrix.outputs.docs_changed }}
      base_tag: ${{ steps.set-matrix.outputs.base_tag }}
      promote: ${{ steps.set-matrix.outputs.promote }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed paths and build matrix
        id: set-matrix
        env:
          # gh api (below) needs an authenticated token to look up the last
          # successful build SHA. Without it the call silently fails and we
          # fall back to a previous-commit diff — which DROPS changes that
          # were built in a run that later failed before deploying (e.g. a
          # web build that succeeded but whose run failed at the runtime
          # build). Authenticating makes the baseline the last *deployed*
          # commit so those changes get picked up on the next run.
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          IS_TAG_PUSH: ${{ github.ref_type == 'tag' }}
          CURRENT_TAG: ${{ github.ref_name }}
          IS_PRODUCTION: ${{ needs.setup.outputs.is_production }}
          FORCE_REBUILD_PRODUCTION: ${{ github.event.inputs.force_rebuild_production || 'false' }}
        run: |
          # Production promotes the images staging already built and tested
          # for this commit (promote-images) instead of rebuilding them. Every
          # service gets the release tag; resolve-release-images.sh skips the
          # runtime roll per cluster when its digest is unchanged.
          if [ "$IS_PRODUCTION" = "true" ] && [ "$FORCE_REBUILD_PRODUCTION" != "true" ]; then
            echo "Production deploy -- promoting staging images for ${{ github.sha }}, no builds"
            {
              echo "promote=true"
              echo "has_changes=false"
              echo 'matrix={"include":[]}'
              echo "api_changed=true"
              echo "web_changed=true"
              echo "docs_changed=true"
              echo "runtime_changed=true"
              echo "runtime_base_changed=false"
              echo "base_tag="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "promote=false" >> "$GITHUB_OUTPUT"

          FORCE_ALL="${{ github.event_name == 'workflow_dispatch' }}"
          FORCE_PROD="${{ github.ref_type == 'tag' }}"

          if [ "$FORCE_ALL" = "true" ]; then
            echo "workflow_dispatch -- forcing all image builds"
            CHANGED=""
          elif [ "$FORCE_PROD" = "true" ]; then
            echo "Production tag push -- forcing api/web/docs, change-detecting runtime"
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -1)
            if [ -n "$PREV_TAG" ]; then
              CHANGED=$(git diff --name-only "$PREV_TAG" HEAD)
              echo "Comparing $PREV_TAG..HEAD (runtime change detection only)"
            else
              echo "No previous tag found — treating all files as changed"
              CHANGED=$(git ls-tree --name-only -r HEAD)
            fi
          else
            # Staging: diff against the last successful build on main
            LAST_SUCCESS_SHA=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1&event=push" \
              --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")

            if [ -n "$LAST_SUCCESS_SHA" ] && [ "$LAST_SUCCESS_SHA" != "null" ] && git cat-file -e "$LAST_SUCCESS_SHA" 2>/dev/null; then
              if [ "$LAST_SUCCESS_SHA" = "${{ github.sha }}" ]; then
                echo "Last successful build is current commit -- using BEFORE_SHA as fallback"
                CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD)
              else
                CHANGED=$(git diff --name-only "$LAST_SUCCESS_SHA" HEAD)
                echo "Comparing $LAST_SUCCESS_SHA..HEAD (since last successful build)"
              fi
            elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD)
              echo "Comparing $BEFORE_SHA..HEAD (push event fallback)"
            else
              echo "No successful build or before SHA found -- treating all files as changed"
              CHANGED=$(git ls-tree --name-only -r HEAD)
            fi
          fi

          echo ""
          echo "Changed files:"
          echo "$CHANGED"
          echo ""

          has_match() {
            [ "$FORCE_ALL" = "true" ] && { echo "true"; return; }
            echo "$CHANGED" | grep -qE "$1" && echo "true" || echo "false"
          }

          SHARED=$(has_match '^(package\.json|bun\.lock|tsconfig\.base\.json|scripts/)')
          SDK=$(has_match '^packages/sdk/')
          SHARED_RUNTIME=$(has_match '^packages/shared-runtime/')
          RUNTIME_PKG=$(has_match '^packages/agent-runtime/')
          API_APP=$(has_match '^(apps/api/|packages/authz/|packages/shared-app/src/buddy-look\.ts|prisma/|prisma\.config\.ts|templates/runtime-template/)')
          WEB_APP=$(has_match '^(apps/mobile/|packages/authz/|packages/domain-stores/|packages/shared-app/|packages/shared-ui/|packages/ui-kit/)')
          DOCS_APP=$(has_match '^apps/docs/')

          BASE_DOCKERFILE=$(has_match '^packages/agent-runtime/Dockerfile\.base')
          SDK_EXAMPLES=$(has_match '^packages/sdk/examples/')
          # Dockerfile.base pre-warms Bun's tarball cache from both Expo
          # starters. Bumping either tree invalidates the prewarm.
          EXPO_PREWARM=$(has_match '^packages/agent-runtime/tech-stacks/expo-(three|app)/starter/package\.json')
          RUNTIME_BASE_CHANGED=false
          if [ "$BASE_DOCKERFILE" = "true" ] || [ "$SDK_EXAMPLES" = "true" ] || [ "$EXPO_PREWARM" = "true" ]; then
            RUNTIME_BASE_CHANGED=true
          fi

          API_CHANGED=false
          if [ "$FORCE_PROD" = "true" ] || [ "$SHARED" = "true" ] || [ "$SDK" = "true" ] || [ "$SHARED_RUNTIME" = "true" ] || [ "$RUNTIME_PKG" = "true" ] || [ "$API_APP" = "true" ]; then
            API_CHANGED=true
          fi

          WEB_CHANGED=false
          if [ "$FORCE_PROD" = "true" ] || [ "$SHARED" = "true" ] || [ "$SDK" = "true" ] || [ "$WEB_APP" = "true" ]; then
            WEB_CHANGED=true
          fi

          MODEL_CATALOG=$(has_match '^packages/model-catalog/')

          RUNTIME_CHANGED=false
          if [ "$SHARED" = "true" ] || [ "$SHARED_RUNTIME" = "true" ] || [ "$RUNTIME_PKG" = "true" ] || [ "$RUNTIME_BASE_CHANGED" = "true" ] || [ "$MODEL_CATALOG" = "true" ]; then
            RUNTIME_CHANGED=true
          fi

          DOCS_CHANGED=false
          if [ "$FORCE_PROD" = "true" ] || [ "$DOCS_APP" = "true" ]; then
            DOCS_CHANGED=true
          fi

          echo "api_changed=$API_CHANGED" >> $GITHUB_OUTPUT
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "runtime_changed=$RUNTIME_CHANGED" >> $GITHUB_OUTPUT
          echo "runtime_base_changed=$RUNTIME_BASE_CHANGED" >> $GITHUB_OUTPUT
          echo "docs_changed=$DOCS_CHANGED" >> $GITHUB_OUTPUT

          # Content-hash tag for the runtime base image. Hash exactly the
          # inputs that define the base (the same files that drive
          # runtime_base_changed above): Dockerfile.base, both Expo starter
          # package.json files that feed the Bun prewarm, and the SDK
          # examples. The base is built and pushed under
          # shogo-runtime-base:<base_tag> only when this tag is absent in
          # OCIR, and the runtime image is built FROM that exact tag. So the
          # heavy base layers stay byte-identical until these inputs actually
          # change (and a revert reuses the previously built tag).
          BASE_HASH=$(
            {
              sha256sum packages/agent-runtime/Dockerfile.base \
                        packages/agent-runtime/tech-stacks/expo-three/starter/package.json \
                        packages/agent-runtime/tech-stacks/expo-app/starter/package.json 2>/dev/null
              find packages/sdk/examples -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null
            } | sha256sum | cut -c1-16
          )
          echo "base_tag=base-$BASE_HASH" >> $GITHUB_OUTPUT
          echo "Runtime base content tag: base-$BASE_HASH"

          ENTRIES=""
          add_entry() {
            [ -n "$ENTRIES" ] && ENTRIES="$ENTRIES,"
            ENTRIES="$ENTRIES$1"
          }

          [ "$API_CHANGED" = "true" ] && add_entry '{"image":"api","dockerfile":"apps/api/Dockerfile","image_name":"shogo-api","build_args":"api"}'
          [ "$WEB_CHANGED" = "true" ] && add_entry '{"image":"web","dockerfile":"apps/mobile/Dockerfile","image_name":"shogo-web","build_args":"web"}'
          [ "$RUNTIME_CHANGED" = "true" ] && add_entry '{"image":"runtime","dockerfile":"packages/agent-runtime/Dockerfile","image_name":"shogo-runtime","build_args":"runtime"}'
          [ "$DOCS_CHANGED" = "true" ] && add_entry '{"image":"docs","dockerfile":"apps/docs/Dockerfile","image_name":"shogo-docs","build_args":""}'

          if [ -z "$ENTRIES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "No image changes detected -- all builds will be skipped"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[$ENTRIES]}" >> $GITHUB_OUTPUT
          fi

          echo ""
          echo "Changes detected:"
          echo "  api: $API_CHANGED"
          echo "  web: $WEB_CHANGED"
          echo "  runtime: $RUNTIME_CHANGED"
          echo "  runtime_base: $RUNTIME_BASE_CHANGED"
          echo "  docs: $DOCS_CHANGED"

  # ===========================================================================
  # Stage 1.5: Build Runtime Base Image
  # ===========================================================================
  # Builds the runtime base under a content-hash tag (shogo-runtime-base:<base_tag>)
  # and only when that tag is absent in OCIR. The runtime image is built FROM
  # that exact tag, so the heavy base layers stay byte-identical across deploys
  # until the base inputs actually change. Runs on every has_changes deploy
  # (cheap when the tag already exists: just checkout + login + a manifest
  # probe) so the tag the runtime build needs is guaranteed to exist.
  build-base-image:
    name: Build Runtime Base Image
    runs-on: ubuntu-24.04-arm
    needs: [resolve-config, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true'
    environment: ${{ needs.resolve-config.outputs.environment == 'production' && 'production-us' || needs.resolve-config.outputs.environment }}
    timeout-minutes: 60

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login \
            ${{ vars.OCI_REGION }}.ocir.io \
            -u "${{ vars.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Check whether base image already exists
        id: check
        env:
          BASE_REF: ${{ needs.resolve-config.outputs.ocir_registry }}/shogo/shogo-runtime-base
          BASE_TAG: ${{ needs.detect-changes.outputs.base_tag }}
        run: |
          if docker buildx imagetools inspect "${BASE_REF}:${BASE_TAG}" >/dev/null 2>&1; then
            echo "Base image ${BASE_REF}:${BASE_TAG} already exists — skipping rebuild."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Base image ${BASE_REF}:${BASE_TAG} not found — will build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.should_build == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build and push base image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/agent-runtime/Dockerfile.base
          platforms: linux/arm64
          push: true
          provenance: false
          # Immutable content-hash tag is what the runtime build consumes;
          # :latest and :<sha> are kept for humans / rollback tooling.
          tags: |
            ${{ needs.resolve-config.outputs.ocir_registry }}/shogo/shogo-runtime-base:${{ needs.detect-changes.outputs.base_tag }}
            ${{ needs.resolve-config.outputs.ocir_registry }}/shogo/shogo-runtime-base:latest
            ${{ needs.resolve-config.outputs.ocir_registry }}/shogo/shogo-runtime-base:${{ github.sha }}
          # Durable in-region OCIR registry cache (replaces type=gha, whose
          # ~10GB/repo LRU evicted the heavy layers and forced rebuilds with
          # fresh digests every run). image-manifest+oci-mediatypes are
          # required for OCIR compatibility.
          cache-from: type=registry,ref=${{ needs.resolve-config.outputs.ocir_registry }}/shogo/buildcache:runtime-base
          cache-to: type=registry,ref=${{ needs.resolve-config.outputs.ocir_registry }}/shogo/buildcache:runtime-base,mode=max,image-manifest=true,oci-mediatypes=true

  # ===========================================================================
  # Stage 1.7: Build Workspace Deps Image
  # ===========================================================================
  # Bakes the JS workspace once per CI run: full `bun install` (uid 1001),
  # `bun run build:packages`, `generate:routes`, runtime-template install,
  # `build-template-dists`, and external Claude skills. Downstream matrix
  # images (api, web, runtime) `FROM` this image instead of doing all of
  # the above three times in parallel.
  #
  # Gated on has_changes so we only rebuild when at least one matrix image
  # also rebuilds — saves cycles on docs-only PRs. GHA layer cache makes
  # no-op rebuilds fast even when triggered.
  # ===========================================================================
  build-workspace-deps:
    name: Build Workspace Deps Image
    runs-on: ubuntu-24.04-arm
    needs: [resolve-config, detect-changes]
    # Runs whenever any matrix image is set to build. Docs doesn't consume
    # workspace-deps, but on a cache hit this rebuild is ~30s and we'd need
    # the matrix `if:` to special-case docs (matrix context isn't available
    # at job level), which gets ugly. Pay the small cost.
    if: needs.detect-changes.outputs.has_changes == 'true'
    environment: ${{ needs.resolve-config.outputs.environment == 'production' && 'production-us' || needs.resolve-config.outputs.environment }}
    timeout-minutes: 30

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login \
            ${{ vars.OCI_REGION }}.ocir.io \
            -u "${{ vars.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push workspace-deps image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/workspace-deps/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ needs.resolve-config.outputs.ocir_registry }}/shogo/shogo-workspace-deps:latest
            ${{ needs.resolve-config.outputs.ocir_registry }}/shogo/shogo-workspace-deps:${{ github.sha }}
          # Durable in-region OCIR registry cache (see build-base-image).
          cache-from: type=registry,ref=${{ needs.resolve-config.outputs.ocir_registry }}/shogo/buildcache:workspace-deps
          cache-to: type=registry,ref=${{ needs.resolve-config.outputs.ocir_registry }}/shogo/buildcache:workspace-deps,mode=max,image-manifest=true,oci-mediatypes=true

  # ===========================================================================
  # Stage 2: Build and Push Docker Images to OCIR (in parallel)
  # Images are pushed to the primary (US) OCIR registry.
  # ===========================================================================
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04-arm
    needs: [resolve-config, detect-changes, build-base-image, build-workspace-deps]
    if: |
      always() &&
      needs.resolve-config.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      (needs.build-base-image.result == 'success' || needs.build-base-image.result == 'skipped') &&
      needs.build-workspace-deps.result == 'success'
    environment: ${{ needs.resolve-config.outputs.environment == 'production' && 'production-us' || needs.resolve-config.outputs.environment }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}

    steps:
      - name: Free disk space (large runtime images)
        if: matrix.image == 'runtime'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login \
            ${{ vars.OCI_REGION }}.ocir.io \
            -u "${{ vars.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Determine image tag prefix
        id: tag-prefix
        run: |
          if [[ "${{ needs.resolve-config.outputs.environment }}" == "production" ]]; then
            echo "prefix=production" >> $GITHUB_OUTPUT
          else
            echo "prefix=${{ needs.resolve-config.outputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          # Staging builds run concurrently across commits, so staging's
          # `-latest` is moved by the locked rollout (deploy-staging.yml).
          tags: |
            ${{ steps.tag-prefix.outputs.prefix == 'production' && format('{0}/shogo/{1}:production-latest', needs.resolve-config.outputs.ocir_registry, matrix.image_name) || '' }}
            ${{ needs.resolve-config.outputs.ocir_registry }}/shogo/${{ matrix.image_name }}:${{ steps.tag-prefix.outputs.prefix }}-${{ github.sha }}
          # Images must stay environment-agnostic: production promotes the
          # staging-built digests unchanged (see promote-images). Per-env web
          # config (app env, GA4, FB Pixel) is injected at container start via
          # the studio ksvc env, so never add an environment-specific arg here.
          build-args: |
            ${{ matrix.build_args != '' && format('WORKSPACE_DEPS={0}/shogo/shogo-workspace-deps:{1}', needs.resolve-config.outputs.ocir_registry, github.sha) || '' }}
            ${{ matrix.build_args == 'api' && format('BUILD_HASH={0}', github.sha) || '' }}
            ${{ matrix.build_args == 'web' && format('EXPO_PUBLIC_BUILD_HASH={0}', github.sha) || '' }}
            ${{ matrix.build_args == 'web' && format('EXPO_PUBLIC_APP_VERSION={0}', needs.resolve-config.outputs.app_version) || '' }}
            ${{ matrix.build_args == 'web' && format('EXPO_PUBLIC_SENTRY_DSN_WEB={0}', secrets.EXPO_PUBLIC_SENTRY_DSN_WEB) || '' }}
            ${{ matrix.build_args == 'web' && format('SENTRY_AUTH_TOKEN={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
            ${{ matrix.build_args == 'web' && 'SENTRY_ORG=shogo-ai' || '' }}
            ${{ matrix.build_args == 'web' && 'SENTRY_PROJECT=javascript-react' || '' }}
            ${{ matrix.build_args == 'web' && 'REQUIRE_SENTRY_UPLOAD=true' || '' }}
            ${{ matrix.build_args == 'runtime' && format('BASE_IMAGE={0}/shogo/shogo-runtime-base:{1}', needs.resolve-config.outputs.ocir_registry, needs.detect-changes.outputs.base_tag) || '' }}
            ${{ matrix.build_args == 'runtime' && format('SHOGO_RUNTIME_REVISION={0}', github.sha) || '' }}
          # Durable in-region OCIR registry cache (see build-base-image). One
          # cache tag per image keeps node_modules / build layers stable across
          # runs, so app-only deploys reuse their digests and nodes pull only
          # the changed source layers.
          cache-from: type=registry,ref=${{ needs.resolve-config.outputs.ocir_registry }}/shogo/buildcache:${{ matrix.image }}
          cache-to: type=registry,ref=${{ needs.resolve-config.outputs.ocir_registry }}/shogo/buildcache:${{ matrix.image }},mode=max,image-manifest=true,oci-mediatypes=true

      # Upload the studio web app's immutable, content-hashed Expo assets
      # (dist/_expo) to a shared, append-only object-storage bucket. A
      # Cloudflare Worker serves studio.<env>.shogo.ai/_expo/* from this
      # bucket same-origin, so a browser can always fetch a build's hashed
      # assets no matter which Knative studio revision served the HTML. This
      # is what makes the multi-revision asset-404 class of bug impossible.
      #
      # Runs in build-and-push (before any deploy job patches the ksvc), so
      # the assets exist in the bucket before the new HTML references them.
      # Content-hashed filenames make `aws s3 sync` append-only: new builds
      # add files, older builds' files are preserved (rollback-safe).
      #
      # Staging-only for now — the bucket + Worker are wired for staging in
      # terraform/environments/staging. Production rollout wires the same
      # module per region and drops this environment gate.
      - name: Upload web static assets to CDN bucket
        if: matrix.image == 'web' && needs.resolve-config.outputs.environment == 'staging'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          OCI_S3_ENDPOINT: ${{ vars.OCI_S3_ENDPOINT }}
          OCIR_REGISTRY: ${{ needs.resolve-config.outputs.ocir_registry }}
          # AWS CLI v2 (>= 2.23) adds default integrity checksums that upload via
          # `Content-Encoding: aws-chunked` with a trailing checksum. OCI's
          # S3-compatible endpoint rejects that with `NotImplemented: AWS chunked
          # encoding not supported`. Force checksums to WHEN_REQUIRED so PutObject
          # uses a plain, pre-signed payload the OCI endpoint accepts.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          set -euo pipefail
          # Materialize ONLY dist/_expo via the `web-assets` stage (FROM
          # scratch). Build args + cache ref match the image build above, so
          # every builder layer is a cache hit and this just exports the
          # already-produced, byte-identical _expo tree (source maps already
          # stripped in the builder stage).
          docker buildx build \
            --target web-assets \
            --file apps/mobile/Dockerfile \
            --platform linux/arm64 \
            --build-arg WORKSPACE_DEPS="${OCIR_REGISTRY}/shogo/shogo-workspace-deps:${{ github.sha }}" \
            --build-arg EXPO_PUBLIC_BUILD_HASH="${{ github.sha }}" \
            --build-arg EXPO_PUBLIC_APP_VERSION="${{ needs.resolve-config.outputs.app_version }}" \
            --build-arg EXPO_PUBLIC_SENTRY_DSN_WEB="${{ secrets.EXPO_PUBLIC_SENTRY_DSN_WEB }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --build-arg SENTRY_ORG=shogo-ai \
            --build-arg SENTRY_PROJECT=javascript-react \
            --build-arg REQUIRE_SENTRY_UPLOAD=true \
            --cache-from type=registry,ref="${OCIR_REGISTRY}/shogo/buildcache:web" \
            --output type=local,dest=./web-assets \
            .
          test -d ./web-assets/_expo || { echo "ERROR: ./web-assets/_expo missing after export"; exit 1; }
          # Re-PUT the FULL current asset set every deploy (cp --recursive, not
          # sync). Content-hashed names mean this is still append-only for new
          # builds, but re-uploading refreshes the object creation time of every
          # asset THIS build references. The bucket's 30-day DELETE lifecycle
          # (terraform/modules/studio-web-assets) then only reaps assets that no
          # deploy has referenced for 30 days. A plain `sync` would skip an
          # unchanged-but-still-referenced chunk, let it age out, and reintroduce
          # the 404 - so this MUST stay `cp --recursive`.
          aws s3 cp ./web-assets/_expo "s3://shogo-web-assets-staging/_expo/" \
            --recursive \
            --endpoint-url "$OCI_S3_ENDPOINT" \
            --no-progress \
            --exclude "*.map" \
            --cache-control "public, max-age=31536000, immutable"

  # ===========================================================================
  # Stage 2.2: Promote staging images to production (production only)
  # ===========================================================================
  # Production does not rebuild: it ships the exact digests staging built and
  # ran its critical-path e2e against for this commit. deploy-staging.yml's
  # "Complete staging release tag set" guarantees every staging-deployed SHA
  # has `staging-<sha>` for all four services; this re-tags them as
  # `production-<sha>` (+ `production-latest`) in the shared US registry.
  # Manifest-only, so it takes seconds, and it is safe to run before
  # staging-e2e-gate passes: nothing deploys until deploy-us, which waits on
  # the gate. `force_rebuild_production` skips this and builds instead.
  promote-images:
    name: Promote staging images
    runs-on: ubuntu-latest
    needs: [resolve-config, detect-changes]
    if: needs.detect-changes.outputs.promote == 'true' && needs.resolve-config.outputs.dry_run != 'true'
    environment: production-us
    timeout-minutes: 10
    env:
      OCIR_REGISTRY: ${{ needs.resolve-config.outputs.ocir_registry }}
      SRC_TAG: staging-${{ github.sha }}
      DST_TAG: production-${{ github.sha }}
    steps:
      - name: Login to OCIR
        run: |
          echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login \
            ${{ vars.OCI_REGION }}.ocir.io \
            -u "${{ vars.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}" \
            --password-stdin

      - name: Re-tag staging-${{ github.sha }} as production-${{ github.sha }}
        run: |
          set -euo pipefail
          REPOS="shogo-api shogo-web shogo-docs shogo-runtime"
          MISSING=""
          for repo in $REPOS; do
            if ! docker buildx imagetools inspect "${OCIR_REGISTRY}/shogo/${repo}:${SRC_TAG}" >/dev/null 2>&1; then
              MISSING="$MISSING $repo"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::No ${SRC_TAG} image for:${MISSING}. Only commits deployed to staging after the promote rollout have a complete staging tag set. Deploy this commit to staging first, or re-run with force_rebuild_production=true."
            exit 1
          fi
          {
            echo "## Promoted images"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for repo in $REPOS; do
            docker buildx imagetools create --prefer-index=false \
              --tag "${OCIR_REGISTRY}/shogo/${repo}:${DST_TAG}" \
              --tag "${OCIR_REGISTRY}/shogo/${repo}:production-latest" \
              "${OCIR_REGISTRY}/shogo/${repo}:${SRC_TAG}"
            DIGEST=$(docker buildx imagetools inspect "${OCIR_REGISTRY}/shogo/${repo}:${DST_TAG}" --format '{{json .Manifest}}' | jq -r .digest)
            echo "${repo}: ${SRC_TAG} -> ${DST_TAG} (${DIGEST})"
            echo "| \`${repo}\` | \`${DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
          done

  # ===========================================================================
  # Stage 2.5: Replicate Images to Secondary Regions (production only)
  # Uses skopeo to copy images from US OCIR to EU OCIR.
  # ===========================================================================
  replicate-images:
    name: Replicate to ${{ matrix.target_region.region }}
    runs-on: ubuntu-latest
    needs: [resolve-config, detect-changes, build-base-image, build-and-push, promote-images]
    if: |
      always() &&
      needs.resolve-config.outputs.is_production == 'true' &&
      needs.resolve-config.outputs.dry_run != 'true' &&
      needs.resolve-config.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.build-base-image.result == 'success' || needs.build-base-image.result == 'skipped') &&
      (needs.promote-images.result == 'success' || needs.promote-images.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        target_region:
          - region: eu-frankfurt-1
            environment: production-eu

    environment: ${{ matrix.target_region.environment }}

    env:
      US_REGISTRY: ${{ needs.resolve-config.outputs.ocir_registry }}
      TAG: production-${{ github.sha }}
      LATEST_TAG: production-latest

    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Copy images to ${{ matrix.target_region.region }}
        run: |
          TARGET_REGISTRY="${{ matrix.target_region.region }}.ocir.io/${{ vars.OCI_TENANCY_NAMESPACE }}"

          US_CREDS="${{ needs.resolve-config.outputs.oci_tenancy_namespace }}/${{ secrets.OCI_USERNAME }}:${{ secrets.OCI_AUTH_TOKEN }}"
          TARGET_CREDS="${{ vars.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}:${{ secrets.OCI_AUTH_TOKEN }}"

          IMAGES=""
          if [ "${{ needs.detect-changes.outputs.api_changed }}" = "true" ]; then IMAGES="$IMAGES shogo-api"; fi
          if [ "${{ needs.detect-changes.outputs.web_changed }}" = "true" ]; then IMAGES="$IMAGES shogo-web"; fi
          if [ "${{ needs.detect-changes.outputs.runtime_changed }}" = "true" ]; then IMAGES="$IMAGES shogo-runtime"; fi
          if [ "${{ needs.detect-changes.outputs.docs_changed }}" = "true" ]; then IMAGES="$IMAGES shogo-docs"; fi
          if [ "${{ needs.detect-changes.outputs.runtime_base_changed }}" = "true" ]; then IMAGES="$IMAGES shogo-runtime-base"; fi

          if [ -z "$IMAGES" ]; then
            echo "No changed images to replicate"
            exit 0
          fi

          for IMAGE in $IMAGES; do
            echo "Copying $IMAGE to ${{ matrix.target_region.region }}..."

            for TAG_SUFFIX in "$TAG" "$LATEST_TAG"; do
              if [ "$IMAGE" = "shogo-runtime-base" ]; then
                SRC_TAG=$(echo "$TAG_SUFFIX" | sed 's/production-//')
                skopeo copy --all \
                  --src-creds "$US_CREDS" \
                  --dest-creds "$TARGET_CREDS" \
                  "docker://${US_REGISTRY}/shogo/$IMAGE:$SRC_TAG" \
                  "docker://${TARGET_REGISTRY}/shogo/$IMAGE:$SRC_TAG" || echo "Warning: failed to copy $IMAGE:$SRC_TAG"
              else
                skopeo copy --all \
                  --src-creds "$US_CREDS" \
                  --dest-creds "$TARGET_CREDS" \
                  "docker://${US_REGISTRY}/shogo/$IMAGE:$TAG_SUFFIX" \
                  "docker://${TARGET_REGISTRY}/shogo/$IMAGE:$TAG_SUFFIX" || echo "Warning: failed to copy $IMAGE:$TAG_SUFFIX"
              fi
            done

            echo "Done: $IMAGE"
          done

  # ===========================================================================
  # Stage 3: Deploy to OKE
  # For production: deploys to US first (with migrations), then EU.
  # For staging: single deploy.
  # ===========================================================================

  # --- Staging deploy (single region) + critical-path e2e ---
  # The only part of a staging run that is serialized. A newer run waiting
  # here replaces (cancels) any older one still waiting, so staging rolls
  # forward to the newest built commit. Its images are already built, but a
  # cancelled commit gets no staging tag set or e2e status, so it can't be
  # promoted to production.
  staging-rollout:
    name: Staging rollout
    needs: [setup, resolve-config, detect-changes, build-base-image, build-and-push]
    if: |
      always() &&
      needs.setup.outputs.build_only != 'true' &&
      needs.resolve-config.outputs.is_production == 'false' &&
      needs.resolve-config.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (needs.build-base-image.result == 'success' || needs.build-base-image.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    concurrency:
      group: deploy-v2-staging-rollout
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/deploy-staging.yml
    with:
      environment: ${{ needs.resolve-config.outputs.environment }}
      namespace_system: ${{ needs.resolve-config.outputs.namespace_system }}
      namespace_workspaces: ${{ needs.resolve-config.outputs.namespace_workspaces }}
      domain: ${{ needs.resolve-config.outputs.domain }}
      docs_domain: ${{ needs.resolve-config.outputs.docs_domain }}
      app_version: ${{ needs.resolve-config.outputs.app_version }}
      ocir_registry: ${{ needs.resolve-config.outputs.ocir_registry }}
      oke_cluster_ocid: ${{ needs.resolve-config.outputs.oke_cluster_ocid }}
      node_pool_ocid: ${{ needs.resolve-config.outputs.node_pool_ocid }}
      api_changed: ${{ needs.detect-changes.outputs.api_changed }}
      web_changed: ${{ needs.detect-changes.outputs.web_changed }}
      docs_changed: ${{ needs.detect-changes.outputs.docs_changed }}
      runtime_changed: ${{ needs.detect-changes.outputs.runtime_changed }}
    secrets: inherit

  # --- Production: require a green staging critical-path e2e on this SHA ---
  # A v* tag normally points at a main commit whose staging rollout (deploy +
  # critical-path e2e) may still be running, so wait for it. Fail fast if
  # no main deploy for this SHA exists (e.g. it was superseded in the deploy
  # queue): deploy that commit to staging first or tag a commit that was.
  staging-e2e-gate:
    name: Staging e2e gate
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.is_production == 'true' && needs.setup.outputs.build_only != 'true' && needs.setup.outputs.dry_run != 'true'
    timeout-minutes: 120
    permissions:
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts/ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Wait for e2e/staging-critical to pass for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SKIP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_staging_e2e_gate == 'true' }}
        run: bun scripts/ci/wait-for-staging-e2e.ts

  # ===========================================================================
  # Dry run (workflow_dispatch environment=production dry_run=true)
  # Every job above that changes something is off, so is everything below
  # (deploy-us / deploy-eu, and through them the metal jobs). These plan what
  # a real deploy of this commit would do and fail on anything that would
  # make it fail: missing staging images, manifests the API server rejects,
  # a disk-starved cluster, a stuck migration, a red staging e2e.
  # ===========================================================================
  plan-region:
    name: Dry run plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [setup, resolve-config]
    if: needs.setup.outputs.dry_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [production-us, production-eu]
    environment: ${{ matrix.environment }}
    timeout-minutes: 20
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Configure kubectl for OKE
        run: |
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id "${{ vars.OKE_CLUSTER_OCID }}" \
            --region "${{ vars.OCI_REGION }}" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          kubectl get nodes > /dev/null

      - name: Plan
        env:
          SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ matrix.environment }}
          NS_SYSTEM: ${{ vars.NAMESPACE_SYSTEM }}
          REGION_REGISTRY: ${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_TENANCY_NAMESPACE }}
          US_REGISTRY: ${{ needs.resolve-config.outputs.ocir_registry }}
          REGISTRY_USERNAME: ${{ vars.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.OCI_AUTH_TOKEN }}
          APP_VERSION: ${{ needs.resolve-config.outputs.app_version }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          FB_PIXEL_ID: ${{ secrets.FB_PIXEL_ID }}
          CP_URL: ${{ vars.METAL_CONTROL_PLANE_URL }}
          METAL_REGISTER_TOKEN: ${{ secrets.METAL_REGISTER_TOKEN }}
          INSECURE_TLS: ${{ vars.METAL_RELEASE_INSECURE_TLS }}
          FLEET_OUT: fleet/${{ matrix.environment }}.json
        run: |
          mkdir -p fleet
          .github/scripts/plan-production-deploy.sh

      - name: Upload metal fleet reading
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fleet-${{ matrix.environment }}
          path: fleet/
          if-no-files-found: ignore
          retention-days: 1

  plan-release:
    name: Dry run plan (release)
    runs-on: ubuntu-latest
    needs: [setup, resolve-config, plan-region]
    if: always() && needs.setup.outputs.dry_run == 'true' && needs.resolve-config.result == 'success'
    environment: production-us
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      statuses: read
    steps:
      # Full history: the rootfs gate diffs this commit against the fleet's.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'

      - name: Download metal fleet readings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fleet-*
          path: fleet
          merge-multiple: true

      - name: Staging e2e status for this commit
        id: e2e
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GATE_TIMEOUT_MS: '300000'
          GATE_POLL_MS: '15000'
        run: bun scripts/ci/wait-for-staging-e2e.ts

      - name: Metal rootfs gate
        id: gate
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/ci/metal-rootfs-gate.sh decide "$SHA" fleet/production-us.json fleet/production-eu.json | tee -a "$GITHUB_OUTPUT"

      # Runs even when the gate says no rebuild, to show which image a
      # rebuild would use.
      - name: Metal runtime image (dry run)
        id: image
        env:
          SHA: ${{ github.sha }}
          REGISTRY: ${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_TENANCY_NAMESPACE }}
          DRY_RUN: 'true'
          OCI_NS: ${{ vars.OCI_TENANCY_NAMESPACE }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          echo "$OCI_AUTH_TOKEN" | docker login "${REGISTRY%%/*}" -u "$OCI_NS/$OCI_USERNAME" --password-stdin >/dev/null
          bash .github/scripts/promote-metal-runtime-image.sh

      - name: Summary
        if: always()
        env:
          SHA: ${{ github.sha }}
          APP_VERSION: ${{ needs.resolve-config.outputs.app_version }}
          REGIONS: ${{ needs.plan-region.result }}
          E2E: ${{ steps.e2e.outcome }}
          REBUILD: ${{ steps.gate.outputs.rebuild }}
          REASON: ${{ steps.gate.outputs.reason }}
          SOURCE: ${{ steps.image.outputs.source }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "## Release plan for ${SHA:0:12} (${APP_VERSION})"
            echo ""
            echo "- Regions: **${REGIONS}** (see the per-region plans above)"
            echo "- Staging e2e (\`e2e/staging-critical\`): **${E2E}**"
            echo "- Metal rootfs rebuild: **${REBUILD:-unknown}** — ${REASON}"
            if [ "$REBUILD" = "true" ]; then WHEN="would"; else WHEN="if a rebuild were needed, would"; fi
            if [ "$SOURCE" = "promoted" ]; then
              echo "- Metal runtime image: ${WHEN} promote \`${IMAGE##*:}\` (no build)"
            elif [ "$SOURCE" = "build" ]; then
              echo "- Metal runtime image: ${WHEN} **build** \`${IMAGE##*:}\` (~90 min; no staging image matches)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REGIONS" != "success" ] || [ "$E2E" != "success" ]; then
            echo "::error::The production deploy of ${SHA:0:12} would fail (regions=${REGIONS}, staging e2e=${E2E})"
            exit 1
          fi
          echo "A production deploy of ${SHA:0:12} would succeed."

  # --- Production: Deploy US (primary, runs migrations) ---
  deploy-us:
    name: Deploy to US (primary)
    runs-on: ubuntu-latest
    needs: [setup, resolve-config, detect-changes, build-base-image, build-and-push, promote-images, staging-e2e-gate]
    if: |
      always() &&
      needs.setup.outputs.build_only != 'true' &&
      needs.setup.outputs.dry_run != 'true' &&
      needs.resolve-config.outputs.is_production == 'true' &&
      needs.staging-e2e-gate.result == 'success' &&
      needs.resolve-config.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (needs.build-base-image.result == 'success' || needs.build-base-image.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.promote-images.result == 'success' || needs.promote-images.result == 'skipped')
    environment: production-us
    # deploy-eu refreshes the US subscription after EU publishes new tables.
    outputs:
      oke_cluster_ocid: ${{ vars.OKE_CLUSTER_OCID }}
      oci_region: ${{ vars.OCI_REGION }}
      ns_system: ${{ vars.NAMESPACE_SYSTEM }}

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
      ENVIRONMENT: production-us
      NS_SYSTEM: ${{ vars.NAMESPACE_SYSTEM }}
      NS_WORKSPACES: ${{ vars.NAMESPACE_WORKSPACES }}
      DOMAIN: ${{ vars.DOMAIN }}
      DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
      IMAGE_TAG: production-${{ github.sha }}
      REGION_KEY: us

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Configure kubectl for OKE
        run: |
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ vars.OKE_CLUSTER_OCID }} \
            --region ${{ vars.OCI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          kubectl get nodes > /dev/null

      - name: Create namespaces
        run: |
          kubectl create namespace ${{ env.NS_SYSTEM }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ${{ env.NS_WORKSPACES }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update secrets
        run: |
          SECRET_ARGS=(
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          )
          if [ -n "${{ secrets.BETTER_AUTH_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}"); fi
          if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]; then SECRET_ARGS+=(--from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}"); fi
          if [ -n "${{ secrets.STRIPE_WEBHOOK_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}"); fi
          if [ -n "${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=STRIPE_CONNECT_WEBHOOK_SECRET="${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}"); fi
          if [ -n "${{ secrets.GH_APP_ID }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_ID="${{ secrets.GH_APP_ID }}"); fi
          if [ -n "${{ secrets.GH_APP_CLIENT_ID }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_CLIENT_ID="${{ secrets.GH_APP_CLIENT_ID }}"); fi
          if [ -n "${{ secrets.GH_APP_CLIENT_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_CLIENT_SECRET="${{ secrets.GH_APP_CLIENT_SECRET }}"); fi
          if [ -n "${{ secrets.GH_APP_PRIVATE_KEY }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_PRIVATE_KEY="${{ secrets.GH_APP_PRIVATE_KEY }}"); fi
          if [ -n "${{ secrets.GH_APP_WEBHOOK_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_WEBHOOK_SECRET="${{ secrets.GH_APP_WEBHOOK_SECRET }}"); fi
          if [ -n "${{ secrets.GH_APP_SLUG }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_SLUG="${{ secrets.GH_APP_SLUG }}"); fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then SECRET_ARGS+=(--from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"); fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"); fi
          if [ -n "${{ secrets.SERPER_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=SERPER_API_KEY="${{ secrets.SERPER_API_KEY }}"); fi
          if [ -n "${{ secrets.COMPOSIO_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=COMPOSIO_API_KEY="${{ secrets.COMPOSIO_API_KEY }}"); fi
          if [ -n "${{ secrets.COMPOSIO_PROJECT_ID }}" ]; then SECRET_ARGS+=(--from-literal=COMPOSIO_PROJECT_ID="${{ secrets.COMPOSIO_PROJECT_ID }}"); fi
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"); fi
          if [ -n "${{ secrets.GOOGLE_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}"); fi
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}"); fi
          if [ -n "${{ secrets.LOAD_TEST_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=LOAD_TEST_SECRET="${{ secrets.LOAD_TEST_SECRET }}"); fi
          if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then SECRET_ARGS+=(--from-literal=SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"); fi
          if [ -n "${{ secrets.LOOPS_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=LOOPS_API_KEY="${{ secrets.LOOPS_API_KEY }}"); fi
          if [ -n "${{ secrets.ELEVENLABS_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}"); fi
          if [ -n "${{ secrets.ELEVENLABS_VOICE_MODE_AGENT_ID }}" ]; then SECRET_ARGS+=(--from-literal=ELEVENLABS_VOICE_MODE_AGENT_ID="${{ secrets.ELEVENLABS_VOICE_MODE_AGENT_ID }}"); fi
          if [ -n "${{ secrets.ELEVENLABS_WEBHOOK_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=ELEVENLABS_WEBHOOK_SECRET="${{ secrets.ELEVENLABS_WEBHOOK_SECRET }}"); fi
          if [ -n "${{ secrets.LIVEKIT_URL }}" ]; then SECRET_ARGS+=(--from-literal=LIVEKIT_URL="${{ secrets.LIVEKIT_URL }}"); fi
          if [ -n "${{ secrets.LIVEKIT_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=LIVEKIT_API_KEY="${{ secrets.LIVEKIT_API_KEY }}"); fi
          if [ -n "${{ secrets.LIVEKIT_API_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=LIVEKIT_API_SECRET="${{ secrets.LIVEKIT_API_SECRET }}"); fi
          if [ -n "${{ secrets.TWILIO_ACCOUNT_SID }}" ]; then SECRET_ARGS+=(--from-literal=TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}"); fi
          if [ -n "${{ secrets.TWILIO_AUTH_TOKEN }}" ]; then SECRET_ARGS+=(--from-literal=TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}"); fi
          # Shared secret with shogo-website/functions/r/[code].ts for
          # the affiliate click-tracking internal call. See
          # docs/affiliate-mlm-rollout.md.
          if [ -n "${{ secrets.SHOGO_INTERNAL_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=SHOGO_INTERNAL_SECRET="${{ secrets.SHOGO_INTERNAL_SECRET }}"); fi
          # AES-256-GCM master key for encrypting model-provider API keys at
          # rest (apps/api/src/lib/secret-crypto.ts). Must be identical across
          # all regions that share the primary DB so encrypted ModelProvider
          # rows decrypt everywhere. See docs/github-environments-setup.md.
          if [ -n "${{ secrets.SECRETS_ENCRYPTION_KEY }}" ]; then SECRET_ARGS+=(--from-literal=SECRETS_ENCRYPTION_KEY="${{ secrets.SECRETS_ENCRYPTION_KEY }}"); fi

          kubectl create secret generic api-secrets \
            --namespace=${{ env.NS_SYSTEM }} \
            "${SECRET_ARGS[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic anthropic-credentials \
            --namespace=${{ env.NS_WORKSPACES }} \
            --from-literal=api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "${{ secrets.BETTER_AUTH_SECRET }}" ]; then
            kubectl create secret generic preview-secrets \
              --namespace=${{ env.NS_WORKSPACES }} \
              --from-literal=BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          if [ -n "${{ secrets.SIGNOZ_INGESTION_KEY }}" ]; then
            kubectl create secret generic signoz-credentials \
              --namespace=${{ env.NS_SYSTEM }} \
              --from-literal=SIGNOZ_INGESTION_KEY="${{ secrets.SIGNOZ_INGESTION_KEY }}" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic signoz-credentials \
              --namespace=${{ env.NS_WORKSPACES }} \
              --from-literal=SIGNOZ_INGESTION_KEY="${{ secrets.SIGNOZ_INGESTION_KEY }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          # Kourier TLS secret for Knative HTTPS termination (Cloudflare origin cert)
          if [ -n "${{ secrets.KOURIER_TLS_CERT }}" ] && [ -n "${{ secrets.KOURIER_TLS_KEY }}" ]; then
            kubectl create namespace kourier-system 2>/dev/null || true
            kubectl create secret tls kourier-tls \
              --namespace=kourier-system \
              --cert=<(echo "${{ secrets.KOURIER_TLS_CERT }}") \
              --key=<(echo "${{ secrets.KOURIER_TLS_KEY }}") \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Save current images
        id: save-images
        run: |
          get_image() { kubectl get ksvc "$1" -n "$2" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo ""; }
          echo "web_image=$(get_image studio ${{ env.NS_SYSTEM }})" >> $GITHUB_OUTPUT
          echo "api_image=$(get_image api ${{ env.NS_SYSTEM }})" >> $GITHUB_OUTPUT
          echo "docs_image=$(get_image docs ${{ env.NS_SYSTEM }})" >> $GITHUB_OUTPUT

      # Promote mode: every service gets the release tag, and the runtime only
      # re-rolls when its digest differs from what THIS cluster pins (see the
      # script header). Must run before "Apply Kubernetes manifests" resets
      # the ksvc images to :production-latest.
      - name: Resolve release images
        id: release
        env:
          OCIR_REGISTRY: ${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_TENANCY_NAMESPACE }}
          PROMOTE: ${{ needs.detect-changes.outputs.promote }}
          API_CHANGED: ${{ needs.detect-changes.outputs.api_changed }}
          WEB_CHANGED: ${{ needs.detect-changes.outputs.web_changed }}
          DOCS_CHANGED: ${{ needs.detect-changes.outputs.docs_changed }}
          RUNTIME_CHANGED: ${{ needs.detect-changes.outputs.runtime_changed }}
          PREV_WEB_IMAGE: ${{ steps.save-images.outputs.web_image }}
          PREV_API_IMAGE: ${{ steps.save-images.outputs.api_image }}
          PREV_DOCS_IMAGE: ${{ steps.save-images.outputs.docs_image }}
          REGISTRY_USERNAME: ${{ vars.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.OCI_AUTH_TOKEN }}
        run: .github/scripts/resolve-release-images.sh

      # Pre-rollout gate (2026-06-02 EU incident class): refuse to apply
      # manifests / patch ksvcs into a disk-starved cluster. A node above the
      # disk threshold (or already under DiskPressure) cannot bring up a new
      # revision — the kubelet evicts/GCs instead — so the rollout would only
      # fail 10 minutes later with ProgressDeadlineExceeded. Fail fast with an
      # actionable message instead.
      - name: Check node disk headroom (pre-rollout gate)
        run: .github/scripts/check-node-disk-headroom.sh 80

      # pgvector must exist before the api pods start: their entrypoint runs
      # `prisma migrate deploy` as `shogo`, which can't create untrusted
      # extensions. This has to precede `Apply Kubernetes manifests`, whose
      # ksvc points at the mutable `:<env>-latest` tag and so can start the
      # new image right away. See k8s/cnpg/ensure-extensions.sql.
      - name: Ensure Postgres extensions
        run: |
          set -euo pipefail
          PRIMARY=$(kubectl get pods -n ${{ env.NS_SYSTEM }} \
            -l "cnpg.io/cluster=platform-pg,cnpg.io/instanceRole=primary" \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$PRIMARY" ]; then
            echo "::error::No primary pod found for platform-pg cluster in ${{ env.NS_SYSTEM }}"
            exit 1
          fi
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -v ON_ERROR_STOP=1 < k8s/cnpg/ensure-extensions.sql \
            || { echo "::error::Could not install Postgres extensions on US"; exit 1; }

      - name: Apply Kubernetes manifests
        run: |
          # Render RUNTIME_IMAGE into the api ksvc at apply time, mirroring the
          # image-prepuller's RUNTIME_IMAGE_PLACEHOLDER substitution. The
          # overlay ships the placeholder token, never a real (or
          # `:<env>-bootstrap`) value, so `kubectl apply` itself can never stamp
          # a non-existent runtime image onto the api ksvc and then rely on a
          # later imperative patch to undo it. That undo-gap bricked India on
          # 2026-05-27 when a mid-deploy abort left the placeholder live. The
          # immutable :<env>-<sha> tag comes from "Resolve release images";
          # apply-release-images.sh re-verifies it downstream as
          # defense-in-depth.
          # The studio image is environment-agnostic; production overlays
          # also carry release-version / GA4 / Facebook Pixel placeholders
          # (staging has none).
          export RUNTIME_IMAGE="${{ steps.release.outputs.runtime_image }}"
          export APP_VERSION="${{ needs.resolve-config.outputs.app_version }}"
          export GA4_MEASUREMENT_ID="${{ secrets.GA4_MEASUREMENT_ID }}"
          export FB_PIXEL_ID="${{ secrets.FB_PIXEL_ID }}"
          echo "Rendering manifests with RUNTIME_IMAGE=${RUNTIME_IMAGE}"
          .github/scripts/render-overlay.sh "${{ env.ENVIRONMENT }}" > /tmp/manifests.yaml
          kubectl apply -f /tmp/manifests.yaml
          # Node-level inotify quota bump — DaemonSet lives in kube-system,
          # outside the kustomize overlay (kustomize blocks reaching into
          # ../../base/ from an overlay). See k8s/base/inotify-tuner.yaml
          # for context.
          kubectl apply -f k8s/base/inotify-tuner.yaml

      - name: Ensure Kourier TLS configuration
        run: |
          kubectl set env deployment/net-kourier-controller -n knative-serving \
            CERTS_SECRET_NAMESPACE=kourier-system \
            CERTS_SECRET_NAME=kourier-tls || true

      - name: Ensure Kourier connection draining and stream timeouts
        run: |
          kubectl patch configmap config-kourier -n knative-serving --type merge \
            -p '{"data":{"drain-time-seconds":"15","stream-idle-timeout":"0s"}}' || true

      - name: Ensure Knative max revision timeout for long-running agent turns
        run: |
          kubectl patch configmap config-defaults -n knative-serving --type merge \
            -p '{"data":{"max-revision-timeout-seconds":"3600","revision-idle-timeout-seconds":"0"}}' || true

      # Durable guardrail (run 26873062665, 2026-06-03): bound runtime-image
      # accumulation on nodes. Each deploy pulls a new ~8 GB runtime image;
      # with retain-since-create-time at the old 48h default, every superseded
      # revision kept its image referenced (un-reclaimable by the kubelet) for
      # two days. Stacked images pushed India's nodes past the kubelet
      # DiskPressure threshold and aborted the deploy at the pre-rollout disk
      # gate. Enforcing tightened GC on EVERY deploy (instead of the previous
      # apply-once / manual k8s/knative/config-gc.yaml, which silently drifts)
      # lets the kubelet reclaim unreferenced images within hours. Keep these
      # values in sync with k8s/knative/config-gc.yaml.
      - name: Ensure Knative revision GC bounds runtime-image accumulation
        run: |
          kubectl patch configmap config-gc -n knative-serving --type merge \
            -p '{"data":{"max-non-active-revisions":"2","retain-since-create-time":"6h","retain-since-last-active-time":"30m","min-non-active-revisions":"1"}}' || true

      # Knative docs: when raising max-revision-timeout-seconds, the
      # activator's terminationGracePeriodSeconds should be at least as
      # long, so in-flight requests aren't disrupted on activator drain.
      - name: Ensure Knative activator drain window matches max revision timeout
        run: |
          kubectl patch deployment activator -n knative-serving --type merge \
            -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":3600}}}}' || true

      - name: Ensure OCI LB idle timeout for SSE streaming
        run: |
          kubectl annotate svc kourier -n kourier-system \
            service.beta.kubernetes.io/oci-load-balancer-connection-idle-timeout="1800" \
            --overwrite || true

      - name: Ensure docs DomainMapping
        if: env.DOCS_DOMAIN != ''
        run: |
          kubectl apply -f - <<EOF || true
          apiVersion: serving.knative.dev/v1beta1
          kind: DomainMapping
          metadata:
            name: ${{ env.DOCS_DOMAIN }}
            namespace: ${{ env.NS_SYSTEM }}
          spec:
            ref:
              name: docs
              kind: Service
              apiVersion: serving.knative.dev/v1
          EOF

      - name: Verify configured node pool matches running nodes
        run: |
          NODE_POOL_OCID="${{ vars.NODE_POOL_OCID }}"
          if [ -z "$NODE_POOL_OCID" ]; then echo "NODE_POOL_OCID not set, skipping"; exit 0; fi
          POOL_HASH=$(echo "$NODE_POOL_OCID" | rev | cut -c1-11 | rev)
          NODE_NAMES=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.labels.displayName}{"\n"}{end}' 2>/dev/null || true)
          if [ -z "$NODE_NAMES" ]; then echo "::warning::Could not list nodes for pool verification"; exit 0; fi
          if ! echo "$NODE_NAMES" | grep -q "$POOL_HASH"; then
            echo "::error::Configured NODE_POOL_OCID (.../${POOL_HASH}) does not match any running node displayName."
            echo "::error::Running nodes:"; echo "$NODE_NAMES" | sed 's/^/  /'
            echo "::error::Update the GitHub Actions variable NODE_POOL_OCID for environment ${{ env.ENVIRONMENT }}."
            exit 1
          fi
          echo "Node pool OCID matches running nodes (hash=$POOL_HASH)"

      - name: Deploy Cluster Autoscaler
        run: |
          NODE_POOL_OCID="${{ vars.NODE_POOL_OCID }}"
          if [ -z "$NODE_POOL_OCID" ]; then echo "Skipping autoscaler"; exit 0; fi
          # Standing-headroom floor (run 26865807851, 2026-06-02): keep MIN
          # warm (already-prepulled) nodes at idle so a rollout's `min-scale`
          # api/warm-pool pods always land on a warm node instead of forcing
          # the autoscaler to provision a COLD one mid-deploy. Defaults keep
          # MIN>=2 so a missing var can never regress to the old scale-to-1
          # behavior. Keep vars.NODE_POOL_MIN/MAX in sync with terraform
          # system_pool_min/system_pool_max.
          NODE_POOL_MIN="${{ vars.NODE_POOL_MIN || '2' }}"
          NODE_POOL_MAX="${{ vars.NODE_POOL_MAX || '10' }}"
          sed -e "s|NODE_POOL_MIN_PLACEHOLDER|$NODE_POOL_MIN|g" \
              -e "s|NODE_POOL_MAX_PLACEHOLDER|$NODE_POOL_MAX|g" \
              -e "s|NODE_POOL_OCID_PLACEHOLDER|$NODE_POOL_OCID|g" \
              k8s/base/cluster-autoscaler.yaml | kubectl apply -f -
          kubectl rollout restart deployment/cluster-autoscaler -n kube-system || true
          kubectl rollout status deployment/cluster-autoscaler -n kube-system --timeout=180s || true

      # Continuous warm-pool health monitor: a 5-minute CronJob that fails
      # the K8s job (and pages via the existing kube_job_status_failed
      # alert) on any of the 2026-05-27 incident classes — placeholder env
      # leak on api ksvc, ImagePullBackOff/CrashLoopBackOff on a warm-pool
      # pod, or zero-Ready warm-pool ksvcs. See k8s/base/warm-pool-monitor.yaml.
      - name: Deploy warm-pool monitor
        run: |
          sed -e "s|namespace: shogo-staging-system|namespace: ${{ env.NS_SYSTEM }}|g" \
              -e "s|value: shogo-staging-system|value: ${{ env.NS_SYSTEM }}|g" \
              -e "s|value: shogo-staging-workspaces|value: ${{ env.NS_WORKSPACES }}|g" \
              k8s/base/warm-pool-monitor.yaml | kubectl apply -f -

      # Shared with deploy-staging.yml and rollback-production.yml: pin the runtime
      # image, block on the prepull gate (run 26865807851, 2026-06-02), patch
      # the ksvcs, retire stale studio revisions (2026-07-18 EU CSS-404), and
      # re-pin + verify RUNTIME_IMAGE on the api ksvc (2026-05-27 502s).
      - name: Apply release images
        env:
          RUNTIME_TAG: ${{ steps.release.outputs.runtime_tag }}
          RUNTIME_IMAGE: ${{ steps.release.outputs.runtime_image }}
          API_IMAGE: ${{ steps.release.outputs.api_image }}
          WEB_IMAGE: ${{ steps.release.outputs.web_image }}
          DOCS_IMAGE: ${{ steps.release.outputs.docs_image }}
          RETIRE_STALE_STUDIO: ${{ steps.release.outputs.web_changed }}
        run: .github/scripts/apply-release-images.sh

      - name: Wait for rollout and health check
        run: |
          # See the staging block for the rationale behind this gate.
          wait_ksvc_ready() {
            local name=$1 ns=$2 timeout_sec=${3:-600}
            local target_gen lcre lread obs ready elapsed=0
            target_gen=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.metadata.generation}')
            echo "Waiting for ksvc/$name (gen=$target_gen) to roll out..."
            while [ "$elapsed" -lt "$timeout_sec" ]; do
              obs=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.status.observedGeneration}' 2>/dev/null || echo 0)
              ready=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
              lcre=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.status.latestCreatedRevisionName}' 2>/dev/null || true)
              lread=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.status.latestReadyRevisionName}' 2>/dev/null || true)
              if [ "$obs" = "$target_gen" ] && [ "$ready" = "True" ] && [ -n "$lcre" ] && [ "$lcre" = "$lread" ]; then
                echo "ksvc/$name rolled out to $lcre"
                return 0
              fi
              sleep 10
              elapsed=$((elapsed + 10))
            done
            echo "::error::ksvc/$name did not reach Ready within ${timeout_sec}s (gen=$target_gen obs=$obs ready=$ready latestCreated=$lcre latestReady=$lread)"
            echo "::group::revision describe"
            kubectl describe revision "$lcre" -n "$ns" || true
            echo "::endgroup::"
            echo "::group::revision logs"
            kubectl logs --tail=200 -l "serving.knative.dev/revision=$lcre" -n "$ns" --all-containers || true
            echo "::endgroup::"
            return 1
          }
          for s in api studio; do
            wait_ksvc_ready "$s" "${{ env.NS_SYSTEM }}" 600
          done

          sleep 30
          HEALTHY=false
          for i in $(seq 1 20); do
            KOURIER_IP=$(kubectl get svc kourier -n kourier-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            if [ -n "$KOURIER_IP" ]; then
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 15 -H "Host: ${{ env.DOMAIN }}" "http://${KOURIER_IP}/api/health" 2>/dev/null) || STATUS="000"
            else
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 15 "https://${{ env.DOMAIN }}/api/health" 2>/dev/null) || STATUS="000"
            fi
            if [ "$STATUS" = "200" ]; then
              echo "US API healthy (attempt $i)"
              HEALTHY=true
              break
            fi
            echo "US API not ready ($STATUS), retrying... ($i/20)"
            sleep 10
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "::error::US API health check did not return 200 after 20 attempts"
            exit 1
          fi

      # (removed) Knative warm-pool health gate — vestigial under metal-only
      # prod (see staging block). Metal is authoritative for project runtimes;
      # the Knative project/warm-pool ksvcs churn and were failing the deploy
      # while the api ksvc itself rolled out healthy. Tier 4 (revision GC) below
      # is still relevant.
      - name: Garbage-collect old api revisions
        run: |
          .github/scripts/gc-old-api-revisions.sh "${{ env.NS_SYSTEM }}"

      # ----------------------------------------------------------------------
      # Logical replication: keep the cross-region publication in sync.
      #
      # The publication YAML uses `tablesInSchema: public`, so Postgres itself
      # automatically publishes any table created by `prisma migrate deploy`
      # — no YAML edits needed when the schema grows. We still re-apply the
      # CR every deploy (idempotent) so a manual edit on the cluster can't
      # silently survive, and we issue `REFRESH PUBLICATION` on each local
      # subscription so any new tables added on EU become visible to
      # US within minutes instead of waiting for the hourly monitor.
      #
      # Background: incident #501 — 26 tables (incl. api_keys) were silently
      # missing from this publication for weeks because the old hand-list
      # had drifted. See `k8s/cnpg/logical-replication/RUNBOOK.md`.
      # ----------------------------------------------------------------------
      - name: Reconcile logical replication publication
        run: |
          kubectl apply -f k8s/cnpg/production-us-oci/platform-publication.yaml

      # ----------------------------------------------------------------------
      # Logical replication: keep the SELECT contract for `logical_replicator`
      # in sync.
      #
      # The publication is `FOR TABLES IN SCHEMA public`, so new tables join
      # the publication automatically. But Postgres does NOT auto-grant SELECT
      # to `logical_replicator` on those new tables — and tablesync workers
      # connect as that role. A missing GRANT causes the tablesync worker to
      # fail, respawn, leak a slot, and eventually break unrelated healthy
      # subscriptions when the slot pool saturates.
      #
      # grants.sql installs (a) a sweep over current tables, (b) ALTER
      # DEFAULT PRIVILEGES for every role that creates tables, and (c) an
      # event trigger that auto-grants SELECT on every future CREATE TABLE
      # in `public`. The event trigger wraps its GRANT in an EXCEPTION
      # handler so a failure cannot block a migration.
      #
      # Idempotent and safe to run on every deploy. See the file header for
      # the full rationale.
      # ----------------------------------------------------------------------
      # Resolve the *current* CNPG primary by label, not the hardcoded
      # `platform-pg-1`. After any failover (planned switchover, OS upgrade,
      # node drain, OOMKill) the primary may be `platform-pg-2` or
      # `platform-pg-3`. Hardcoding `platform-pg-1` would land us on a
      # standby where every GRANT / ALTER / CREATE fails with `read-only
      # transaction`, the `|| echo ::warning::` would swallow it, the deploy
      # would go green, and the contract would silently drift.
      - name: Locate CNPG primary pod
        id: pg_primary_us
        run: |
          set -euo pipefail
          PRIMARY=$(kubectl get pods -n ${{ env.NS_SYSTEM }} \
            -l "cnpg.io/cluster=platform-pg,cnpg.io/instanceRole=primary" \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$PRIMARY" ]; then
            echo "::error::No primary pod found for platform-pg cluster in ${{ env.NS_SYSTEM }}"
            exit 1
          fi
          echo "Located primary on US: $PRIMARY"
          echo "PG_PRIMARY=$PRIMARY" >> "$GITHUB_ENV"

      # Table-ownership contract — keep `shogo` the owner of every table in
      # `public`. US is the primary and is already fully shogo-owned, so the
      # sweep is a no-op here, but installing the enforce-owner event trigger
      # (and asserting the contract) on US too keeps all three regions
      # symmetric — US is also a subscriber in the active-active topology.
      # See enforce-table-ownership.sql for the full rationale.
      - name: Reconcile table ownership
        run: |
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo < k8s/cnpg/logical-replication/enforce-table-ownership.sql \
            || { echo "::error::table-ownership reconciliation failed on US"; exit 1; }

      - name: Verify ownership contract
        run: |
          set -euo pipefail
          DRIFTED=$(kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -tAc "
              SELECT count(*)
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind IN ('r','p')
                AND c.relowner <> 'shogo'::regrole;
            ")
          if [ "$DRIFTED" != "0" ]; then
            echo "::error::$DRIFTED tables in public are not owned by shogo on US"
            kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
              psql -U postgres -d shogo -c "
                SELECT n.nspname || '.' || c.relname AS drifted_table, c.relowner::regrole AS owner
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relkind IN ('r','p')
                  AND c.relowner <> 'shogo'::regrole;
              "
            exit 1
          fi
          echo "✓ shogo owns every table in public on US"

      - name: Reconcile logical replication GRANTs
        run: |
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo < k8s/cnpg/logical-replication/grants.sql \
            || echo "::warning::GRANT reconciliation failed on US (see logs above)"

      # Hard assertion: every table in `public` must have SELECT for
      # `logical_replicator` after the reconcile step. Converts a silent
      # warning into a failed deploy if the contract is ever drift'd.
      - name: Verify GRANT contract
        run: |
          set -euo pipefail
          MISSING=$(kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -tAc "
              SELECT count(*)
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'r'
                AND NOT has_table_privilege('logical_replicator', c.oid, 'SELECT');
            ")
          if [ "$MISSING" != "0" ]; then
            echo "::error::$MISSING tables in public still lack SELECT for logical_replicator on US"
            kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
              psql -U postgres -d shogo -c "
                SELECT n.nspname || '.' || c.relname AS missing_table
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relkind = 'r'
                  AND NOT has_table_privilege('logical_replicator', c.oid, 'SELECT');
              "
            exit 1
          fi
          echo "✓ logical_replicator has SELECT on every public table on US"

      # Install / re-affirm the `_prisma_migrations` REPLICA-trigger that
      # discards replicated changes. Without it, a `_prisma_migrations` row
      # from a peer region with `finished_at IS NULL` (because the apply
      # worker is stuck mid-transaction) makes Prisma here bail with
      # P3009, blocking every future deploy on this cluster — the
      # 2026-05-26 incident pattern. Idempotent. See
      # k8s/cnpg/logical-replication/skip-replicated-migrations.sql.
      - name: Install _prisma_migrations REPLICA-trigger
        run: |
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo \
            < k8s/cnpg/logical-replication/skip-replicated-migrations.sql \
            || { echo "::error::skip-replicated-migrations.sql failed on US"; exit 1; }

      - name: Verify _prisma_migrations REPLICA-trigger
        run: |
          set -euo pipefail
          STATE=$(kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -tAc "
              SELECT tgenabled
              FROM pg_trigger
              WHERE tgrelid='_prisma_migrations'::regclass
                AND tgname='skip_replicated_migrations_trg';
            ")
          if [ "$STATE" != "R" ]; then
            echo "::error::skip_replicated_migrations_trg on US is in state '$STATE', expected 'R' (replica-only)"
            exit 1
          fi
          echo "✓ skip_replicated_migrations_trg is REPLICA-mode on US"

      # Re-assert the region-local exclusion of storage_usage + usage_wallets
      # from shogo_all_pub BEFORE refreshing subscribers. The CR above declares
      # `FOR TABLES IN SCHEMA public` (which cannot exclude tables); these two
      # are 🔴 additive counters that poison-pill the mesh, so they are kept
      # region-local until the single-writer work lands. This step is idempotent
      # and FAILS LOUD if CNPG ever reconciled the pub to a schema-level
      # publication (which would re-add them). See the SQL header and
      # docs/runbooks/usage-wallet-single-writer-plan.md.
      - name: Re-assert region-local publication exclusion
        run: |
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -v ON_ERROR_STOP=1 \
            < k8s/cnpg/logical-replication/exclude-region-local-tables.sql \
            || { echo "::error::region-local publication exclusion failed on US"; exit 1; }

      # ENABLE first: a migration that adds columns on US before EU has them
      # disables sub_from_us on EU with "missing replicated columns", and the
      # same happens here in reverse. REFRESH fails on a disabled subscription.
      - name: Refresh logical replication subscriptions
        run: |
          for SUB in sub_from_eu; do
            echo "Refreshing $SUB on US..."
            kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
              psql -U postgres -d shogo -v ON_ERROR_STOP=1 \
                -c "ALTER SUBSCRIPTION ${SUB} ENABLE;" \
                -c "ALTER SUBSCRIPTION ${SUB} REFRESH PUBLICATION;" \
              || echo "::warning::REFRESH PUBLICATION failed for ${SUB} on US (subscription may not exist yet)"
          done

      - name: Summary
        run: |
          echo "## US Production Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ needs.detect-changes.outputs.api_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: ${{ needs.detect-changes.outputs.web_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime: ${{ steps.release.outputs.runtime_changed }}" >> $GITHUB_STEP_SUMMARY

  # --- Production: Deploy EU (active-active node) ---
  deploy-eu:
    name: Deploy to EU (active-active)
    runs-on: ubuntu-latest
    needs: [resolve-config, detect-changes, build-base-image, build-and-push, replicate-images, deploy-us]
    if: |
      always() &&
      needs.resolve-config.outputs.is_production == 'true' &&
      needs.resolve-config.outputs.dry_run != 'true' &&
      needs.deploy-us.result == 'success' &&
      (needs.replicate-images.result == 'success' || needs.replicate-images.result == 'skipped')
    environment: production-eu

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
      ENVIRONMENT: production-eu
      NS_SYSTEM: ${{ vars.NAMESPACE_SYSTEM }}
      NS_WORKSPACES: ${{ vars.NAMESPACE_WORKSPACES }}
      DOMAIN: ${{ vars.DOMAIN }}
      DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
      IMAGE_TAG: production-${{ github.sha }}
      REGION_KEY: eu

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Configure kubectl for OKE
        run: |
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ vars.OKE_CLUSTER_OCID }} \
            --region ${{ vars.OCI_REGION }} \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          kubectl get nodes > /dev/null

      - name: Create namespaces
        run: |
          kubectl create namespace ${{ env.NS_SYSTEM }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ${{ env.NS_WORKSPACES }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update secrets
        run: |
          SECRET_ARGS=(
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          )
          if [ -n "${{ secrets.BETTER_AUTH_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}"); fi
          if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]; then SECRET_ARGS+=(--from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}"); fi
          if [ -n "${{ secrets.STRIPE_WEBHOOK_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}"); fi
          if [ -n "${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=STRIPE_CONNECT_WEBHOOK_SECRET="${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}"); fi
          if [ -n "${{ secrets.GH_APP_ID }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_ID="${{ secrets.GH_APP_ID }}"); fi
          if [ -n "${{ secrets.GH_APP_CLIENT_ID }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_CLIENT_ID="${{ secrets.GH_APP_CLIENT_ID }}"); fi
          if [ -n "${{ secrets.GH_APP_CLIENT_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_CLIENT_SECRET="${{ secrets.GH_APP_CLIENT_SECRET }}"); fi
          if [ -n "${{ secrets.GH_APP_PRIVATE_KEY }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_PRIVATE_KEY="${{ secrets.GH_APP_PRIVATE_KEY }}"); fi
          if [ -n "${{ secrets.GH_APP_WEBHOOK_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_WEBHOOK_SECRET="${{ secrets.GH_APP_WEBHOOK_SECRET }}"); fi
          if [ -n "${{ secrets.GH_APP_SLUG }}" ]; then SECRET_ARGS+=(--from-literal=GH_APP_SLUG="${{ secrets.GH_APP_SLUG }}"); fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then SECRET_ARGS+=(--from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"); fi
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"); fi
          if [ -n "${{ secrets.SERPER_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=SERPER_API_KEY="${{ secrets.SERPER_API_KEY }}"); fi
          if [ -n "${{ secrets.COMPOSIO_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=COMPOSIO_API_KEY="${{ secrets.COMPOSIO_API_KEY }}"); fi
          if [ -n "${{ secrets.COMPOSIO_PROJECT_ID }}" ]; then SECRET_ARGS+=(--from-literal=COMPOSIO_PROJECT_ID="${{ secrets.COMPOSIO_PROJECT_ID }}"); fi
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"); fi
          if [ -n "${{ secrets.GOOGLE_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}"); fi
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}"); fi
          if [ -n "${{ secrets.LOAD_TEST_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=LOAD_TEST_SECRET="${{ secrets.LOAD_TEST_SECRET }}"); fi
          if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then SECRET_ARGS+=(--from-literal=SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"); fi
          if [ -n "${{ secrets.LOOPS_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=LOOPS_API_KEY="${{ secrets.LOOPS_API_KEY }}"); fi
          if [ -n "${{ secrets.ELEVENLABS_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}"); fi
          if [ -n "${{ secrets.ELEVENLABS_VOICE_MODE_AGENT_ID }}" ]; then SECRET_ARGS+=(--from-literal=ELEVENLABS_VOICE_MODE_AGENT_ID="${{ secrets.ELEVENLABS_VOICE_MODE_AGENT_ID }}"); fi
          if [ -n "${{ secrets.ELEVENLABS_WEBHOOK_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=ELEVENLABS_WEBHOOK_SECRET="${{ secrets.ELEVENLABS_WEBHOOK_SECRET }}"); fi
          if [ -n "${{ secrets.LIVEKIT_URL }}" ]; then SECRET_ARGS+=(--from-literal=LIVEKIT_URL="${{ secrets.LIVEKIT_URL }}"); fi
          if [ -n "${{ secrets.LIVEKIT_API_KEY }}" ]; then SECRET_ARGS+=(--from-literal=LIVEKIT_API_KEY="${{ secrets.LIVEKIT_API_KEY }}"); fi
          if [ -n "${{ secrets.LIVEKIT_API_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=LIVEKIT_API_SECRET="${{ secrets.LIVEKIT_API_SECRET }}"); fi
          if [ -n "${{ secrets.TWILIO_ACCOUNT_SID }}" ]; then SECRET_ARGS+=(--from-literal=TWILIO_ACCOUNT_SID="${{ secrets.TWILIO_ACCOUNT_SID }}"); fi
          if [ -n "${{ secrets.TWILIO_AUTH_TOKEN }}" ]; then SECRET_ARGS+=(--from-literal=TWILIO_AUTH_TOKEN="${{ secrets.TWILIO_AUTH_TOKEN }}"); fi
          # Shared secret with shogo-website/functions/r/[code].ts for
          # the affiliate click-tracking internal call. See
          # docs/affiliate-mlm-rollout.md.
          if [ -n "${{ secrets.SHOGO_INTERNAL_SECRET }}" ]; then SECRET_ARGS+=(--from-literal=SHOGO_INTERNAL_SECRET="${{ secrets.SHOGO_INTERNAL_SECRET }}"); fi
          # AES-256-GCM master key for encrypting model-provider API keys at
          # rest (apps/api/src/lib/secret-crypto.ts). Must be identical across
          # all regions that share the primary DB so encrypted ModelProvider
          # rows decrypt everywhere. See docs/github-environments-setup.md.
          if [ -n "${{ secrets.SECRETS_ENCRYPTION_KEY }}" ]; then SECRET_ARGS+=(--from-literal=SECRETS_ENCRYPTION_KEY="${{ secrets.SECRETS_ENCRYPTION_KEY }}"); fi

          kubectl create secret generic api-secrets \
            --namespace=${{ env.NS_SYSTEM }} \
            "${SECRET_ARGS[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic anthropic-credentials \
            --namespace=${{ env.NS_WORKSPACES }} \
            --from-literal=api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "${{ secrets.BETTER_AUTH_SECRET }}" ]; then
            kubectl create secret generic preview-secrets \
              --namespace=${{ env.NS_WORKSPACES }} \
              --from-literal=BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          if [ -n "${{ secrets.SIGNOZ_INGESTION_KEY }}" ]; then
            kubectl create secret generic signoz-credentials \
              --namespace=${{ env.NS_SYSTEM }} \
              --from-literal=SIGNOZ_INGESTION_KEY="${{ secrets.SIGNOZ_INGESTION_KEY }}" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic signoz-credentials \
              --namespace=${{ env.NS_WORKSPACES }} \
              --from-literal=SIGNOZ_INGESTION_KEY="${{ secrets.SIGNOZ_INGESTION_KEY }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          # Kourier TLS secret for Knative HTTPS termination (Cloudflare origin cert)
          if [ -n "${{ secrets.KOURIER_TLS_CERT }}" ] && [ -n "${{ secrets.KOURIER_TLS_KEY }}" ]; then
            kubectl create namespace kourier-system 2>/dev/null || true
            kubectl create secret tls kourier-tls \
              --namespace=kourier-system \
              --cert=<(echo "${{ secrets.KOURIER_TLS_CERT }}") \
              --key=<(echo "${{ secrets.KOURIER_TLS_KEY }}") \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Save current images
        id: save-images
        run: |
          get_image() { kubectl get ksvc "$1" -n "$2" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo ""; }
          echo "web_image=$(get_image studio ${{ env.NS_SYSTEM }})" >> $GITHUB_OUTPUT
          echo "api_image=$(get_image api ${{ env.NS_SYSTEM }})" >> $GITHUB_OUTPUT
          echo "docs_image=$(get_image docs ${{ env.NS_SYSTEM }})" >> $GITHUB_OUTPUT

      # Promote mode: every service gets the release tag, and the runtime only
      # re-rolls when its digest differs from what THIS cluster pins (see the
      # script header). Must run before "Apply Kubernetes manifests" resets
      # the ksvc images to :production-latest.
      - name: Resolve release images
        id: release
        env:
          OCIR_REGISTRY: ${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_TENANCY_NAMESPACE }}
          PROMOTE: ${{ needs.detect-changes.outputs.promote }}
          API_CHANGED: ${{ needs.detect-changes.outputs.api_changed }}
          WEB_CHANGED: ${{ needs.detect-changes.outputs.web_changed }}
          DOCS_CHANGED: ${{ needs.detect-changes.outputs.docs_changed }}
          RUNTIME_CHANGED: ${{ needs.detect-changes.outputs.runtime_changed }}
          PREV_WEB_IMAGE: ${{ steps.save-images.outputs.web_image }}
          PREV_API_IMAGE: ${{ steps.save-images.outputs.api_image }}
          PREV_DOCS_IMAGE: ${{ steps.save-images.outputs.docs_image }}
          REGISTRY_USERNAME: ${{ vars.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.OCI_AUTH_TOKEN }}
        run: .github/scripts/resolve-release-images.sh

      # Pre-rollout gate (2026-06-02 EU incident class): refuse to apply
      # manifests / patch ksvcs into a disk-starved cluster. A node above the
      # disk threshold (or already under DiskPressure) cannot bring up a new
      # revision — the kubelet evicts/GCs instead — so the rollout would only
      # fail 10 minutes later with ProgressDeadlineExceeded. Fail fast with an
      # actionable message instead.
      - name: Check node disk headroom (pre-rollout gate)
        run: .github/scripts/check-node-disk-headroom.sh 80

      # pgvector must exist before any migration runs: migrations run as
      # `shogo`, which can't create untrusted extensions, and
      # `Apply Kubernetes manifests` can start the new api image (mutable
      # `:<env>-latest` tag) before `Run Prisma migrations`. See
      # k8s/cnpg/ensure-extensions.sql.
      - name: Ensure Postgres extensions
        if: needs.detect-changes.outputs.api_changed == 'true'
        run: |
          set -euo pipefail
          PRIMARY=$(kubectl get pods -n ${{ env.NS_SYSTEM }} \
            -l "cnpg.io/cluster=platform-pg,cnpg.io/instanceRole=primary" \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$PRIMARY" ]; then
            echo "::error::No primary pod found for platform-pg cluster in ${{ env.NS_SYSTEM }}"
            exit 1
          fi
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -v ON_ERROR_STOP=1 < k8s/cnpg/ensure-extensions.sql \
            || { echo "::error::Could not install Postgres extensions on EU"; exit 1; }

      - name: Apply Kubernetes manifests
        run: |
          # Render RUNTIME_IMAGE into the api ksvc at apply time, mirroring the
          # image-prepuller's RUNTIME_IMAGE_PLACEHOLDER substitution. The
          # overlay ships the placeholder token, never a real (or
          # `:<env>-bootstrap`) value, so `kubectl apply` itself can never stamp
          # a non-existent runtime image onto the api ksvc and then rely on a
          # later imperative patch to undo it. That undo-gap bricked India on
          # 2026-05-27 when a mid-deploy abort left the placeholder live. The
          # immutable :<env>-<sha> tag comes from "Resolve release images";
          # apply-release-images.sh re-verifies it downstream as
          # defense-in-depth.
          # The studio image is environment-agnostic; production overlays
          # also carry release-version / GA4 / Facebook Pixel placeholders
          # (staging has none).
          export RUNTIME_IMAGE="${{ steps.release.outputs.runtime_image }}"
          export APP_VERSION="${{ needs.resolve-config.outputs.app_version }}"
          export GA4_MEASUREMENT_ID="${{ secrets.GA4_MEASUREMENT_ID }}"
          export FB_PIXEL_ID="${{ secrets.FB_PIXEL_ID }}"
          echo "Rendering manifests with RUNTIME_IMAGE=${RUNTIME_IMAGE}"
          .github/scripts/render-overlay.sh "${{ env.ENVIRONMENT }}" > /tmp/manifests.yaml
          kubectl apply -f /tmp/manifests.yaml
          # Node-level inotify quota bump — DaemonSet lives in kube-system,
          # outside the kustomize overlay (kustomize blocks reaching into
          # ../../base/ from an overlay). See k8s/base/inotify-tuner.yaml
          # for context.
          kubectl apply -f k8s/base/inotify-tuner.yaml

      - name: Ensure Kourier TLS configuration
        run: |
          kubectl set env deployment/net-kourier-controller -n knative-serving \
            CERTS_SECRET_NAMESPACE=kourier-system \
            CERTS_SECRET_NAME=kourier-tls || true

      - name: Ensure Kourier connection draining and stream timeouts
        run: |
          kubectl patch configmap config-kourier -n knative-serving --type merge \
            -p '{"data":{"drain-time-seconds":"15","stream-idle-timeout":"0s"}}' || true

      - name: Ensure Knative max revision timeout for long-running agent turns
        run: |
          kubectl patch configmap config-defaults -n knative-serving --type merge \
            -p '{"data":{"max-revision-timeout-seconds":"3600","revision-idle-timeout-seconds":"0"}}' || true

      # Durable guardrail (run 26873062665, 2026-06-03): bound runtime-image
      # accumulation on nodes. Each deploy pulls a new ~8 GB runtime image;
      # with retain-since-create-time at the old 48h default, every superseded
      # revision kept its image referenced (un-reclaimable by the kubelet) for
      # two days. Stacked images pushed India's nodes past the kubelet
      # DiskPressure threshold and aborted the deploy at the pre-rollout disk
      # gate. Enforcing tightened GC on EVERY deploy (instead of the previous
      # apply-once / manual k8s/knative/config-gc.yaml, which silently drifts)
      # lets the kubelet reclaim unreferenced images within hours. Keep these
      # values in sync with k8s/knative/config-gc.yaml.
      - name: Ensure Knative revision GC bounds runtime-image accumulation
        run: |
          kubectl patch configmap config-gc -n knative-serving --type merge \
            -p '{"data":{"max-non-active-revisions":"2","retain-since-create-time":"6h","retain-since-last-active-time":"30m","min-non-active-revisions":"1"}}' || true

      # Knative docs: when raising max-revision-timeout-seconds, the
      # activator's terminationGracePeriodSeconds should be at least as
      # long, so in-flight requests aren't disrupted on activator drain.
      - name: Ensure Knative activator drain window matches max revision timeout
        run: |
          kubectl patch deployment activator -n knative-serving --type merge \
            -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":3600}}}}' || true

      - name: Ensure OCI LB idle timeout for SSE streaming
        run: |
          kubectl annotate svc kourier -n kourier-system \
            service.beta.kubernetes.io/oci-load-balancer-connection-idle-timeout="1800" \
            --overwrite || true

      - name: Ensure docs DomainMapping
        if: env.DOCS_DOMAIN != ''
        run: |
          kubectl apply -f - <<EOF || true
          apiVersion: serving.knative.dev/v1beta1
          kind: DomainMapping
          metadata:
            name: ${{ env.DOCS_DOMAIN }}
            namespace: ${{ env.NS_SYSTEM }}
          spec:
            ref:
              name: docs
              kind: Service
              apiVersion: serving.knative.dev/v1
          EOF

      # ----------------------------------------------------------------------
      # Table-ownership contract — MUST run before migrations. `shogo` (the
      # migration role) must own every table in `public`, or an ALTER TABLE
      # in a migration fails with `must be owner` (SQLSTATE 42501) and wedges
      # the cluster with P3009 (2026-05-31 incident: affiliate_commission_tiers
      # + 9 siblings were postgres-owned on EU/India). enforce-table-ownership.sql
      # sweeps any drifted owner back to shogo and installs an event trigger
      # that keeps future CREATE TABLEs shogo-owned. This is located before the
      # migration gate because the migration itself needs the ownership; the
      # post-migration GRANT block below re-locates the primary in case a
      # failover happened during a long cold-image-pull migration.
      # ----------------------------------------------------------------------
      - name: Locate CNPG primary pod (pre-migration)
        run: |
          set -euo pipefail
          PRIMARY=$(kubectl get pods -n ${{ env.NS_SYSTEM }} \
            -l "cnpg.io/cluster=platform-pg,cnpg.io/instanceRole=primary" \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$PRIMARY" ]; then
            echo "::error::No primary pod found for platform-pg cluster in ${{ env.NS_SYSTEM }}"
            exit 1
          fi
          echo "Located primary on EU: $PRIMARY"
          echo "PG_PRIMARY=$PRIMARY" >> "$GITHUB_ENV"

      - name: Reconcile table ownership
        run: |
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo < k8s/cnpg/logical-replication/enforce-table-ownership.sql \
            || { echo "::error::table-ownership reconciliation failed on EU"; exit 1; }

      - name: Verify ownership contract
        run: |
          set -euo pipefail
          DRIFTED=$(kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -tAc "
              SELECT count(*)
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind IN ('r','p')
                AND c.relowner <> 'shogo'::regrole;
            ")
          if [ "$DRIFTED" != "0" ]; then
            echo "::error::$DRIFTED tables in public are not owned by shogo on EU"
            kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
              psql -U postgres -d shogo -c "
                SELECT n.nspname || '.' || c.relname AS drifted_table, c.relowner::regrole AS owner
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relkind IN ('r','p')
                  AND c.relowner <> 'shogo'::regrole;
              "
            exit 1
          fi
          echo "✓ shogo owns every table in public on EU"

      - name: Run Prisma migrations
        if: needs.detect-changes.outputs.api_changed == 'true'
        # Failure here is fatal. Until 2026-05-26 this used
        # `|| echo "::warning::..."` and EU/India migration P3009s
        # silently passed the deploy while the api ksvcs crashlooped on
        # stale revisions. The 2026-05-26 incident was caused by exactly
        # this swallowed error: a replicated `_prisma_migrations` row from
        # US poisoned EU/India's local Prisma state and `migrate deploy`
        # bailed with P3009 — a fatal exit code that the workflow ignored.
        # The publication-side fix is in `skip-replicated-migrations.sql`,
        # but the deploy must also stop pretending failures are warnings.
        #
        # Runs as a Job that waits for completion (see the script header).
        # The old `kubectl run -i` form failed both secondary regions on
        # 2026-05-30: its 60s --pod-running-timeout expired during the
        # cold pull of the api image onto a fresh node and aborted the
        # deploy mid-flight, before RUNTIME_IMAGE was synced onto the api
        # ksvc.
        run: |
          .github/scripts/run-prisma-migrations.sh \
            "${{ env.NS_SYSTEM }}" \
            "${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_TENANCY_NAMESPACE }}/shogo/shogo-api:${{ env.IMAGE_TAG }}"

      - name: Verify configured node pool matches running nodes
        run: |
          NODE_POOL_OCID="${{ vars.NODE_POOL_OCID }}"
          if [ -z "$NODE_POOL_OCID" ]; then echo "NODE_POOL_OCID not set, skipping"; exit 0; fi
          POOL_HASH=$(echo "$NODE_POOL_OCID" | rev | cut -c1-11 | rev)
          NODE_NAMES=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.labels.displayName}{"\n"}{end}' 2>/dev/null || true)
          if [ -z "$NODE_NAMES" ]; then echo "::warning::Could not list nodes for pool verification"; exit 0; fi
          if ! echo "$NODE_NAMES" | grep -q "$POOL_HASH"; then
            echo "::error::Configured NODE_POOL_OCID (.../${POOL_HASH}) does not match any running node displayName."
            echo "::error::Running nodes:"; echo "$NODE_NAMES" | sed 's/^/  /'
            echo "::error::Update the GitHub Actions variable NODE_POOL_OCID for environment ${{ env.ENVIRONMENT }}."
            exit 1
          fi
          echo "Node pool OCID matches running nodes (hash=$POOL_HASH)"

      # ----------------------------------------------------------------------
      # Logical replication: keep the cross-region publication in sync.
      # See the matching block in the deploy-us job for full rationale (#501).
      # On EU we refresh sub_from_us so any new tables added by this migration
      # on US become visible here without waiting for the hourly monitor.
      # ----------------------------------------------------------------------
      - name: Reconcile logical replication publication
        run: |
          kubectl apply -f k8s/cnpg/production-eu-oci/platform-publication.yaml

      # Primary-pod selector + GRANT reconcile + assertion: see the matching
      # block in the deploy-us job for the full rationale.
      - name: Locate CNPG primary pod
        run: |
          set -euo pipefail
          PRIMARY=$(kubectl get pods -n ${{ env.NS_SYSTEM }} \
            -l "cnpg.io/cluster=platform-pg,cnpg.io/instanceRole=primary" \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$PRIMARY" ]; then
            echo "::error::No primary pod found for platform-pg cluster in ${{ env.NS_SYSTEM }}"
            exit 1
          fi
          echo "Located primary on EU: $PRIMARY"
          echo "PG_PRIMARY=$PRIMARY" >> "$GITHUB_ENV"

      - name: Reconcile logical replication GRANTs
        run: |
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo < k8s/cnpg/logical-replication/grants.sql \
            || echo "::warning::GRANT reconciliation failed on EU (see logs above)"

      - name: Verify GRANT contract
        run: |
          set -euo pipefail
          MISSING=$(kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -tAc "
              SELECT count(*)
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'r'
                AND NOT has_table_privilege('logical_replicator', c.oid, 'SELECT');
            ")
          if [ "$MISSING" != "0" ]; then
            echo "::error::$MISSING tables in public still lack SELECT for logical_replicator on EU"
            kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
              psql -U postgres -d shogo -c "
                SELECT n.nspname || '.' || c.relname AS missing_table
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relkind = 'r'
                  AND NOT has_table_privilege('logical_replicator', c.oid, 'SELECT');
              "
            exit 1
          fi
          echo "✓ logical_replicator has SELECT on every public table on EU"

      # See deploy-us for full rationale (2026-05-26 incident).
      - name: Install _prisma_migrations REPLICA-trigger
        run: |
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo \
            < k8s/cnpg/logical-replication/skip-replicated-migrations.sql \
            || { echo "::error::skip-replicated-migrations.sql failed on EU"; exit 1; }

      - name: Verify _prisma_migrations REPLICA-trigger
        run: |
          set -euo pipefail
          STATE=$(kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -tAc "
              SELECT tgenabled
              FROM pg_trigger
              WHERE tgrelid='_prisma_migrations'::regclass
                AND tgname='skip_replicated_migrations_trg';
            ")
          if [ "$STATE" != "R" ]; then
            echo "::error::skip_replicated_migrations_trg on EU is in state '$STATE', expected 'R'"
            exit 1
          fi
          echo "✓ skip_replicated_migrations_trg is REPLICA-mode on EU"

      # Re-assert the region-local exclusion (see the US job for full rationale).
      - name: Re-assert region-local publication exclusion
        run: |
          kubectl exec -i -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -v ON_ERROR_STOP=1 \
            < k8s/cnpg/logical-replication/exclude-region-local-tables.sql \
            || { echo "::error::region-local publication exclusion failed on EU"; exit 1; }

      # ENABLE first: see the US job. This is the common case — US migrates
      # first, so its new columns reach EU before EU has run the migration.
      - name: Refresh logical replication subscriptions
        run: |
          for SUB in sub_from_us; do
            echo "Refreshing $SUB on EU..."
            kubectl exec -n ${{ env.NS_SYSTEM }} "$PG_PRIMARY" -c postgres -- \
              psql -U postgres -d shogo -v ON_ERROR_STOP=1 \
                -c "ALTER SUBSCRIPTION ${SUB} ENABLE;" \
                -c "ALTER SUBSCRIPTION ${SUB} REFRESH PUBLICATION;" \
              || echo "::warning::REFRESH PUBLICATION failed for ${SUB} on EU (subscription may not exist yet)"
          done

      # Tables this deploy created are now published on EU, but the US
      # subscription only learns about them on a REFRESH. It must not copy
      # data: EU's initial copy above already pulled US's rows, so a US copy
      # would bring them straight back and fail on the primary key, disabling
      # sub_from_eu (the 2026-09-29 incident). It must also run before the EU
      # api rollout below, while the new tables hold no EU-written rows.
      # Non-blocking: a failure leaves sub_from_eu trailing the publication,
      # which the replication-monitor staleness check pages on.
      # deploy-us's oci_region / ns_system outputs contain "-", which a
      # secret's value matches, so Actions drops them ("Skip output ... may
      # contain secret"). Derive the region from the cluster OCID's region key
      # instead; the system namespace has the same name in both regions.
      - name: Refresh US subscription for tables published on EU
        continue-on-error: true
        env:
          US_CLUSTER_OCID: ${{ needs.deploy-us.outputs.oke_cluster_ocid }}
        run: |
          set -euo pipefail
          US_REGION_KEY=$(echo "$US_CLUSTER_OCID" | cut -d. -f4 | tr '[:lower:]' '[:upper:]')
          US_REGION=$(oci iam region list --query "data[?key=='${US_REGION_KEY}'].name | [0]" --raw-output)
          if [ -z "$US_REGION" ] || [ "$US_REGION" = "null" ]; then
            echo "::error::Could not resolve the US region from cluster OCID region key '${US_REGION_KEY}'"
            exit 1
          fi
          US_NS_SYSTEM="$NS_SYSTEM"
          US_KUBECONFIG="$RUNNER_TEMP/us-kubeconfig"
          oci ce cluster create-kubeconfig \
            --cluster-id "$US_CLUSTER_OCID" \
            --region "$US_REGION" \
            --file "$US_KUBECONFIG" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          US_PRIMARY=$(kubectl --kubeconfig "$US_KUBECONFIG" get pods -n "$US_NS_SYSTEM" \
            -l "cnpg.io/cluster=platform-pg,cnpg.io/instanceRole=primary" \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$US_PRIMARY" ]; then
            echo "::error::No primary pod found for platform-pg on US"
            exit 1
          fi
          kubectl --kubeconfig "$US_KUBECONFIG" exec -n "$US_NS_SYSTEM" "$US_PRIMARY" -c postgres -- \
            psql -U postgres -d shogo -v ON_ERROR_STOP=1 \
              -c "ALTER SUBSCRIPTION sub_from_eu ENABLE;" \
              -c "ALTER SUBSCRIPTION sub_from_eu REFRESH PUBLICATION WITH (copy_data = false);" \
            || { echo "::error::REFRESH PUBLICATION failed for sub_from_eu on US; EU writes to new tables will not reach US until it succeeds"; exit 1; }

      - name: Deploy Cluster Autoscaler
        run: |
          NODE_POOL_OCID="${{ vars.NODE_POOL_OCID }}"
          if [ -z "$NODE_POOL_OCID" ]; then echo "Skipping autoscaler"; exit 0; fi
          # Standing-headroom floor (run 26865807851, 2026-06-02): keep MIN
          # warm (already-prepulled) nodes at idle so a rollout's `min-scale`
          # api/warm-pool pods always land on a warm node instead of forcing
          # the autoscaler to provision a COLD one mid-deploy. Defaults keep
          # MIN>=2 so a missing var can never regress to the old scale-to-1
          # behavior. Keep vars.NODE_POOL_MIN/MAX in sync with terraform
          # system_pool_min/system_pool_max.
          NODE_POOL_MIN="${{ vars.NODE_POOL_MIN || '2' }}"
          NODE_POOL_MAX="${{ vars.NODE_POOL_MAX || '10' }}"
          sed -e "s|NODE_POOL_MIN_PLACEHOLDER|$NODE_POOL_MIN|g" \
              -e "s|NODE_POOL_MAX_PLACEHOLDER|$NODE_POOL_MAX|g" \
              -e "s|NODE_POOL_OCID_PLACEHOLDER|$NODE_POOL_OCID|g" \
              k8s/base/cluster-autoscaler.yaml | kubectl apply -f -
          kubectl rollout restart deployment/cluster-autoscaler -n kube-system || true
          kubectl rollout status deployment/cluster-autoscaler -n kube-system --timeout=180s || true

      # Continuous warm-pool health monitor: a 5-minute CronJob that fails
      # the K8s job (and pages via the existing kube_job_status_failed
      # alert) on any of the 2026-05-27 incident classes — placeholder env
      # leak on api ksvc, ImagePullBackOff/CrashLoopBackOff on a warm-pool
      # pod, or zero-Ready warm-pool ksvcs. See k8s/base/warm-pool-monitor.yaml.
      - name: Deploy warm-pool monitor
        run: |
          sed -e "s|namespace: shogo-staging-system|namespace: ${{ env.NS_SYSTEM }}|g" \
              -e "s|value: shogo-staging-system|value: ${{ env.NS_SYSTEM }}|g" \
              -e "s|value: shogo-staging-workspaces|value: ${{ env.NS_WORKSPACES }}|g" \
              k8s/base/warm-pool-monitor.yaml | kubectl apply -f -

      # Shared with deploy-staging.yml and rollback-production.yml: pin the runtime
      # image, block on the prepull gate (run 26865807851, 2026-06-02), patch
      # the ksvcs, retire stale studio revisions (2026-07-18 EU CSS-404), and
      # re-pin + verify RUNTIME_IMAGE on the api ksvc (2026-05-27 502s).
      - name: Apply release images
        env:
          RUNTIME_TAG: ${{ steps.release.outputs.runtime_tag }}
          RUNTIME_IMAGE: ${{ steps.release.outputs.runtime_image }}
          API_IMAGE: ${{ steps.release.outputs.api_image }}
          WEB_IMAGE: ${{ steps.release.outputs.web_image }}
          DOCS_IMAGE: ${{ steps.release.outputs.docs_image }}
          RETIRE_STALE_STUDIO: ${{ steps.release.outputs.web_changed }}
        run: .github/scripts/apply-release-images.sh

      - name: Wait for rollout and health check
        run: |
          # See the staging block for the rationale behind this gate.
          wait_ksvc_ready() {
            local name=$1 ns=$2 timeout_sec=${3:-600}
            local target_gen lcre lread obs ready elapsed=0
            target_gen=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.metadata.generation}')
            echo "Waiting for ksvc/$name (gen=$target_gen) to roll out..."
            while [ "$elapsed" -lt "$timeout_sec" ]; do
              obs=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.status.observedGeneration}' 2>/dev/null || echo 0)
              ready=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
              lcre=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.status.latestCreatedRevisionName}' 2>/dev/null || true)
              lread=$(kubectl get ksvc "$name" -n "$ns" -o jsonpath='{.status.latestReadyRevisionName}' 2>/dev/null || true)
              if [ "$obs" = "$target_gen" ] && [ "$ready" = "True" ] && [ -n "$lcre" ] && [ "$lcre" = "$lread" ]; then
                echo "ksvc/$name rolled out to $lcre"
                return 0
              fi
              sleep 10
              elapsed=$((elapsed + 10))
            done
            echo "::error::ksvc/$name did not reach Ready within ${timeout_sec}s (gen=$target_gen obs=$obs ready=$ready latestCreated=$lcre latestReady=$lread)"
            echo "::group::revision describe"
            kubectl describe revision "$lcre" -n "$ns" || true
            echo "::endgroup::"
            echo "::group::revision logs"
            kubectl logs --tail=200 -l "serving.knative.dev/revision=$lcre" -n "$ns" --all-containers || true
            echo "::endgroup::"
            return 1
          }
          for s in api studio; do
            wait_ksvc_ready "$s" "${{ env.NS_SYSTEM }}" 600
          done

          sleep 15
          KOURIER_IP=$(kubectl get svc kourier -n kourier-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -z "$KOURIER_IP" ]; then
            echo "::error::Kourier LoadBalancer IP not assigned; cannot reach EU ingress"
            exit 1
          fi
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 15 -H "Host: ${{ env.DOMAIN }}" "http://${KOURIER_IP}/api/health" 2>/dev/null) || STATUS="000"
          echo "EU health: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::EU /api/health returned HTTP $STATUS (expected 200) via Kourier ${KOURIER_IP}"
            exit 1
          fi

      # (removed) Knative warm-pool health gate — vestigial under metal-only
      # prod (see staging block). Metal is authoritative for project runtimes;
      # the Knative project/warm-pool ksvcs churn and were failing the deploy
      # while the api ksvc itself rolled out healthy. Tier 4 (revision GC) below
      # is still relevant.
      - name: Garbage-collect old api revisions
        run: |
          .github/scripts/gc-old-api-revisions.sh "${{ env.NS_SYSTEM }}"

      - name: Summary
        run: |
          echo "## EU Production Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Role: active-active" >> $GITHUB_STEP_SUMMARY

  # The rootfs gate below needs to know which guest revision every host runs,
  # and each production region is its own control plane whose URL and token live
  # in its own GitHub environment. A job can only be in one environment, so the
  # EU fleet is read here and handed over as an output; the gate job reads the
  # US fleet itself. Never fails: an unreadable fleet makes the gate rebuild.
  metal-fleet-eu:
    name: Read EU metal fleet revisions
    runs-on: ubuntu-latest
    needs: [resolve-config, deploy-us, deploy-eu]
    if: |
      always() &&
      needs.resolve-config.outputs.is_production == 'true' &&
      needs.deploy-us.result == 'success' &&
      needs.deploy-eu.result == 'success'
    environment: production-eu
    outputs:
      fleet: ${{ steps.fetch.outputs.fleet }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci/metal-rootfs-gate.sh
          sparse-checkout-cone-mode: false

      - name: GET /api/internal/metal/fleet
        id: fetch
        env:
          METAL_REGISTER_TOKEN: ${{ secrets.METAL_REGISTER_TOKEN }}
          INSECURE_TLS: ${{ vars.METAL_RELEASE_INSECURE_TLS }}
          CP_URL: ${{ vars.METAL_CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          FLEET=$(bash scripts/ci/metal-rootfs-gate.sh fetch production-eu "$CP_URL")
          echo "$FLEET" | jq .
          echo "fleet=$FLEET" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Give the release a production metal runtime image, when the fleet needs one.
  #
  # The bare-metal Firecracker fleet runs the guest (in-VM) code from a separate
  # multi-arch runtime image (runtime-multiarch.yml), NOT from the arm64 image
  # this pipeline ships to OKE. A prod tag that didn't refresh it left the metal
  # guest code frozen at whatever image someone last hand-built (2026-07
  # incident: fixes were tagged but the fleet rootfs was never rebuilt).
  #
  # Ask the rootfs gate first. When the fleet needs new guest code, promote the
  # staging multi-arch image whose runtime chain matches this commit (seconds,
  # and the bytes staging's metal hosts already run); only when none exists is
  # the production image rebuilt from this ref (up to ~90 min). Best-effort:
  # never blocks the API release.
  # ---------------------------------------------------------------------------
  metal-runtime-image:
    name: Prod metal runtime image
    runs-on: ubuntu-latest
    needs: [resolve-config, deploy-us, deploy-eu, metal-fleet-eu]
    # metal-fleet-eu is deliberately not required to succeed: a missing EU
    # fleet reading only makes the gate rebuild.
    if: |
      always() &&
      needs.resolve-config.outputs.is_production == 'true' &&
      needs.deploy-us.result == 'success' &&
      needs.deploy-eu.result == 'success'
    # For the US control plane's URL and token (the gate) and OCIR credentials.
    environment: production-us
    permissions:
      contents: read
      actions: write
    outputs:
      rebuild: ${{ steps.gate.outputs.rebuild }}
      source: ${{ steps.image.outputs.source }}
      image: ${{ steps.image.outputs.image }}
    steps:
      # Full history: the gate diffs this commit against whatever revision the
      # fleet runs, which can be many releases back.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Rebuilding the golden rootfs re-stamps its identity, which invalidates
      # EVERY snapshot on every host (2026-08-09: ~6,500 snapshots and a day of
      # 524s), so rebuild only when the guest image the fleet actually runs is
      # behind this commit. See scripts/ci/metal-rootfs-gate.sh.
      - name: Decide whether the fleet needs a rootfs rebuild
        id: gate
        env:
          SHA: ${{ github.sha }}
          METAL_REGISTER_TOKEN: ${{ secrets.METAL_REGISTER_TOKEN }}
          INSECURE_TLS: ${{ vars.METAL_RELEASE_INSECURE_TLS }}
          CP_URL: ${{ vars.METAL_CONTROL_PLANE_URL }}
          EU_FLEET: ${{ needs.metal-fleet-eu.outputs.fleet }}
        run: |
          set -euo pipefail
          bash scripts/ci/metal-rootfs-gate.sh fetch production-us "$CP_URL" > /tmp/fleet-us.json
          printf '%s' "$EU_FLEET" > /tmp/fleet-eu.json
          bash scripts/ci/metal-rootfs-gate.sh decide "$SHA" /tmp/fleet-us.json /tmp/fleet-eu.json | tee -a "$GITHUB_OUTPUT"

      - name: Promote the staging multi-arch image (or fall back to building)
        id: image
        if: steps.gate.outputs.rebuild == 'true'
        env:
          SHA: ${{ github.sha }}
          REGISTRY: ${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_TENANCY_NAMESPACE }}
          FORCE_BUILD: ${{ github.event.inputs.force_rebuild_production || 'false' }}
          OCI_NS: ${{ vars.OCI_TENANCY_NAMESPACE }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          echo "$OCI_AUTH_TOKEN" | docker login "${REGISTRY%%/*}" -u "$OCI_NS/$OCI_USERNAME" --password-stdin >/dev/null
          bash .github/scripts/promote-metal-runtime-image.sh

      - name: Dispatch runtime-multiarch (production) from this ref
        if: steps.image.outputs.source == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "::notice::Dispatching runtime-multiarch (environment=production) @ $REF"
          # converge_fleet=false: dispatch-metal-agent-release (below) rolls the
          # fleet itself, after the image exists. Letting runtime-multiarch also
          # converge would publish two rebuildRootfs releases per region for one
          # tag.
          gh workflow run runtime-multiarch.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref "$REF" \
            -f environment=production \
            -f converge_fleet=false

  # ===========================================================================
  # Stage 8: Metal node-agent release (fold the bare-metal fleet into the tag
  # cycle). The metal fleet deploys PULL-based via metal-agent-deploy.yml; on a
  # `v*` tag we publish the `stable` channel to BOTH production control planes so
  # a release reaches the Firecracker hosts too — it is no longer a separate
  # manual dispatch. metal-runtime-image handles the guest runtime image; this
  # handles the host agent bundle + golden-rootfs rebuild. Hosts converge on
  # their next heartbeat (apps/api metal-agent-release).
  # ===========================================================================
  dispatch-metal-agent-release:
    name: Publish prod metal-agent release (stable)
    runs-on: ubuntu-latest
    needs: [resolve-config, deploy-us, deploy-eu, metal-runtime-image]
    # Production tag only, and only once both regional control-plane deploys AND
    # the runtime-image step succeeded (we may ask hosts to rebuild their rootfs
    # from that image).
    if: |
      always() &&
      needs.resolve-config.outputs.is_production == 'true' &&
      needs.deploy-us.result == 'success' &&
      needs.deploy-eu.result == 'success' &&
      needs.metal-runtime-image.result == 'success'
    # For OCIR credentials (the image wait).
    environment: production-us
    permissions:
      contents: read
      actions: write
    steps:
      - name: Wait for the prod runtime image, then publish stable to both regions
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          REBUILD_ROOTFS: ${{ needs.metal-runtime-image.outputs.rebuild }}
          IMAGE: ${{ needs.metal-runtime-image.outputs.image }}
          REGISTRY: ${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_TENANCY_NAMESPACE }}
          OCI_NS: ${{ vars.OCI_TENANCY_NAMESPACE }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$REBUILD_ROOTFS" != "true" ]; then
            # No host will rebuild from a new image, so there is nothing to wait for.
            echo "::notice::No rootfs rebuild in this release"
          else
            [ -n "$IMAGE" ] || { echo "::error::metal-runtime-image produced no image"; exit 1; }
            # A fallback build was started fire-and-forget, and hosts must not be
            # told to rebuild before the image exists. Wait for the image itself
            # rather than a workflow run: polling runs by head_sha matched the
            # staging run on the same commit, already successful, in the seconds
            # before the production run registered. A promoted image is already
            # there.
            echo "::notice::Waiting for $IMAGE before publishing metal-agent stable"
            echo "$OCI_AUTH_TOKEN" | docker login "${REGISTRY%%/*}" -u "$OCI_NS/$OCI_USERNAME" --password-stdin >/dev/null
            deadline=$(( $(date +%s) + 3600 ))
            until docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; do
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "::error::Timed out waiting for $IMAGE — refusing to publish a rootfs-rebuild release."
                exit 1
              fi
              echo "  $IMAGE not published yet (waiting)"
              sleep 30
            done
            echo "$IMAGE is published — proceeding."
          fi

          # Each production region is a distinct control plane (separate DB), so
          # publish the pointer to both. The agent bundle ships either way; only
          # whether hosts also rebuild their rootfs from the new runtime image is
          # conditional (see metal-runtime-image). A rebuild is pinned to an
          # image tagged with the commit it was built from, which the hosts
          # verify against the revision stamped inside it before swapping it in.
          for TARGET in production-us production-eu; do
            echo "::notice::Publishing metal-agent stable (rebuildRootfs=$REBUILD_ROOTFS) to $TARGET @ $REF"
            args=(-f environment="$TARGET" -f channel=stable -f rebuild_rootfs="$REBUILD_ROOTFS")
            [ "$REBUILD_ROOTFS" = "true" ] && args+=(-f runtime_image="$IMAGE")
            gh workflow run metal-agent-deploy.yml \
              -R "$GITHUB_REPOSITORY" \
              --ref "$REF" \
              "${args[@]}"
          done
          echo "::notice::Metal-agent stable published to production-us + production-eu; hosts converge on next heartbeat."
