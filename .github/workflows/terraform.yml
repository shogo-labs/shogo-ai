# =============================================================================
# Shogo AI — Terraform (OCI)
# =============================================================================
# Plan and apply Terraform for the OCI environments:
#   staging | production-us | production-eu (+ edge-global, Cloudflare only)
#
# The default path for merged infra is "applied", not "forgotten" (SHO-515:
# #2145 sat merged-but-unapplied for a day, and the next plan that finally
# picked it up wanted to replace every published site's DNS, Worker route and
# PAR):
#
#   - pull_request  → fmt + unit test + validate EVERY env; full plan of
#                     staging posted on the PR, with a hard failure when any
#                     protected resource would be replaced.
#   - push to main  → apply staging automatically (no protection rules), then
#     touching      plan production-us and production-eu. Production APPLY is
#     terraform/**  still manual: those environments are branch-protected but
#                   carry no required reviewer, so an auto-apply would deploy
#                   to prod with nobody looking. See docs/runbooks/terraform.md.
#   - schedule      → daily plan of all three; fails when an environment has
#                     pending changes (drift alarm: merged infra not applied, or
#                     an out-of-band edit).
#   - workflow_dispatch → plan or apply any single env, gated by that env's
#                     GitHub Environment protection rules.
#
# NOTE: production plans cannot run on PR branches — production-us/eu's
# environment branch policy allows only `main`, `hotfix/*` and `v*`. That is
# why a PR validates prod and only plans staging.
#
# State backend: OCI Object Storage (S3-compat) bucket `shogo-tfstate` in
# us-ashburn-1, one key per env. Repo-level secrets `OCI_S3_ACCESS_KEY` /
# `OCI_S3_SECRET_KEY` provide credentials and `vars.OCI_S3_ENDPOINT` supplies
# the namespace endpoint (passed via -backend-config).
# =============================================================================

name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/terraform-plan.yml'
      - '.github/scripts/check-terraform-plan-protected.sh'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/terraform-plan.yml'
      - '.github/scripts/check-terraform-plan-protected.sh'
  schedule:
    # Daily drift alarm. Runs on the default branch, which the production
    # environments' branch policy allows.
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to operate on'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production-us
          - production-eu
          - edge-global
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      extra_args:
        description: 'Extra args appended to terraform plan/apply (e.g. -target=... for a surgical apply). Leave empty for a full plan/apply.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.5.7'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  # ---------------------------------------------------------------------------
  # PR checks — cheap, credential-light gates that run before the plan:
  # formatting, the releases-worker unit test, and cross-region node boot
  # volume parity.
  # ---------------------------------------------------------------------------
  pr-checks:
    if: github.event_name == 'pull_request'
    name: PR checks (fmt, unit test, disk parity)
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Unit test releases-worker.js.tftpl (releases.shogo.ai)
        # Renders the Worker to a temp .mjs and imports it — see the test file
        # for why it is not tested in place.
        run: bun test terraform/modules/install-shogo-ai/scripts/releases-worker.test.ts

      # The protected-replacement guard's SUCCESS path runs on every terraform
      # PR; its FAILING path only runs when a plan really does contain a
      # protected replacement, which is (by design) never. These fixtures pin
      # both directions so the guard cannot silently rot (SHO-515 QA round 1).
      - name: Unit test the protected-replacement guard
        run: bun test ./.github/scripts/check-terraform-plan-protected.test.ts

      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      # Cross-region node-pool boot-volume parity guard (2026-06-02 EU
      # incident): EU bootstrapped at 100 GB while US ran 200 GB, and the oke
      # module ignores in-place boot-volume changes, so the drift was invisible
      # to `terraform plan`. This asserts parity against the LIVE OCI pools.
      - name: Node disk parity check (cross-region boot volumes)
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_CLI_REGION: us-ashburn-1
          COMPARTMENT_ID: ${{ vars.COMPARTMENT_ID }}
          EXPECTED_GB: "200"
          REGIONS: "us-ashburn-1 eu-frankfurt-1"
        run: "$GITHUB_WORKSPACE/.github/scripts/check-node-disk-parity.sh"

  # ---------------------------------------------------------------------------
  # PR validate — `terraform validate` for EVERY environment, including the
  # production ones a PR cannot plan (branch policy). Catches the whole class of
  # "module input changed but a caller wasn't updated", which is what a
  # module-wide signature change is.
  # ---------------------------------------------------------------------------
  pr-validate:
    if: github.event_name == 'pull_request'
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production-us, production-eu]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      # A lock file written by `terraform init` on one developer's machine
      # records hashes for THAT platform only, and nothing fails until the
      # next push to main: production-us shipped 5 hashes (one darwin_arm64
      # each), so `init -lockfile=readonly` installed the linux_amd64 packages
      # and `terraform validate` then refused them — "the cached package ...
      # does not match any of the checksums recorded in the dependency lock
      # file" (SHO-521). The init above just resolved this env for the
      # runner's platform, so a lock file that is complete for linux_amd64 is
      # left byte-identical; anything init had to add means the committed lock
      # was locked on the wrong platforms.
      - name: Lock file is committed and complete for linux_amd64
        run: |
          if ! git ls-files --error-unmatch .terraform.lock.hcl >/dev/null 2>&1; then
            echo "::error file=terraform/environments/${{ matrix.environment }}/.terraform.lock.hcl::No committed .terraform.lock.hcl for '${{ matrix.environment }}'. Run: terraform providers lock -platform=linux_amd64 -platform=darwin_arm64 -platform=darwin_amd64"
            exit 1
          fi
          if ! git diff --exit-code -- .terraform.lock.hcl; then
            echo "::error file=terraform/environments/${{ matrix.environment }}/.terraform.lock.hcl::The committed lock file has no linux_amd64 provider hashes (terraform init had to add them). Run: terraform providers lock -platform=linux_amd64 -platform=darwin_arm64 -platform=darwin_amd64 and commit the result."
            exit 1
          fi

      - name: terraform validate
        run: terraform validate -no-color

  # ---------------------------------------------------------------------------
  # PR plan — full staging plan, posted on the PR, with the protected-resource
  # guard. Staging is the only env a PR may bind (see the header note).
  # ---------------------------------------------------------------------------
  pr-plan:
    if: github.event_name == 'pull_request'
    name: Plan (staging)
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: staging
      action: plan
      pr_number: ${{ github.event.number }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Push to main — staging is applied automatically. Its environment has no
  # protection rules, and staging is rebuildable: leaving merged infra unapplied
  # is the failure mode this card exists to kill.
  # ---------------------------------------------------------------------------
  main-apply-staging:
    if: github.event_name == 'push'
    name: Apply (staging)
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: staging
      action: apply
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Push to main — plan production-us and production-eu. Production APPLY stays
  # manual on purpose: the prod environments have a branch policy but NO
  # required reviewer, so queueing an apply here would deploy to production
  # without Russell ever seeing it. Run the manual dispatch below to apply.
  # ---------------------------------------------------------------------------
  main-plan-prod:
    needs: main-apply-staging
    if: github.event_name == 'push'
    name: Plan (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment: [production-us, production-eu]
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: ${{ matrix.environment }}
      action: plan
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Daily drift alarm — plan all three envs and fail when any has pending
  # changes. A red scheduled run means merged infra is sitting unapplied (or
  # somebody edited production out-of-band), so it surfaces through the existing
  # failing-workflow alerting.
  # ---------------------------------------------------------------------------
  drift:
    if: github.event_name == 'schedule'
    name: Drift (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production-us, production-eu]
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: ${{ matrix.environment }}
      action: plan
      fail_on_changes: true
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Manual plan/apply of any single env — the only path to a production apply.
  # The env's GitHub Environment protection rules apply to this job.
  # ---------------------------------------------------------------------------
  manual:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ inputs.action }} (${{ inputs.environment }})
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      extra_args: ${{ inputs.extra_args }}
    secrets: inherit
