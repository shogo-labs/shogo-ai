#
# Boots real Firecracker microVMs on a GitHub runner (KVM) and checks that a
# per-project machine size reaches the guest: standard → upgrade → downgrade.
# The staging spec e2e/staging/project-machine-size.test.ts covers the same
# flow through the UI on a real metal host after deploy; this one runs before
# merge.
name: Metal VM size

on:
  pull_request:
    paths:
      - 'apps/metal-agent/**'
      - 'scripts/ci/metal-vm-size-e2e.sh'
      - '.github/workflows/metal-vm-size.yml'
  push:
    branches: [main]
    paths:
      - 'apps/metal-agent/**'
      - 'scripts/ci/metal-vm-size-e2e.sh'
      - '.github/workflows/metal-vm-size.yml'
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metal-vm-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-size:
    name: Firecracker upgrade / downgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot standard, upgraded and downgraded VMs
        run: bash scripts/ci/metal-vm-size-e2e.sh
        env:
          METAL_WORK: ${{ runner.temp }}/fc-vm-size

      - name: Upload results and serial logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: metal-vm-size
          path: |
            ${{ runner.temp }}/fc-vm-size/e2e-vm-size-results.json
            ${{ runner.temp }}/fc-vm-size/run/*.serial
          if-no-files-found: ignore
