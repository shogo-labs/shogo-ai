# =============================================================================
# CI - Lint, Typecheck, and Test
# =============================================================================
# Runs on every pull request to main. No secrets required, safe for fork PRs.
#
# Split into two independent jobs (`typecheck`, `test`) that run in parallel
# on separate ubuntu-latest runners, plus a thin `ci` aggregator job that
# reports pass/fail under the ORIGINAL name "Lint, Typecheck, Test". Branch
# protection requires that exact context — the aggregator lets us parallelize
# the underlying work without touching the required-status-check config
# (which would otherwise block every other open PR against main until each
# one rebased onto the new job names).
#
# Each job still has its own checkout and filesystem. Dependency, workspace,
# and TypeScript caches remove the repeated work on warm main-derived caches;
# the test matrix keeps the remaining test work parallel without multiplying
# the slowest package into eight full setup-heavy jobs.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  # Also run on every push to main so a partial test refactor that slips
  # through (e.g. via a directly-merged feature branch with no PR CI
  # against the post-merge HEAD) shows up attributable to the offending
  # commit, instead of silently red-ing every downstream PR.
  push:
    branches: [main]
    tags: ['v*']
  # Required for the `main` merge queue: GitHub tests the queue's temporary
  # merge-group ref (the batch of queued PRs merged against latest `main`)
  # by re-running whichever workflows are triggered on `merge_group`, then
  # reads back the "Lint, Typecheck, Test" context from THIS run before
  # promoting the batch. Without this trigger, queued PRs would sit forever
  # waiting for a required check that never gets reported.
  merge_group:
    branches: [main]
    types: [checks_requested]
  # Re-running a past run replays that run's workflow definition, so a fix to
  # the job itself (a timeout, a step) cannot be verified by re-running the
  # build that motivated it. Manual dispatch gives a fresh run against the
  # current file without pushing a no-op commit to main.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Preserve cache-populating main runs; superseded PR and merge-group runs
  # are safe to cancel.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  typecheck:
    name: Typecheck & static checks
    # Set CI_LINUX_RUNNER=ubuntu-24.04-8core when an 8-vCPU larger runner is
    # provisioned. The fallback keeps this workflow valid for public repos
    # without larger-runner entitlement.
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ci-node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Restore prepared build artifacts
        id: workspace-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            apps/api/src/generated
            packages/*/dist
            templates/runtime-template/node_modules
            templates/runtime-template/dist
            packages/agent-runtime/templates/sales-bdr-pipeline/dist
          key: ci-prepared-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/sdk/examples/*/package.json', 'scripts/package.json', 'templates/runtime-template/package.json', 'prisma/schema*.prisma', 'packages/*/src/**', 'packages/*/tsup.config.*', 'packages/sdk/bin/**', 'templates/runtime-template/src/**', 'templates/runtime-template/vite.config.*', 'packages/agent-runtime/templates/sales-bdr-pipeline/src/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/.shogo/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/template.json', 'scripts/postinstall.ts', 'scripts/db-generate-all.ts', 'scripts/materialize-runtime-template.ts', 'packages/agent-runtime/scripts/build-template-dists.ts') }}

      - name: Restore TypeScript build info
        id: ts-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: '**/*.tsbuildinfo'
          key: tsbuild-typecheck-${{ hashFiles('bun.lock', 'tsconfig*.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/sdk/examples/*/tsconfig*.json', 'scripts/tsconfig*.json') }}
          restore-keys: tsbuild-typecheck-

      - name: Restore bun dependencies
        id: bun-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: bun-ci-${{ hashFiles('bun.lock') }}
          restore-keys: bun-ci-

      - name: Install dependencies
        # `bun install --frozen-lockfile` triggers `scripts/postinstall.ts`
        # which runs `db-generate-all.ts` to produce both the PG-backed
        # Prisma client (`apps/api/src/generated/prisma-pg`) and the
        # SQLite one (`apps/api/src/generated/prisma-sqlite`) and links
        # the default `prisma/` symlink to `prisma-pg`. Without this,
        # `@prisma/client` imports in apps/api fail to resolve under
        # typecheck and test.
        #
        # `GITHUB_TOKEN` is required so `@vscode/ripgrep`'s postinstall
        # (a transitive dep via packages/agent-runtime) authenticates its
        # `api.github.com/repos/microsoft/ripgrep-prebuilt` lookup. Without
        # it, GitHub-hosted runners share the 60/hr anon quota across ALL
        # repos and this 403s intermittently. Guarded by
        # `check:ci-bun-install-token`; see that script for the full
        # writeup and the other workflows with the same fix.
        #
        # Runs even on a node_modules cache hit: the cache holds only the root
        # node_modules, while Bun links each workspace package's own
        # `node_modules/.bin` (tsup, tsc, prisma, ...). Skipping install on a
        # hit leaves those missing and `build:packages` fails with exit 127.
        # With the root tree and Bun cache warm this is a fast relink.
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ci-node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Save bun dependency cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: bun-ci-${{ hashFiles('bun.lock') }}

      - name: Build workspace packages
        # Required before typecheck so cross-package imports of
        # `@shogo-ai/sdk`, `@shogo-ai/agent`, etc. resolve to compiled
        # `dist/` artifacts. Without this step, `packages/sdk` (which
        # re-exports from `@shogo-ai/agent`, `@shogo-ai/core`, etc.)
        # and downstream packages (`packages/shogo-worker`,
        # `packages/cli`) fail typecheck with TS2307 module-not-found.
        # The `paths` aliases in `tsconfig.base.json` only redirect a
        # subset of workspace packages to source; published-shape
        # imports still need `dist/`.
        if: steps.workspace-cache.outputs.cache-hit != 'true'
        run: bun run build:packages

      - name: Build runtime-template for prepared cache
        if: steps.workspace-cache.outputs.cache-hit != 'true'
        run: |
          bun run scripts/materialize-runtime-template.ts templates/runtime-template/package.json
          (cd templates/runtime-template && bun install && bun run build)
          git checkout -- templates/runtime-template/package.json templates/runtime-template/bun.lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build agent template for prepared cache
        if: steps.workspace-cache.outputs.cache-hit != 'true'
        run: bun run packages/agent-runtime/scripts/build-template-dists.ts sales-bdr-pipeline

      - name: Save prepared build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.workspace-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            apps/api/src/generated
            packages/*/dist
            templates/runtime-template/node_modules
            templates/runtime-template/dist
            packages/agent-runtime/templates/sales-bdr-pipeline/dist
          key: ci-prepared-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/sdk/examples/*/package.json', 'scripts/package.json', 'templates/runtime-template/package.json', 'prisma/schema*.prisma', 'packages/*/src/**', 'packages/*/tsup.config.*', 'packages/sdk/bin/**', 'templates/runtime-template/src/**', 'templates/runtime-template/vite.config.*', 'packages/agent-runtime/templates/sales-bdr-pipeline/src/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/.shogo/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/template.json', 'scripts/postinstall.ts', 'scripts/db-generate-all.ts', 'scripts/materialize-runtime-template.ts', 'packages/agent-runtime/scripts/build-template-dists.ts') }}

      - name: Typecheck
        env:
          TYPECHECK_SCOPE: required
          TYPECHECK_EXCLUDE: apps/mobile
        run: bun run typecheck

      - name: Save TypeScript build info
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: '**/*.tsbuildinfo'
          key: tsbuild-typecheck-${{ hashFiles('bun.lock', 'tsconfig*.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/sdk/examples/*/tsconfig*.json', 'scripts/tsconfig*.json') }}

      - name: Lint
        run: bun run lint

      - name: Check CI `bun install` steps authenticate ripgrep-prebuilt
        # Guards against the `@vscode/ripgrep` 403 flake — see
        # scripts/check-ci-bun-install-token.ts for the full writeup.
        # Runs before any `bun install` in THIS job could 403, but its
        # real job is catching a new/edited workflow elsewhere in the repo
        # that forgets the fix.
        run: bun run check:ci-bun-install-token

      - name: Verify SDK license isolation (no AGPL leak)
        # Fails if @shogo-ai/sdk (MIT) declares or imports any @shogo/*
        # AGPL workspace package from a published code path. See
        # packages/sdk/scripts/verify-license-isolation.mjs for details.
        run: bun run --filter @shogo-ai/sdk verify:license-isolation

      - name: Check replication publication is self-maintaining
        run: bun run check:publication

      - name: Check generated What's New catalog
        run: bun run check:whats-new

      - name: Check multi-region cron locks + unique-key classification
        # Guards against the 2026-05-21 analytics_digests poison-pill class
        # of failure: an in-process cron upserting on a non-PK unique index
        # in every API replica in every region, where logical replication's
        # `last_update_wins` cannot resolve the conflict and the apply
        # worker halts until manual intervention.
        #
        # The check has two halves:
        #   1. Every cron entry point in apps/api/src/jobs/ (and the two
        #      directly-invoked-from-server.ts ones — recalculateAllStorageUsage,
        #      generateDigest) must EITHER wrap its body in
        #      `withGlobalJobLock('<name>', ...)` AND register `<name>` in
        #      KNOWN_JOB_IDS in apps/api/src/lib/global-job-lock.ts, OR be
        #      listed in INTENTIONALLY_REGIONAL with a regionKeyColumn that
        #      the schema actually proves out.
        #   2. Every @unique / @@unique in prisma/schema.prisma must be
        #      classified in ACCEPTED_UNIQUE_KEYS with one of
        #      random_secret | external_global_id | request_scoped |
        #      single_tenant_upsert | cron_locked | cron_regional, plus a
        #      one-line justification.
        #
        # Both halves cross-reference: a cron_locked classification has to
        # point at a real KNOWN_JOB_IDS entry, a cron_regional at a real
        # INTENTIONALLY_REGIONAL entry, and stale allowlist entries fail
        # the check loudly so a model rename can't silently bypass the
        # guard. The friction is intentional — this is the human review
        # gate that would have caught the storage_usage shape at PR time.
        run: bun run check:multiregion

      - name: Replay desktop SQLite migrations against an empty DB
        # Guards against the "shipped a migration without its prerequisite"
        # failure mode — e.g. an ALTER TABLE whose CREATE TABLE was never
        # mirrored from prisma/migrations/ into apps/desktop/prisma/migrations/.
        # That bug class can't be caught by typecheck or test (which use a
        # fresh DB built from the current schema, not the migration history)
        # and silently bricks every customer's packaged desktop app on the
        # next launch with Prisma's P3009 "failed migration" lock.
        run: bun run check:migrations

      - name: Check desktop SQLite migrations match schema.local.prisma
        # Catches the OTHER half of the v1.7.8 bug class: schema.local.prisma
        # has a model (CreatorProfile, MarketplaceListing, ...) but the
        # migration tree never CREATE TABLEs it, so a follow-up ALTER lands
        # with no base — and the packaged desktop app silently exits on
        # first launch with `no such table: X` -> P3009 lock.
        #
        # This is the highest-leverage of our three migration checks. It
        # uses Prisma's own `migrate diff --from-migrations --to-schema`
        # (which already knows the full SQLite dialect, FK inlining,
        # partial-index translation, etc.) — no custom translator needed.
        # See scripts/check-desktop-schema-drift.ts for the allow-list
        # of pre-existing drift; the goal is to drain that to empty and
        # then add `--strict` here.
        run: bun run check:desktop-schema-drift

  typecheck-mobile:
    name: Typecheck (mobile)
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Restore node_modules
        id: mobile-node-modules-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ci-node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Restore prepared build artifacts
        id: workspace-mobile-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            apps/api/src/generated
            packages/*/dist
            templates/runtime-template/node_modules
            templates/runtime-template/dist
            packages/agent-runtime/templates/sales-bdr-pipeline/dist
          key: ci-prepared-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/sdk/examples/*/package.json', 'scripts/package.json', 'templates/runtime-template/package.json', 'prisma/schema*.prisma', 'packages/*/src/**', 'packages/*/tsup.config.*', 'packages/sdk/bin/**', 'templates/runtime-template/src/**', 'templates/runtime-template/vite.config.*', 'packages/agent-runtime/templates/sales-bdr-pipeline/src/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/.shogo/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/template.json', 'scripts/postinstall.ts', 'scripts/db-generate-all.ts', 'scripts/materialize-runtime-template.ts', 'packages/agent-runtime/scripts/build-template-dists.ts') }}

      - name: Restore TypeScript build info
        id: ts-mobile-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: '**/*.tsbuildinfo'
          key: tsbuild-mobile-${{ hashFiles('bun.lock', 'tsconfig*.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/sdk/examples/*/tsconfig*.json', 'scripts/tsconfig*.json') }}
          restore-keys: tsbuild-mobile-

      - name: Restore bun dependencies
        id: bun-mobile-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: bun-ci-${{ hashFiles('bun.lock') }}
          restore-keys: bun-ci-

      - name: Install dependencies
        # Runs even on a node_modules cache hit — see the `typecheck` job.
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mobile-node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ci-node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build workspace packages
        if: steps.workspace-mobile-cache.outputs.cache-hit != 'true'
        run: bun run build:packages

      - name: Typecheck mobile
        run: bun run --cwd apps/mobile typecheck

      - name: Save mobile TypeScript build info
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ts-mobile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: '**/*.tsbuildinfo'
          key: tsbuild-mobile-${{ hashFiles('bun.lock', 'tsconfig*.json', 'apps/*/tsconfig*.json', 'packages/*/tsconfig*.json', 'packages/sdk/examples/*/tsconfig*.json', 'scripts/tsconfig*.json') }}

  typecheck-known-failures:
    name: Typecheck (known failures, non-blocking)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Restore node_modules
        id: known-node-modules-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ci-node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Restore prepared build artifacts
        id: workspace-known-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            apps/api/src/generated
            packages/*/dist
            templates/runtime-template/node_modules
            templates/runtime-template/dist
            packages/agent-runtime/templates/sales-bdr-pipeline/dist
          key: ci-prepared-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/sdk/examples/*/package.json', 'scripts/package.json', 'templates/runtime-template/package.json', 'prisma/schema*.prisma', 'packages/*/src/**', 'packages/*/tsup.config.*', 'packages/sdk/bin/**', 'templates/runtime-template/src/**', 'templates/runtime-template/vite.config.*', 'packages/agent-runtime/templates/sales-bdr-pipeline/src/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/.shogo/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/template.json', 'scripts/postinstall.ts', 'scripts/db-generate-all.ts', 'scripts/materialize-runtime-template.ts', 'packages/agent-runtime/scripts/build-template-dists.ts') }}

      - name: Restore bun dependencies
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: bun-ci-${{ hashFiles('bun.lock') }}
          restore-keys: bun-ci-

      - name: Install dependencies
        # Runs even on a node_modules cache hit — see the `typecheck` job.
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.known-node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ci-node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build workspace packages
        if: steps.workspace-known-cache.outputs.cache-hit != 'true'
        run: bun run build:packages

      - name: Typecheck known failures
        env:
          TYPECHECK_SCOPE: expected-failures
        run: bun run typecheck

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      # Set CI_TEST_PACKAGE_CONCURRENCY=4 together with the 8-vCPU runner.
      # The safe default matches ubuntu-latest's four-vCPU runner.
      SHOGO_TEST_PACKAGE_CONCURRENCY: ${{ vars.CI_TEST_PACKAGE_CONCURRENCY || '2' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-runtime 1/2
            packages: packages/agent-runtime
            shard: 1/2
            build_templates: true
            desktop_bundle: false
            include_e2e: false
          - name: agent-runtime 2/2
            packages: packages/agent-runtime
            shard: 2/2
            build_templates: true
            desktop_bundle: false
            include_e2e: false
          - name: api + mobile
            packages: apps/api,apps/mobile
            shard: ''
            build_templates: false
            desktop_bundle: false
            include_e2e: false
          - name: remaining + e2e
            packages: packages/shared-runtime,packages/model-catalog,packages/sdk,scripts,packages/shared-app
            shard: ''
            build_templates: true
            desktop_bundle: true
            include_e2e: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Restore node_modules
        id: test-node-modules-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ci-node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Restore prepared build artifacts
        id: workspace-test-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            apps/api/src/generated
            packages/*/dist
            templates/runtime-template/node_modules
            templates/runtime-template/dist
            packages/agent-runtime/templates/sales-bdr-pipeline/dist
          key: ci-prepared-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/sdk/examples/*/package.json', 'scripts/package.json', 'templates/runtime-template/package.json', 'prisma/schema*.prisma', 'packages/*/src/**', 'packages/*/tsup.config.*', 'packages/sdk/bin/**', 'templates/runtime-template/src/**', 'templates/runtime-template/vite.config.*', 'packages/agent-runtime/templates/sales-bdr-pipeline/src/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/.shogo/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/template.json', 'scripts/postinstall.ts', 'scripts/db-generate-all.ts', 'scripts/materialize-runtime-template.ts', 'packages/agent-runtime/scripts/build-template-dists.ts') }}

      - name: Restore bun dependencies
        id: bun-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: bun-ci-${{ hashFiles('bun.lock') }}
          restore-keys: bun-ci-

      - name: Install dependencies
        # See the "Install dependencies" comment in the `typecheck` job —
        # identical rationale, duplicated here because each job gets its own
        # fresh runner filesystem. Runs even on a node_modules cache hit.
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.test-node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ci-node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build workspace packages
        # See the "Build workspace packages" comment in the `typecheck` job.
        # `bun run test` needs the same compiled `dist/` artifacts as
        # typecheck for the same cross-package import reasons.
        if: steps.workspace-test-cache.outputs.cache-hit != 'true'
        run: bun run build:packages

      - name: Build runtime-template (Vite dist for workspace-seeding tests)
        if: steps.workspace-test-cache.outputs.cache-hit != 'true' && matrix.build_templates
        # `templates/runtime-template/dist/` is gitignored — it's a Vite
        # build artifact. Several agent-runtime tests (notably
        # workspace-seeding.test.ts) assert that `seedRuntimeTemplate`
        # copies `dist/index.html` into a fresh workspace. Without the
        # build the tests see an empty source tree and fail. The
        # template has its own `bun install` because it's outside the
        # root workspaces glob.
        #
        # The template pins `@shogo-ai/sdk` as the `workspace:*` sentinel,
        # which can't resolve in this standalone install — materialize it to
        # the latest published `^X.Y.Z` first (GitHub runners have npm + net).
        # Plain `bun install` (not --frozen-lockfile): the rewrite makes the
        # template's checked-in bun.lock drift from its package.json.
        #
        # The rewrite is a BUILD-TIME transform, so undo it once dist/ exists.
        # Leaving it applied edits tracked files under the tests' feet: the
        # manifest no longer carries the `workspace:*` sentinel that
        # materialize-runtime-template.test.ts exists to guard, and every test
        # that copies the template (workspace-seeding, binary-ships-…) would
        # silently assert against a manifest that is not the one we ship.
        # node_modules/ and dist/ survive, so the later template-dist build is
        # unaffected.
        run: |
          bun run scripts/materialize-runtime-template.ts templates/runtime-template/package.json
          (cd templates/runtime-template && bun install && bun run build)
          git checkout -- templates/runtime-template/package.json templates/runtime-template/bun.lock
        # This `bun install` doesn't currently pull in @vscode/ripgrep (the
        # template's own package.json has no such dependency, direct or
        # transitive), but set GITHUB_TOKEN anyway for the same reason as
        # the "Install dependencies" step above — cheap insurance against
        # the 403 flake if that ever changes, and keeps
        # `check:ci-bun-install-token` happy without an allowlist.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build one agent template (sales-bdr-pipeline) for overlay tests
        if: steps.workspace-test-cache.outputs.cache-hit != 'true' && matrix.build_templates
        # `packages/agent-runtime/templates/<id>/dist/` is also gitignored.
        # workspace-seeding.test.ts > "overlays the template-shipped
        # pre-built dist over the runtime-template stub" depends on
        # `sales-bdr-pipeline`'s dist existing (it cps it onto the runtime
        # template stub and asserts the bundle text changes). The script
        # below stages the runtime-template + agent template src in a
        # tmpdir and runs vite build into the right output. We pass a
        # specific id so CI doesn't pay for all ~30 templates — that's
        # the build-templates.sh job in deploy.yml, which is too heavy
        # for PR CI.
        run: bun run packages/agent-runtime/scripts/build-template-dists.ts sales-bdr-pipeline

      - name: Desktop bundle + launcher assertions
        if: matrix.desktop_bundle
        # test-web-bundle.ts / test-sync-web.ts / test-forge-config.ts are
        # hand-rolled assertion scripts rather than `bun test` files, so
        # `bun run test` never picked them up and nothing ran them in CI —
        # they only fired if someone remembered `bun run test:desktop-bundle`
        # locally. That let the guards they encode rot silently: the
        # shogo://app/ routing + integrity logic that fixed Monaco's stuck
        # "Loading…", the sync-web.mjs contract that kept v1.8.12 from
        # shipping without Monaco at all, and the forge prePackage hooks.
        #
        # Runs the `:ci` subset, which drops test:shogo-ide-bundle — that one
        # shells out to sync-shogo-ide.mjs and requires
        # extensions/shogo-core/dist/extension.js, a gitignored build artifact
        # absent from a bare CI checkout. The other three are pure/tmpdir-only
        # and finish in well under a second.
        run: bun run --cwd apps/desktop test:desktop-bundle:ci

      - name: Test
        if: matrix.shard != ''
        run: bun run test -- --packages "${{ matrix.packages }}" --shard "${{ matrix.shard }}"

      - name: Test remaining packages and e2e
        if: matrix.include_e2e
        run: bun run test -- --packages "${{ matrix.packages }}" --include-e2e

      - name: Test unsharded packages
        if: matrix.shard == '' && matrix.include_e2e == false
        run: bun run test -- --packages "${{ matrix.packages }}"

  # Thin aggregator so branch protection's required status check keeps its
  # original name/context ("Lint, Typecheck, Test") no matter how the real
  # work above gets split or resharded. `if: always()` makes this run even
  # when a dependency fails (default behavior would skip it, and a skipped
  # required check blocks merges anyway — but an explicit failure is a much
  # clearer signal in the PR checks UI than "skipped").
  # Windows path-handling regression guard (SHOG-749).
  #
  # Until this job existed, EVERY job in this repo ran on ubuntu (44 of 50
  # `runs-on:` declarations) and the only `windows-2022` runner was the
  # desktop *packaging* workflow. That made `path.sep`-dependent logic
  # structurally untestable: `assertWithinWorkspace` had tests, they passed
  # on Linux because `sep === '/'`, and a one-character bug
  # (`root + '/'`) shipped anyway and broke read/write/edit_file for every
  # folder-linked Windows project.
  #
  # Deliberately scoped to the path-boundary suites rather than the whole
  # test suite: several unrelated suites still assert POSIX-shaped paths and
  # would keep this job permanently red, which guards nothing. Widen the
  # list as those are fixed.
  windows-changes:
    name: Detect Windows-sensitive changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Main pushes and manually dispatched runs should retain the full
          # platform guard. PR/merge-group runs can skip it when their diff
          # cannot affect Windows path behavior or the guard itself.
          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "merge_group" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "Unable to resolve the comparison SHAs; failing open."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq \
            '^(packages/agent-runtime/src/(path-boundary|permission-engine|runtime-trust|canvas-file-watcher|fs-tree-walker|workspace-file-routes|trust-resolver|workspace-runtime-mode|runtime-lsp-routes)\.ts$|packages/agent-runtime/src/__tests__/(path-boundary|permission-engine|runtime-trust|canvas-file-watcher|fs-tree-walker|workspace-file-routes|canvas-file-watcher-mounts|trust-resolver-workspace-mounts|runtime-lsp-routes-scope|workspace-runtime-mode)\.test\.ts$|apps/api/src/lib/runtime/|apps/api/src/__tests__/runtime-manager-startWorkspace\.test\.ts$|scripts/(run-tests-isolated|postinstall|db-generate-all|__tests__/desktop-next-beta-version\.test)\.ts$|\.github/workflows/ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  test-windows:
    name: Test (Windows path handling)
    needs: windows-changes
    if: needs.windows-changes.outputs.relevant == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      # No node_modules cache on Windows: installing over a restored tree fails
      # with EPERM inside node_modules/.bun during postinstall's prisma generate.
      # The Bun download cache below keeps the full install reasonably fast.
      - name: Restore prepared build artifacts
        id: workspace-windows-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            apps/api/src/generated
            packages/*/dist
            templates/runtime-template/node_modules
            templates/runtime-template/dist
            packages/agent-runtime/templates/sales-bdr-pipeline/dist
          key: ci-prepared-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/sdk/examples/*/package.json', 'scripts/package.json', 'templates/runtime-template/package.json', 'prisma/schema*.prisma', 'packages/*/src/**', 'packages/*/tsup.config.*', 'packages/sdk/bin/**', 'templates/runtime-template/src/**', 'templates/runtime-template/vite.config.*', 'packages/agent-runtime/templates/sales-bdr-pipeline/src/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/.shogo/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/template.json', 'scripts/postinstall.ts', 'scripts/db-generate-all.ts', 'scripts/materialize-runtime-template.ts', 'packages/agent-runtime/scripts/build-template-dists.ts') }}

      # Keep this cache for the platform-sensitive path. A cacheless
      # experiment remained in bun install for more than five minutes, while
      # the previous cached run completed installation in about four minutes.
      - name: Restore bun dependencies
        id: bun-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}\.bun-install-cache
          key: bun-ci-windows-v2-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        # Keep lifecycle scripts enabled: Bun 1.3.11 hit an ENOENT while
        # linking expo@54.0.33 on the Windows workspace when this job used
        # --ignore-scripts. The path gate above is the safe optimization for
        # PRs that cannot affect this platform-specific guard.
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}\.bun-install-cache

      - name: Save Windows bun dependency cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}\.bun-install-cache
          key: bun-ci-windows-v2-${{ hashFiles('bun.lock') }}

      - name: Build workspace packages
        # The API suites and the desktop-bundle build below resolve some
        # workspace packages (e.g. `@shogo-ai/sdk`) through their `dist/`.
        if: steps.workspace-windows-cache.outputs.cache-hit != 'true'
        run: bun run build:packages

      - name: Save Windows prepared build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.workspace-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            apps/api/src/generated
            packages/*/dist
            templates/runtime-template/node_modules
            templates/runtime-template/dist
            packages/agent-runtime/templates/sales-bdr-pipeline/dist
          key: ci-prepared-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/sdk/examples/*/package.json', 'scripts/package.json', 'templates/runtime-template/package.json', 'prisma/schema*.prisma', 'packages/*/src/**', 'packages/*/tsup.config.*', 'packages/sdk/bin/**', 'templates/runtime-template/src/**', 'templates/runtime-template/vite.config.*', 'packages/agent-runtime/templates/sales-bdr-pipeline/src/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/.shogo/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/template.json', 'scripts/postinstall.ts', 'scripts/db-generate-all.ts', 'scripts/materialize-runtime-template.ts', 'packages/agent-runtime/scripts/build-template-dists.ts') }}

      - name: Path-boundary, merged-root and release-version tests
        shell: bash
        # LINKED_FOLDERS / SHOGO_LOCAL_MODE are unset explicitly: when these
        # tests run under a Shogo agent the inherited values silently change
        # which branch of assertWithinWorkspace is taken.
        #
        # The merged-root suites create directory links the way the desktop
        # does (junctions on Windows, which need no elevation), so they run
        # for real here rather than skipping.
        env:
          LINKED_FOLDERS: ''
          SHOGO_LOCAL_MODE: ''
        run: |
          set -euo pipefail
          cd packages/agent-runtime
          bun --no-env-file test src/__tests__/path-boundary.test.ts src/__tests__/permission-engine.test.ts src/__tests__/runtime-trust.test.ts src/__tests__/canvas-file-watcher.test.ts src/__tests__/fs-tree-walker.test.ts src/__tests__/workspace-file-routes.test.ts src/__tests__/canvas-file-watcher-mounts.test.ts src/__tests__/trust-resolver-workspace-mounts.test.ts src/__tests__/runtime-lsp-routes-scope.test.ts src/__tests__/workspace-runtime-mode.test.ts
          cd ../..
          bun --no-env-file test scripts/__tests__/desktop-next-beta-version.test.ts
          # The Windows installer ships this bundle; build it on the platform that packages it.
          bun --no-env-file test apps/api/src/__tests__/runtime-manager-startWorkspace.test.ts apps/api/src/lib/runtime/__tests__/local-bundle-integrity.test.ts

  ci:
    name: Lint, Typecheck, Test
    needs: [windows-changes, typecheck, typecheck-mobile, test, test-windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check upstream job results
        run: |
          echo "windows-changes: ${{ needs.windows-changes.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "typecheck-mobile: ${{ needs.typecheck-mobile.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "test-windows: ${{ needs.test-windows.result }}"
          if [ "${{ needs.windows-changes.result }}" != "success" ] || [ "${{ needs.typecheck.result }}" != "success" ] || [ "${{ needs.typecheck-mobile.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || { [ "${{ needs.test-windows.result }}" != "success" ] && [ "${{ needs.test-windows.result }}" != "skipped" ]; }; then
            exit 1
          fi
