# =============================================================================
# Future clock — the unit suites, run as if today were +7 / +30 / +90 days
# =============================================================================
# SHO-505 (2026-11-18): `qa-sho424-vm-compute-billing.acceptance.test.ts` seeded
# rows dated 2026-11-18 and `reconcile()` compared them against `Date.now()`.
# It passed when it was written and turned every commit on `main` red about 72
# hours later — with no code change in between — and nothing could deploy.
#
# `main-health.yml` catches a bomb on the day it goes off. This job catches it
# *before* it does: the same suites, run against a clock shifted forward by 7,
# 30 and 90 days. A failure at +N is by definition a test that passes today and
# fails in N days, because `main` itself is green when this runs.
#
# How the clock moves:
#
#   1. **`scripts/test-clock-offset-preload.ts`** (preferred) — a `--preload` that
#      `run-tests-isolated.ts` hands to every `bun test` child. It shifts
#      `Date.now()` / argument-less `new Date()` in-process and is *pin-aware*, so
#      a test that calls `setSystemTime` still wins (a naive subclass reads
#      pin+offset and would report every well-behaved test as a bomb).
#      The filesystem keeps real time: an mtime stamped with raw `Date.now()`
#      reads back `offset` older than the shifted clock expects, so a sweep
#      that compares mtime against `Date.now()` fails here even though the
#      same fixture passes today. Fixtures that stamp mtimes must stamp them
#      on the shifted clock (`stampMtime` in
#      `packages/agent-runtime/src/__tests__/helpers/stamp-mtime.ts`).
#   2. **libfaketime** (`FAKETIME="+7d"`, `LD_PRELOAD`) — only when the preload
#      cannot shift the clock. It fakes `stat()` as well as `Date`, so an mtime a
#      fixture derived from the already-shifted `Date.now()` is offset a second
#      time on read: the first run of this job flagged 11 sweeper tests in
#      packages/agent-runtime at +7/+30/+90 that all pass under the preload. Treat
#      a red cell from this path as a hint, not proof.
#
# The step that picks a mechanism is also the guard: it fails the run if the
# clock did not actually move, so a green night never means "nothing ran".
#
# It is a signal, not a required check: no `pull_request` trigger, and it is not
# part of the "Lint, Typecheck, Test" aggregate. A red run opens one
# `future-clock-red` issue per offset+leg and comments on it while it stays red;
# a green run closes it.
# =============================================================================

name: Future clock

on:
  # After ci.yml's 03:17 nightly, so a bomb that went off overnight is already
  # attributable to a 03:17 run by the time this reports.
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # One offset run at a time: the point is a clean signal per night, and an
  # overlapping manual dispatch would double the runner minutes for nothing.
  group: future-clock
  cancel-in-progress: false

jobs:
  clock:
    name: Clock +${{ matrix.offset_days }}d (${{ matrix.leg.name }})
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      # For the `future-clock-red` issue this job opens/comments on/closes.
      issues: write
    timeout-minutes: 45
    env:
      SHOGO_TEST_PACKAGE_CONCURRENCY: ${{ vars.CI_TEST_PACKAGE_CONCURRENCY || '2' }}
      TEST_REDIS_URL: redis://127.0.0.1:6379
      CI_REQUIRE_REDIS: '1'
      OFFSET_DAYS: ${{ matrix.offset_days }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      # +7, +30 and +90 are three independent reports: keep going when one fails.
      fail-fast: false
      matrix:
        offset_days: [7, 30, 90]
        leg:
          - name: api + mobile
            packages: apps/api,apps/mobile
          - name: agent-runtime
            packages: packages/agent-runtime

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      # Same caches as ci.yml's `test` job, so a nightly offset run reuses the
      # main-scoped node_modules and prepared build artifacts instead of paying
      # for a cold install on every offset.
      - name: Restore node_modules
        id: clock-node-modules-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: node_modules
          key: ci-node-modules-${{ runner.os }}-bun${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

      - name: Restore prepared build artifacts
        id: workspace-clock-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            apps/api/src/generated
            packages/*/dist
            templates/runtime-template/node_modules
            templates/runtime-template/dist
            packages/agent-runtime/templates/sales-bdr-pipeline/dist
          key: ci-prepared-v2-${{ runner.os }}-bun${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/sdk/examples/*/package.json', 'scripts/package.json', 'templates/runtime-template/package.json', 'prisma/schema*.prisma', 'apps/api/src/generated/*.ts', 'packages/*/src/**', 'packages/*/tsup.config.*', 'packages/sdk/bin/**', 'templates/runtime-template/src/**', 'templates/runtime-template/vite.config.*', 'packages/agent-runtime/templates/sales-bdr-pipeline/src/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/.shogo/**', 'packages/agent-runtime/templates/sales-bdr-pipeline/template.json', 'scripts/postinstall.ts', 'scripts/db-generate-all.ts', 'scripts/materialize-runtime-template.ts', 'packages/agent-runtime/scripts/build-template-dists.ts') }}

      - name: Restore bun dependencies
        id: bun-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: bun-ci-bun${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-ci-bun${{ steps.setup-bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace packages
        # `bun run test` needs the compiled `dist/` artifacts for cross-package
        # imports — see the "Build workspace packages" comment in ci.yml.
        if: steps.workspace-clock-cache.outputs.cache-hit != 'true'
        run: bun run build:packages

      # The guard: shift the clock with something that provably moved it, or fail
      # the run. Every step after this inherits the choice through $GITHUB_ENV.
      #
      # The in-process preload is tried FIRST, and the reason is a measurement,
      # not taste. The first run of this job (libfaketime at +7/+30/+90) flagged
      # 11 sweeper tests in packages/agent-runtime — "keeps fresh ones", the
      # exec-cwd marker sweep, spool cleanup, task-output rows — and all 11 pass
      # under the preload at the same offset. libfaketime fakes `stat()` as well
      # as `Date`, so a fixture that derives an mtime from `Date.now()` (already
      # shifted) has the offset applied a second time when it reads it back, and
      # the sweeper sees files 30 days in the future. A harness that invents
      # bombs is worse than no harness.
      - name: Shift the clock and prove it moved
        id: clock
        run: |
          set -euo pipefail
          expected=$(( OFFSET_DAYS * 86400 ))
          base=$(date -u +%s)

          # 1. The preload: only `Date` moves; the filesystem keeps real time, so a
          #    file written "now" is as old as the process thinks it is.
          preload_now=$(SHOGO_TEST_CLOCK_OFFSET_DAYS="${OFFSET_DAYS}" bun --no-env-file \
            --preload ./scripts/test-clock-offset-preload.ts -e 'console.log(Math.floor(Date.now() / 1000))' \
            || echo "${base}")
          preload_delta=$(( preload_now - base ))
          echo "preload probe: bun reads ${preload_delta}s ahead (expected ~${expected}s)"
          if [ "${preload_delta}" -ge $(( expected - 3600 )) ] && [ "${preload_delta}" -le $(( expected + 3600 )) ]; then
            echo "clock_mode=preload" >> "${GITHUB_ENV}"
            echo "SHOGO_TEST_CLOCK_OFFSET_DAYS=${OFFSET_DAYS}" >> "${GITHUB_ENV}"
            echo "Shifted the clock +${OFFSET_DAYS}d with the Bun Date preload."
            exit 0
          fi

          # 2. libfaketime, for a Bun that will not take a preload. Still a valid
          #    signal — but read a red cell with the stat() caveat above in mind.
          echo "::warning::The preload did not shift the clock; falling back to libfaketime (which also fakes stat())."
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfaketime
          lib=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
          shifted=$(FAKETIME="+${OFFSET_DAYS}d" LD_PRELOAD="${lib}" FAKETIME_DONT_FAKE_MONOTONIC=1 \
            bun -e 'console.log(Math.floor(Date.now() / 1000))' || echo "${base}")
          delta=$(( shifted - base ))
          echo "libfaketime probe: bun reads ${delta}s ahead (expected ~${expected}s)"
          if [ "${delta}" -ge $(( expected - 3600 )) ]; then
            echo "clock_mode=libfaketime" >> "${GITHUB_ENV}"
            {
              echo "FAKETIME=+${OFFSET_DAYS}d"
              echo "FAKETIME_DONT_FAKE_MONOTONIC=1"
              echo "LD_PRELOAD=${lib}"
            } >> "${GITHUB_ENV}"
            echo "Shifted the clock +${OFFSET_DAYS}d with libfaketime."
            exit 0
          fi

          echo "::error::Neither scripts/test-clock-offset-preload.ts nor libfaketime moved the clock. Refusing to report a green run that tested today's date."
          exit 1

      - name: Confirm the clock the suite will see
        run: |
          set -euo pipefail
          # The preload shifts only a process that loads it, so this probe has to load
          # it too — without that, a +30d leg printed today's date and the log line
          # contradicted the guard above. libfaketime arrives through LD_PRELOAD in
          # $GITHUB_ENV and needs nothing extra here.
          preload_args=()
          if [ "${clock_mode}" = "preload" ]; then
            preload_args=(--no-env-file --preload ./scripts/test-clock-offset-preload.ts)
          fi
          now=$(bun "${preload_args[@]}" -e 'console.log(new Date().toISOString())')
          echo "clock_mode=${clock_mode}: suite clock reads ${now} (offset +${OFFSET_DAYS}d)"
          if [ "${clock_mode}" = "preload" ]; then
            # `date` is not preloaded, so this delta is the real one. A short delta
            # means the preload did not take and the suite would test today's date.
            read_epoch=$(bun "${preload_args[@]}" -e 'console.log(Math.floor(Date.now() / 1000))')
            delta=$(( read_epoch - $(date -u +%s) ))
            echo "suite clock delta: ${delta}s (expected ~$(( OFFSET_DAYS * 86400 ))s)"
            if [ "${delta}" -lt $(( OFFSET_DAYS * 86400 - 3600 )) ]; then
              echo "::error::clock_mode=preload but the suite clock reads only ${delta}s ahead. Refusing to run against today's date."
              exit 1
            fi
          fi
          echo "### Clock +${OFFSET_DAYS}d — ${clock_mode}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Test
        id: test
        run: |
          set -o pipefail
          bun run test -- --packages "${{ matrix.leg.packages }}" 2>&1 | tee "${RUNNER_TEMP}/clock.log"

      # A file the serial retry rescued is a pass, but a suspicious one: at a shifted
      # clock a test that fails in the parallel pool and passes alone is usually a
      # bomb whose two clock reads drifted apart (SHO-505's shape). Say so instead of
      # letting the leg report a silent 0-fail.
      - name: Flag retry-rescued files
        if: always()
        run: |
          set -uo pipefail
          rescued=$(grep -c '^RETRY-RESCUED ' "${RUNNER_TEMP}/clock.log" 2>/dev/null || true)
          if [ "${rescued:-0}" -gt 0 ]; then
            echo "::warning::${rescued} file(s) failed in the parallel pool and passed on serial retry — read those as possible clock bombs, not flake."
            {
              echo "### Clock +${OFFSET_DAYS}d — ${rescued} file(s) rescued by serial retry"
              echo
              echo '```'
              grep '^RETRY-RESCUED ' "${RUNNER_TEMP}/clock.log" || true
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      # A failure at +N is a bomb: the suite is green on main today. List every
      # failing file in the job summary and on the issue, so the fix does not
      # start with "find the failing test in 17,000".
      - name: Summarise the failures
        if: failure()
        run: |
          set -euo pipefail
          {
            echo "### Clock +${OFFSET_DAYS}d — ${{ matrix.leg.name }} failed"
            echo
            echo "These tests pass on \`main\` today and fail ${OFFSET_DAYS} days from now (\`${clock_mode}\` clock)."
            echo
            echo '```'
            bash scripts/ci/failing-tests.sh "${RUNNER_TEMP}/clock.log" 60 || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          bash scripts/ci/failing-tests.sh "${RUNNER_TEMP}/clock.log" 60 > "${RUNNER_TEMP}/failures.txt" || true

      - name: Open or update the future-clock-red issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The whole job runs on a shifted clock; `gh` needs the real one or its
          # TLS checks reject a +90d runner as out of certificate validity.
          LD_PRELOAD: ''
          FAKETIME: ''
        run: |
          set -euo pipefail
          label=future-clock-red
          title="future-clock-red: clock +${OFFSET_DAYS}d breaks ${{ matrix.leg.name }}"
          gh label create "${label}" --repo "${GITHUB_REPOSITORY}" --color D93F0B \
            --description "A test that passes today and fails N days from now (future-clock nightly)" || true

          # Exact title, not a search: "clock +7d" also matches the other leg of
          # the same offset, and a comment on the wrong issue is worse than none.
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${label}" --state open \
            --limit 100 --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
            | awk -F'\t' -v want="${title}" '$2 == want { print $1; exit }')

          {
            echo "At ${OFFSET_DAYS} days from now, \`${{ matrix.leg.name }}\` fails on \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA}, with a clock that reads \`${clock_mode}\` +${OFFSET_DAYS}d. These tests are green on \`main\` today."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Card: SHO-507"
            echo
            echo '<details><summary>failing tests</summary>'
            echo
            echo '```'
            cat "${RUNNER_TEMP}/failures.txt" 2>/dev/null || echo '(see the run log)'
            echo '```'
            echo
            echo '</details>'
            echo
            echo "Fix it the SHO-505 way: the production code takes one injected \`now\` per path, and the test pins the clock next to its seeds (\`setSystemTime\`) or derives them from \`Date.now()\`. Never widen a window or change a constant to make it pass."
          } > "${RUNNER_TEMP}/issue.md"

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/issue.md"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --label "${label}" \
              --body-file "${RUNNER_TEMP}/issue.md"
          fi

      - name: Close the future-clock-red issue when this offset is green
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LD_PRELOAD: ''
          FAKETIME: ''
        run: |
          set -euo pipefail
          label=future-clock-red
          title="future-clock-red: clock +${OFFSET_DAYS}d breaks ${{ matrix.leg.name }}"
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${label}" --state open \
            --limit 100 --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
            | awk -F'\t' -v want="${title}" '$2 == want { print $1; exit }')
          [ -n "${existing}" ] || exit 0
          gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" \
            --body "Green again: clock +${OFFSET_DAYS}d passes on \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" --reason completed
