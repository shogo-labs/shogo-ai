apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: docs
  namespace: shogo-staging-system
  labels:
    app.kubernetes.io/part-of: shogo
    environment: staging
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "3"
        # Always-on (min-scale >= 1): keep the activator out of the request
        # path once Ready. See the api ksvc's target-burst-capacity note.
        autoscaling.knative.dev/target-burst-capacity: "0"
    spec:
      containers:
        - name: docs
          image: us-ashburn-1.ocir.io/idin4oltblww/shogo/shogo-docs:staging-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
