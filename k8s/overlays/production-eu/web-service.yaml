apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: studio
  namespace: shogo-production-system
  labels:
    app.kubernetes.io/part-of: shogo
    environment: production
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "2"
        # 2026-07 India→EU migration: raised 10 → 20 (matches production-us) so
        # EU studio absorbs the load from the decommissioned production-india
        # region. See docs/runbooks/india-to-eu-migration.md §1.
        autoscaling.knative.dev/max-scale: "20"
    spec:
      containers:
        - name: web
          image: eu-frankfurt-1.ocir.io/idin4oltblww/shogo/shogo-web:production-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: API_UPSTREAM
              value: "http://api.shogo-production-system.svc.cluster.local"
            - name: API_HOST
              value: "api.shogo-production-system.svc.cluster.local"
            - name: DNS_RESOLVER
              value: "kube-dns.kube-system.svc.cluster.local"
            # Rendered into index.html at container start by
            # apps/mobile/docker/shogo-runtime-env.sh. The image itself is
            # environment-agnostic (promoted unchanged from staging).
            - name: SHOGO_APP_ENV
              value: "production_web"
            # Substituted by deploy.yml's "Apply Kubernetes manifests" step
            # (and SHOGO_APP_VERSION re-pinned by apply-prod-images.sh).
            - name: SHOGO_APP_VERSION
              value: "SHOGO_APP_VERSION_PLACEHOLDER"
            - name: GA4_MEASUREMENT_ID
              value: "GA4_MEASUREMENT_ID_PLACEHOLDER"
            - name: FB_PIXEL_ID
              value: "FB_PIXEL_ID_PLACEHOLDER"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
