apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  # shogo-db-critical, referenced by projects-pg and its pooler. deploy-eu
  # applies this before the cluster; listing it here keeps a plain
  # `kubectl apply -k` of the overlay self-sufficient.
  - priority-classes.yaml
  # The BuildKit namespace, ServiceAccount, LimitRange and ResourceQuota for
  # per-commit published images (SHO-485 §3). Applied here so a region cannot
  # turn the feature on with PUBLISH_BUILD_* and then have every Job rejected
  # for a missing namespace. The OCIR push Secret is NOT declared — see
  # docs/runbooks/published-images.md.
  - ../../published-builds
  - api-service.yaml
  - api-tunnel-ingress.yaml
  - api-public-ingress.yaml
  - web-service.yaml
  - studio-ws-ingress.yaml
  - docs-service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: shogo
      app.kubernetes.io/managed-by: kustomize
      environment: production
      region: eu-frankfurt-1
    includeSelectors: false

images:
  - name: shogo-api
    newName: eu-frankfurt-1.ocir.io/idin4oltblww/shogo/shogo-api
    newTag: production-latest
  - name: shogo-web
    newName: eu-frankfurt-1.ocir.io/idin4oltblww/shogo/shogo-web
    newTag: production-latest
  - name: shogo-docs
    newName: eu-frankfurt-1.ocir.io/idin4oltblww/shogo/shogo-docs
    newTag: production-latest
  - name: shogo-runtime
    newName: eu-frankfurt-1.ocir.io/idin4oltblww/shogo/shogo-runtime
    newTag: production-latest
