# =============================================================================
# node-image-gc DaemonSet
# =============================================================================
# Reclaims superseded `shogo-runtime` / `shogo-api` / `shogo-web` /
# `shogo-docs` image digests on every node, so a node can never sit in the
# 80-85% dead zone where the deploy gate refuses to roll out and the kubelet's
# own image GC (which starts at 85%) refuses to reclaim.
#
# Why a DaemonSet and not the kubelet flags: SHO-136 (#1645) added
# `--image-gc-high-threshold=70 --image-gc-low-threshold=60` to
# `kubelet_extra_args` for all three environments, but `node_metadata` is in
# the OKE pool's `lifecycle.ignore_changes`, so those flags only reach a node
# after a manual recycle — and no recycle has happened. Checked 2026-10-27 on
# all four production-US and all three staging nodes: no `imageGC*` key in
# /etc/kubernetes/kubelet-config.json and no `--image-gc-*` flag on the kubelet
# command line, so the 85/80 defaults are what actually apply. This is the same
# reason `k8s/base/inotify-tuner.yaml` exists, and it is built the same way.
#
# The 2026-10-26 staging incident (SHO-233): node 10.0.24.140 held 193 GB of
# images (50 images, 13 runtime + 12 api digests) on a 202 GB boot volume and
# sat at 80.6% for 13 h, failing four `Build, Test, and Deploy` runs at the
# pre-rollout gate. Nothing in the cluster would ever have reclaimed it.
#
# The selection logic lives in `scripts/node-image-gc.sh` — one file, used by
# this DaemonSet and by `scripts/__tests__/node-image-gc.test.ts`. The deploy
# workflows create the ConfigMap below from that file before applying this
# manifest:
#
#   kubectl create configmap node-image-gc --namespace=kube-system \
#     --from-file=node-image-gc.sh=scripts/node-image-gc.sh \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f k8s/base/node-image-gc.yaml
#
# Applied before the disk gate (not with inotify-tuner, after it) so a node
# that filled up between deploys is reclaimed before the gate looks at it.
#
# The script runs inside the node's own root so it uses the node's `crictl`,
# `df` and `jq` instead of shipping copies: `chroot /host /bin/sh
# /run/shogo-node-image-gc/node-image-gc.sh`. The ConfigMap is mounted inside
# the hostPath mount so that path resolves after the chroot — but ONLY inside
# this pod. On the host itself (a `kubectl debug node/...` shell) the same
# directory exists and is empty, so a hand-run has to exec into this pod; see
# the Usage block in scripts/node-image-gc.sh.
#
# The ConfigMap carries BOTH scripts from this repo, one copy each, and the
# deploy workflows build it from those files:
#
#   kubectl create configmap node-image-gc --namespace=kube-system \
#     --from-file=node-image-gc.sh=scripts/node-image-gc.sh \
#     --from-file=node-disk-taint.sh=scripts/node-disk-taint.sh \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The pod has two containers:
#   * gc          — the privileged reclaim pass (root, chroot /host).
#   * disk-taint  — a kubectl sidecar that reads the used% the gc pass wrote
#                   and holds `shogo.ai/disk-high=true:NoSchedule` on its own
#                   node in the 80-85% band the kubelet does not cover yet.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-image-gc
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-image-gc
    app.kubernetes.io/part-of: shogo
---
# The smallest grant that can hold the 80-85% band closed: read one node and
# patch its taints. No pods, no nodes/list, nothing cluster-wide beyond the
# object this pod is allowed to touch (and it only ever touches its own node).
#
# A TAINT, not a cordon: `check-node-disk-headroom.sh` and warm-pool-monitor
# treat a cordoned node as "being drained on purpose" and skip it, so a cordon
# would make a nearly-full node invisible to both — the exact opposite of what
# this is for. A taint keeps both checks looking at the node and only stops the
# scheduler from placing new pods on it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shogo-node-image-gc
  labels:
    app.kubernetes.io/name: node-image-gc
    app.kubernetes.io/part-of: shogo
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shogo-node-image-gc
  labels:
    app.kubernetes.io/name: node-image-gc
    app.kubernetes.io/part-of: shogo
subjects:
  - kind: ServiceAccount
    name: node-image-gc
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: shogo-node-image-gc
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-image-gc
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-image-gc
    app.kubernetes.io/part-of: shogo
    app.kubernetes.io/component: infrastructure
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-image-gc
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-image-gc
        app.kubernetes.io/part-of: shogo
    spec:
      hostPID: true
      priorityClassName: system-node-critical
      serviceAccountName: node-image-gc
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
      containers:
        - name: gc
          # Fully qualified: the nodes run cri-o with
          # `short-name-mode=enforcing`, which rejects a bare `busybox:1.36` as
          # ambiguous (ImageInspectError). Same trap as warm-pool-monitor.
          image: docker.io/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - exec chroot /host /bin/sh /run/shogo-node-image-gc/node-image-gc.sh
          env:
            # The container's UTS hostname is the pod name, not the node, so
            # the node name has to come from the downward API — every log line
            # and the summary are keyed on it.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Reclaim at 65%: comfortably under the 80% deploy gate and under
            # the 85% kubelet GC, so the pass happens while there is still
            # room to pull the image a rollout needs.
            - name: RECLAIM_PCT
              value: "65"
            # Newest digests kept per repo: a rollback stays warm, and the
            # image the prepuller is pulling right now is never a candidate.
            - name: KEEP_PER_REPO
              value: "2"
            - name: INTERVAL_S
              value: "600"
            # A failed pass (cri-o unreachable, nothing removed) retries in 30s
            # and, after 3 in a row, the container exits 1 — so the restart
            # count and CrashLoopBackOff are what a supervisor sees, instead of
            # a pass that skipped 11 candidates and returned 0 (SHO-592).
            - name: RETRY_S
              value: "30"
            - name: MAX_FAILED_PASSES
              value: "3"
            # Named in the failure log line the SigNoz alert matches on.
            - name: CRI_SOCKET
              value: "/var/run/crio/crio.sock"
          securityContext:
            # chroot into the node root and drive cri-o: needs root + the host
            # filesystem, exactly like the inotify tuner's init container.
            privileged: true
          # Ready means "this node has completed a GC pass", which is what the
          # deploy's `kubectl rollout status` waits on before the disk gate
          # samples the cluster. A pass over a full node can take several
          # minutes (10 GB images are slow to delete), hence the long window.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /host/run/shogo-node-image-gc-state/last-pass
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: host
              mountPath: /host
            - name: script
              mountPath: /host/run/shogo-node-image-gc
            - name: state
              mountPath: /host/run/shogo-node-image-gc-state
        # ---- 80-85% scheduling guard (SHO-592 §4) -------------------------
        # The kubelet only taints at DiskPressure (85%). Between 80% and 85%
        # the deploy gate refuses to roll out but the SCHEDULER still places
        # pods there: on 2026-11-26 pods evicted from .5 landed on .184 at 75%
        # and pushed it to 84%, four points from the eviction line.
        #
        # So the GC container publishes the used% it measured to a status
        # file, and this sidecar reconciles ONE taint from it:
        #   * at/above TAINT_PCT (80)  → shogo.ai/disk-high=true:NoSchedule
        #   * below UNTAINT_PCT (75)   → remove it
        #   * in between               → leave it exactly as it is
        # The 5-point gap is deliberate: without it a node hovering on one
        # threshold would taint/untaunt on every pass and thrash the scheduler.
        #
        # It is a separate container because the GC container chroots into the
        # node root with busybox and has no kubectl; this one is the same
        # pinned image warm-pool-monitor uses, and needs nothing from the host.
        - name: disk-taint
          image: docker.io/alpine/k8s:1.31.5
          command:
            - /bin/sh
            - /run/shogo-node-image-gc/node-disk-taint.sh
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: STATE_DIR
              value: /run/shogo-node-image-gc-state
            # Must match scripts/node-image-gc.sh's RECLAIM_PCT story: taint at
            # the deploy gate's own 80%, release at 75.
            - name: TAINT_PCT
              value: "80"
            - name: UNTAINT_PCT
              value: "75"
            # Three gc passes (INTERVAL_S 600 + RETRY_S 30) of slack. Older than
            # that and the reading is not a description of the node any more —
            # the sidecar leaves the taint exactly as it is instead of acting on
            # a number whose writer has stopped.
            - name: MAX_READING_AGE_S
              value: "1800"
            - name: INTERVAL_S
              value: "60"
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /run/shogo-node-image-gc
            - name: state
              mountPath: /run/shogo-node-image-gc-state
      volumes:
        - name: host
          hostPath:
            path: /
        - name: script
          configMap:
            name: node-image-gc
        - name: state
          emptyDir: {}
